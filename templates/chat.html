<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Charon</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/app_icon_192.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Charon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 10% 20%, #fffcfd 0%, #fbf3f5 35%, #f3e2e6 70%, #ebd3d9 100%);
    background-attachment: fixed;
    font-family: "Songti SC", "STSong", Georgia, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    color: #5a4550;
  }
  #app {
    display: flex;
    height: 100vh; height: 100dvh;
    padding: 14px;
    gap: 14px;
    position: relative;
    z-index: 2;
    width: 100%;
  }

  /* ---- 左侧波点导航栏 ---- */
  #nav {
    width: 60px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 24px 0;
    background: rgba(255, 238, 241, 0.6);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px 0 rgba(184, 118, 138, 0.08);
  }
  #nav::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, #000000 0%, #000000 20%, #c0b8c0 30%, #ffffff 40%, #ffffff 60%, #c0b8c0 80%, #000000 100%);
    -webkit-mask-image: 
      radial-gradient(circle, #000 24%, transparent 24.5%),
      radial-gradient(circle, #000 24%, transparent 24.5%);
    -webkit-mask-size: 22px 22px; 
    -webkit-mask-position: 0 0, 11px 11px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.85;
  }
  
  .nav-icon, #send-btn, .action-circle-btn {
    position: relative;
    z-index: 1;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: none !important;
    background: 
      radial-gradient(circle, rgba(255, 143, 163, 0.22) 15%, transparent 15.5%),
      radial-gradient(circle, rgba(255, 143, 163, 0.22) 15%, transparent 15.5%),
      rgba(255, 255, 255, 0.95) !important;
    background-size: 6px 6px, 6px 6px, 100% 100% !important;
    background-position: 0 0, 3px 3px, 0 0 !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #ff8fa3 !important;
    text-decoration: none;
    transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08) !important;
    cursor: pointer;
    padding: 0;
  }
  .nav-icon svg, .action-circle-btn svg { width: 20px; height: 20px; stroke-width: 1.5px; }
  .nav-icon:hover, #send-btn:hover, .action-circle-btn:hover {
    transform: translateY(-2px) scale(1.05);
    background-color: rgba(255, 255, 255, 0.98) !important;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12) !important; 
  }
  #send-btn svg { width: 18px; height: 18px; stroke-width: 1.5px; transform: rotate(-10deg) translate(-1px, 1px); transition: transform 0.2s ease; }
  #send-btn:hover svg { transform: rotate(5deg) scale(1.1); }
  #send-btn:disabled { opacity: 0.5; filter: grayscale(50%); cursor: default; box-shadow: none !important; }

  /* ---- 中间玻璃舱对话区 ---- */
  #main {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border-radius: 28px; box-shadow: 0 12px 40px rgba(184, 118, 138, 0.10); overflow: hidden; position: relative;
  }
  #main::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%), radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%);
    background-size: 10px 10px; background-position: 0 0, 5px 5px; pointer-events: none; z-index: 0;
  }
  
  /* ---- Header 酷黑渐变 ---- */
  #header {
    padding: 20px 24px 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.2); flex-shrink: 0;
    display: flex; align-items: center; gap: 14px; position: relative;
    background: linear-gradient(to right, #000000 0%, #000000 52%, rgba(26, 18, 30, 0.9) 62%, #cf7d90 85%, #ffb3c1 100%);
  }
  #header::before {
    content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 65%;
    background-image: radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%), radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%);
    background-size: 11px 11px; background-position: 0 0, 5.5px 5.5px;
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%); pointer-events: none; z-index: 0;
  }
  
  .avatar-wrapper { position: relative; display: inline-block; width: 36px; height: 36px; flex-shrink: 0; }
  .avatar-wrapper.header-avatar-wrap { width: 44px; height: 44px; }
  .avatar-wrapper .msg-avatar, .avatar-wrapper #header-avatar {
    border: 1.5px solid #ffffff; box-shadow: 0 0 8px rgba(255, 255, 255, 0.6); 
  }
  .avatar-wrapper .star-accent { position: absolute; font-size: 15px; pointer-events: none; user-select: none; animation: star-pulse 2s infinite ease-in-out; }
  .avatar-wrapper.charon .star-accent { top: -6px; left: -6px; color: #000000; text-shadow: 0 0 4px #000000, 0 0 10px rgba(0, 0, 0, 0.95); }
  .avatar-wrapper.user .star-accent { top: -6px; right: -6px; color: #ffb3c1; text-shadow: 0 0 4px #ff5e84, 0 0 10px rgba(255, 94, 132, 0.95); }
  
  .avatar-tag {
    position: absolute; font-family: "Dancing Script", cursive; font-size: 11px; white-space: nowrap; pointer-events: none; user-select: none; z-index: 2;
  }
  .avatar-wrapper.charon .avatar-tag { top: -15px; left: 50%; transform: translateX(-50%); color: #5a4550; text-shadow: 0 0 4px rgba(255, 255, 255, 0.8); }
  .avatar-wrapper.user .avatar-tag { top: -15px; left: 50%; transform: translateX(-50%); color: #cf7d90; text-shadow: 0 0 4px rgba(255, 255, 255, 0.8); }

  #header-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  #header-text { position: relative; z-index: 1; min-width: 0; }
  #header .brand {
    font-family: "Georgia", "Songti SC", serif; font-size: 26px; font-style: italic; letter-spacing: 3px; color: #e599a9; font-weight: 500; line-height: 1.2; text-transform: uppercase;
    text-shadow: 0 0 10px rgba(229, 153, 169, 0.8), 0 0 20px rgba(229, 153, 169, 0.4);
  }
  #header .sub { font-size: 11px; color: rgba(255, 255, 255, 0.7); letter-spacing: 1px; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .status-badge { background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.25); padding: 1px 7px; border-radius: 5px; font-size: 10px; color: #ffffff; display: inline-flex; align-items: center; gap: 4px; }
  #model-select { font-size: 10px; color: #fff; background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 5px; padding: 1px 4px; max-width: 150px; outline: none; }
  #model-select option { color: #000; }
  .model-select-wrap { display: inline-flex; align-items: center; gap: 4px; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #84cc9a; display: inline-block; box-shadow: 0 0 6px #84cc9a; }
  .status-dot.low { background: #c3a1ad; box-shadow: 0 0 6px #c3a1ad; }
  
  .header-signature-wrap { position: relative; z-index: 1; margin-left: auto; display: inline-flex; align-items: center; }
  .header-signature { font-family: "Dancing Script", cursive; font-size: 22px; color: rgba(255, 255, 255, 0.92); text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); user-select: none; pointer-events: none; }

  /* ---- 聊天区 ---- */
  #messages {
    position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 22px 24px;
    display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch;
  }
  .msg-row { display: flex; align-items: flex-start; gap: 10px; max-width: 88%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.charon { align-self: flex-start; }
  .msg-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .msg-col { display: flex; flex-direction: column; min-width: 0; }
  .msg-row.user .msg-col { align-items: flex-end; }
  .msg-row.charon .msg-col { align-items: flex-start; }
  .msg-time { font-size: 10px; color: #b08d98; margin: 4px 4px 0; }
  .msg-time-row { display: flex; align-items: center; gap: 4px; }

  /* 气泡精细印刷波纹 */
  .bubble {
    position: relative; padding: 12px 18px; line-height: 1.6; font-size: 15px; word-wrap: break-word; white-space: pre-wrap;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: pointer;
  }
  .bubble.user {
    background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 15%, transparent 15.5%), radial-gradient(circle, rgba(255, 255, 255, 0.16) 15%, transparent 15.5%), linear-gradient(135deg, #f3b0c3, #e593a4);
    background-size: 6px 6px, 6px 6px, 100% 100%; background-position: 0 0, 3px 3px, 0 0;
    color: #ffffff; border-radius: 18px 4px 18px 18px; box-shadow: 0 4px 15px rgba(184, 96, 118, 0.18);
  }
  .bubble.charon {
    background: radial-gradient(circle, rgba(229, 153, 171, 0.08) 15%, transparent 15.5%), radial-gradient(circle, rgba(229, 153, 171, 0.08) 15%, transparent 15.5%), rgba(255, 255, 255, 0.55);
    background-size: 6px 6px, 6px 6px, 100% 100%; background-position: 0 0, 3px 3px, 0 0;
    border: none; color: #6b5460; border-radius: 4px 18px 18px 18px; box-shadow: 0 4px 15px rgba(184, 118, 138, 0.05);
  }
  .bubble.pending { opacity: 0.5; }

  /* --- 拓展的富媒体消息气泡样式 --- */
  .bubble-img { max-width: 220px; max-height: 220px; border-radius: 12px; object-fit: cover; display: block; margin: 4px 0; border: 2px solid rgba(255,255,255,0.8); cursor: zoom-in; }
  .bubble-sticker-img { max-width: 120px; max-height: 120px; object-fit: contain; display: block; background: transparent; }
  
  .bubble-transfer-card {
    background: linear-gradient(135deg, #ff7a93 0%, #ff5e84 100%);
    color: #ffffff; padding: 14px 18px; border-radius: 16px; min-width: 200px;
    box-shadow: 0 8px 20px rgba(255, 94, 132, 0.25); border: 1.5px solid rgba(255,255,255,0.25);
  }
  .bubble-transfer-card .tf-title { display: flex; align-items: center; gap: 8px; font-size: 13px; opacity: 0.9; font-weight: bold; }
  .bubble-transfer-card .tf-amount { font-family: "Georgia", serif; font-size: 26px; font-weight: bold; margin: 8px 0; }
  .bubble-transfer-card .tf-msg { font-size: 12px; opacity: 0.85; border-top: 1px dashed rgba(255,255,255,0.3); padding-top: 6px; }

  /* 底部输入框与工具面板 */
  #input-bar {
    display: flex; gap: 10px; padding: 14px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.2); flex-shrink: 0; position: relative; z-index: 1; overflow: hidden; align-items: center;
  }
  #input-bar::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to right, #ffffff 0%, #ffffff 11%, #c0b8c0 33%, #000000 45%, #000000 55%, #c0b8c0 67%, #ffffff 89%, #ffffff 100%);
    -webkit-mask-image: radial-gradient(circle, #000 24%, transparent 24.5%), radial-gradient(circle, #000 24%, transparent 24.5%);
    -webkit-mask-size: 22px 22px; -webkit-mask-position: 0 0, 11px 11px; pointer-events: none; z-index: 0; opacity: 0.85;
  }
  #input-bar textarea {
    position: relative; z-index: 1; flex: 1; resize: none; border-radius: 16px; border: 1.5px solid rgba(255, 255, 255, 0.6);
    background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #5a4550; padding: 11px 16px; font-size: 15px; font-family: inherit; max-height: 100px; outline: none;
    box-shadow: 0 4px 12px rgba(184, 118, 138, 0.05);
  }
  #input-bar textarea:focus { background: rgba(255, 255, 255, 0.9); border-color: rgba(229, 153, 169, 0.8); }

  /* 附加拓展工具栏 */
  #input-accessory-panel {
    display: none; justify-content: space-around; padding: 12px 14px;
    background: rgba(255, 255, 255, 0.5); border-top: 1px dashed rgba(229, 153, 169, 0.2);
    position: relative; z-index: 1;
  }
  #input-accessory-panel.open { display: flex; }
  .accessory-item-btn {
    display: flex; flex-direction: column; align-items: center; background: none; border: none; cursor: pointer; color: #a66275; font-family: inherit; font-size: 11px; gap: 4px;
  }
  .accessory-item-icon {
    width: 44px; height: 44px; border-radius: 14px; background: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: transform 0.2s;
  }
  .accessory-item-btn:hover .accessory-item-icon { transform: scale(1.08); }

  /* ---- 右侧状态面板（DESK 手账区） ---- */
  #panel {
    width: 260px; flex-shrink: 0; display: none; flex-direction: column;
    padding: 22px 18px; background: rgba(255, 235, 240, 0.55); border-radius: 24px; position: relative; overflow: hidden;
    box-shadow: 0 8px 32px rgba(184, 118, 138, 0.08);
  }
  @media (min-width: 769px) { #panel { display: flex; } }
  #panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(to bottom, #ffeef1 0%, #ffeef1 20%, #ffffff 35%, #ffffff 65%, #ffeef1 80%, #ffeef1 100%);
    -webkit-mask-image: radial-gradient(circle, #000 15%, transparent 15.5%), radial-gradient(circle, #000 15%, transparent 15.5%);
    -webkit-mask-size: 14px 14px; -webkit-mask-position: 0 0, 7px 7px; pointer-events: none; z-index: 0; opacity: 0.85;
  }
  .panel-child { position: relative; z-index: 1; }
  .panel-title {
    font-family: "Georgia", "Songti SC", serif; font-size: 15px; letter-spacing: 3px; color: #a66275; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; text-shadow: 0 2px 4px rgba(255,255,255,0.8);
  }

  /* --- 仿真实物便签 --- */
  .sticky-note-stack { position: relative; width: 100%; display: flex; flex-direction: column; margin-top: 15px; margin-bottom: 18px; z-index: 1; }
  .sticky-note-card {
    position: relative; border-radius: 3px 14px 14px 14px; padding: 12px 11px; width: 88%; aspect-ratio: 1 / 0.572; 
    box-shadow: 0 8px 20px rgba(120, 80, 95, 0.18); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    -webkit-user-select: none; user-select: none; cursor: pointer; flex-shrink: 0;
  }
  .sticky-note-card:hover { transform: rotate(0deg) translateY(-4px) scale(1.03) !important; z-index: 100 !important; }
  .sticky-note-text { font-size: 12px; line-height: 1.42; font-family: "Songti SC", serif; word-wrap: break-word; }
  .note-star-btn { position: absolute; bottom: 8px; right: 12px; background: none; border: none; font-size: 18px; cursor: pointer; color: #e5a4b5; }
  .note-star-btn.active { color: #ff8fa3 !important; }

  /* --- 双层抽屉 --- */
  .drawer-wrapper { display: flex; flex-direction: column; gap: 12px; margin-top: auto; padding-top: 10px; }
  .drawer-btn {
    background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255,255,255,1); border-radius: 12px; 
    padding: 14px 10px; text-align: center; cursor: pointer; position: relative;
    color: #a66275; font-family: "Georgia", serif; box-shadow: 0 4px 15px rgba(184, 118, 138, 0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .drawer-btn-title { font-weight: bold; font-size: 13px; }
  .drawer-btn-count { font-size: 10px; opacity: 0.75; }
  .drawer-btn.layer-full { background: #fff5f6; border-color: rgba(255,94,132,0.6); animation: drawer-warn-glow 1.5s infinite alternate; }

  /* --- 朋友圈 (Moments) UI --- */
  #moments-wrapper {
    flex: 1; min-width: 0; display: none; flex-direction: column;
    background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border-radius: 28px; box-shadow: 0 12px 40px rgba(184, 118, 138, 0.10); overflow: hidden; position: relative;
  }
  #moments-wrapper::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%), radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%);
    background-size: 10px 10px; background-position: 0 0, 5px 5px; pointer-events: none; z-index: 0;
  }
  #moments-feed { flex: 1; overflow-y: auto; padding: 0 0 80px 0; display: flex; flex-direction: column; gap: 24px; position: relative; z-index: 1; }
  .moments-cover-section {
    position: relative; width: 100%; height: 260px;
    background: linear-gradient(135deg, #1a121e 0%, #2c1a30 40%, #cf7d90 85%, #ffb3c1 100%);
    overflow: hidden; margin-bottom: 45px; flex-shrink: 0;
  }
  .cover-branding-text { position: absolute; left: 24px; bottom: 30px; color: #ffffff; z-index: 2; }
  .cover-branding-text h1 { font-family: "Georgia", "Songti SC", serif; font-size: 32px; font-style: italic; letter-spacing: 4px; margin: 0; font-weight: 500; }
  .moments-user-profile { position: absolute; right: 28px; bottom: -30px; display: flex; align-items: flex-end; gap: 12px; z-index: 5; }
  .moments-avatar-polaroid {
    position: relative; width: 85px; height: 85px; background: #ffffff; padding: 6px 6px 14px 6px;
    border-radius: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); transform: rotate(-3deg);
  }
  .moments-avatar-polaroid img { width: 100%; height: 100%; object-fit: cover; border-radius: 2px; }
  .profile-name-label { font-family: "Songti SC", "Georgia", serif; font-weight: bold; font-size: 18px; color: #ffb3c1; margin-bottom: 24px; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }

  .moment-card-container { padding: 0 24px; width: 100%; }
  .moment-card {
    background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 20px; padding: 22px; box-shadow: 0 8px 24px rgba(184, 118, 138, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.9); position: relative; overflow: hidden;
  }
  .moment-retro-stamp {
    position: absolute; top: 12px; right: 14px; font-family: "Courier New", monospace;
    font-size: 9px; text-transform: uppercase; padding: 3px 6px; border: 1px dashed rgba(229,153,169,0.5);
    border-radius: 4px; color: rgba(229,153,169,0.7); transform: rotate(10deg); pointer-events: none;
  }
  .moment-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .moment-author { font-family: "Georgia", "Songti SC", serif; font-size: 15px; font-weight: bold; color: #a66275; }
  .moment-time { font-family: "Courier New", monospace; font-size: 11px; color: #b08d98; margin-top: 2px; }
  .moment-delete-link { font-size: 10px; color: #c08ea3; cursor: pointer; text-decoration: none; margin-left: 10px; }
  .moment-content { font-size: 14.5px; line-height: 1.7; color: #4a3742; margin-bottom: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .moment-img { max-width: 100%; max-height: 300px; border-radius: 8px; margin-bottom: 12px; object-fit: cover; }
  
  .moment-actions { display: flex; gap: 16px; align-items: center; padding-top: 12px; border-top: 1px dashed rgba(229,153,169,0.2); }
  .action-btn { background: none; border: none; padding: 4px 8px; font-size: 13px; color: #b08d98; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .action-btn.liked { color: #ff5e84; }
  .moment-likes { background: rgba(255, 238, 241, 0.45); border-radius: 10px; padding: 8px 12px; margin-top: 12px; font-size: 12px; color: #a66275; }
  
  .moment-comments { margin-top: 8px; background: rgba(255, 255, 255, 0.4); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .comment-item { font-size: 13px; line-height: 1.5; color: #5a4550; display: flex; justify-content: space-between; align-items: flex-start; }
  .comment-author { font-weight: bold; color: #a66275; margin-right: 4px; }
  .comment-delete-btn { font-size: 12px; color: #c08ea3; cursor: pointer; }
  
  .comment-input-area { display: none; margin-top: 12px; align-items: center; gap: 8px; }
  .comment-input-area.active { display: flex; }
  .comment-input { flex: 1; border: 1px solid rgba(229,153,169,0.3); border-radius: 16px; padding: 8px 12px; background: rgba(255,255,255,0.8); font-size: 13px; outline: none; }

  /* 悬浮发布按钮 */
  .fab-publish-btn {
    position: absolute; right: 24px; bottom: 24px; width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #f3b0c3, #e593a4); color: #ffffff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 10;
    box-shadow: 0 8px 24px rgba(229, 147, 164, 0.4); transition: transform 0.3s;
  }

  /* 钱包、转账面板样式 */

  /* 信息单行输入样式 */

  .profile-avatar-row { display: flex; align-items: center; gap: 14px; }

  .transfer-log-item { display: flex; justify-content: space-between; font-size: 12px; padding: 8px; border-radius: 6px; background: rgba(0,0,0,0.02); }

  /* 统一悬浮动作栏 */
  #bubble-menu { display: none; position: absolute; z-index: 1000; background: rgba(26,18,30,0.95); border-radius: 8px; padding: 6px 4px; }

    to { box-shadow: 0 0 16px rgba(255, 94, 132, 0.5); }
  }
</style>

function apiUrl(path) {
  const sep = path.includes('?') ? '&' : '?';
  return CODE ? `${path}${sep}code=${encodeURIComponent(CODE)}` : path;
}

function formatTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return '';
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  return h + ':' + m;
}

function addDoubleTapListener(element, callback) {
  let lastTap = 0;
  element.addEventListener('click', function(e) {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    if (tapLength < 300 && tapLength > 0) {
      e.preventDefault();
      callback(e);
    }
    lastTap = currentTime;
  });
}

// ---- 渲染富媒体消息气泡 ----
function renderMsgRow(role, content, createdAt, pending, msgId, model, isFailed, msgType = 'text', extra = null) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'charon');
  if (msgId) row.dataset.msgId = msgId;
  if (createdAt) row.dataset.createdAt = createdAt;
  if (model) row.dataset.model = model;

  const avatarWrap = document.createElement('div');
  avatarWrap.className = 'avatar-wrapper ' + (role === 'user' ? 'user' : 'charon');

  const tag = document.createElement('span');
  tag.className = 'avatar-tag';
  tag.textContent = role === 'user' ? 'Seraphina' : 'Charon';
  avatarWrap.appendChild(tag);

  const avatar = document.createElement('img');
  avatar.className = 'msg-avatar';
  avatar.src = role === 'user' ? AVATAR_USER : AVATAR_CHARON;
  avatarWrap.appendChild(avatar);

  const star = document.createElement('span');
  star.className = 'star-accent';
  star.textContent = '✦';
  avatarWrap.appendChild(star);

  row.appendChild(avatarWrap);

  const col = document.createElement('div');
  col.className = 'msg-col';

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'charon') + (pending ? ' pending' : '');

  // 渲染判断
  if (pending && !content) {
    bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
  } else {
    if (msgType === 'image' && extra && extra.image_url) {
      bubble.innerHTML = `<img src="${extra.image_url}" class="bubble-img" onclick="window.open('${extra.image_url}', '_blank')">`;
      if (content) {
        const textSpan = document.createElement('div');
        textSpan.textContent = content;
        textSpan.style.marginTop = '6px';
        bubble.appendChild(textSpan);
      }
    } else if (msgType === 'sticker' && extra && extra.image_url) {
      bubble.style.background = 'transparent';
      bubble.style.boxShadow = 'none';
      bubble.innerHTML = `<img src="${extra.image_url}" class="bubble-sticker-img">`;
    } else if (msgType === 'transfer' && extra) {
      bubble.style.background = 'transparent';
      bubble.style.boxShadow = 'none';
      bubble.style.padding = '0';
      bubble.innerHTML = `
        <div class="bubble-transfer-card" onclick="openWalletModal()">
          <div class="tf-title">💸 心意转账</div>
          <div class="tf-amount">¥${extra.amount}</div>
          <div class="tf-msg">“${escapeHtml(extra.message || '给你买杯奶茶')}”</div>
        </div>
      `;
    } else {
      bubble.textContent = content;
    }
  }
  col.appendChild(bubble);

  let modelTagEl = null;
  if (role !== 'user' && model) {
    modelTagEl = document.createElement('div');
    modelTagEl.className = 'model-tag';
    modelTagEl.textContent = model;
    col.appendChild(modelTagEl);
  }

  const timeRow = document.createElement('div');
  timeRow.className = 'msg-time-row';
  const timeEl = document.createElement('span');
  timeEl.className = 'msg-time';
  timeEl.textContent = formatTime(createdAt);
  timeRow.appendChild(timeEl);
  col.appendChild(timeRow);
  row.appendChild(col);

  addDoubleTapListener(bubble, (e) => {
    if (row.classList.contains('editing')) return;
    currentActiveRowEl = row;
    showContextMenu(bubble, msgId, role, content, model, isFailed);
    if (modelTagEl) modelTagEl.classList.add('visible');
  });

  return row;
}

// ---- 发送核心逻辑（兼容富媒体与SSE） ----
async function sendChatMessage(msgType = 'text', payload = {}) {
  const text = inputEl.value.trim();
  if (msgType === 'text' && !text) return;

  inputEl.value = ''; inputEl.style.height = 'auto'; sendBtn.disabled = true;
  const nowIso = new Date().toISOString();

  // 1. 本地直接渲染用户气泡
  let displayContent = text;
  if (msgType === 'image') displayContent = payload.message || '[图片]';
  if (msgType === 'sticker') displayContent = '[表情]';
  if (msgType === 'transfer') displayContent = `[转账] ¥${payload.amount}`;

  const userRow = renderMsgRow('user', displayContent, nowIso, false, null, null, false, msgType, payload);
  messagesEl.appendChild(userRow);

  const pendingRow = renderMsgRow('charon', '', nowIso, true);
  messagesEl.appendChild(pendingRow);
  scrollToBottom();

  const pendingBubble = pendingRow.querySelector('.bubble');

  try {
    const reqBody = { msg_type: msgType, ...payload };
    if (msgType === 'text') reqBody.message = text;

    const res = await fetch(apiUrl('/api/chat-send'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(reqBody)
    });

    if (!res.ok || !res.body) throw new Error('连接异常');

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let sawDone = false;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data: ')) continue;
        const jsonStr = line.slice('data: '.length);
        let evt;
        try { evt = JSON.parse(jsonStr); } catch (e) { continue; }

        if (evt.delta) {
          pendingBubble.textContent += evt.delta;
          scrollToBottom();
        } else if (evt.done) {
          sawDone = true;
          userRow.replaceWith(renderMsgRow('user', displayContent, nowIso, false, evt.user_msg_id, null, false, msgType, payload));
          pendingRow.replaceWith(renderMsgRow('charon', evt.reply || '（空回复）', nowIso, false, evt.charon_msg_id, evt.model));
        }
      }
    }
  } catch (e) {
    pendingRow.replaceWith(renderMsgRow('charon', '（网络异常，未发送成功）', nowIso, false, null, null, true));
  }
  scrollToBottom(); sendBtn.disabled = false; loadStatus();
}

sendBtn.addEventListener('click', () => sendChatMessage('text'));
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage('text'); }

async function loadHistory() {

      messagesEl.appendChild(renderMsgRow(m.role, m.content, m.created_at, false, m.id, m.model, false, m.msg_type, m.extra));
    });

        <div class="moment-content">${escapeHtml(m.content)}</div>
        ${imgHtml}
        <div class="moment-actions">
          <button class="action-btn ${isLikedByUser ? 'liked' : ''}" onclick="toggleLike('${m.id}')">♥ ${isLikedByUser ? '已赞' : '点赞'}</button>
          <button class="action-btn" onclick="toggleCommentBox('${m.id}')">💬 评论</button>
        </div>
        ${likesHtml}
        ${commentsHtml}
        <div class="comment-input-area" id="comment-box-${m.id}">
          <input type="text" class="comment-input" placeholder="输入温和的评论..." id="comment-input-${m.id}">
          <button class="letter-del-btn" onclick="submitComment('${m.id}')">发送</button>
        </div>
      </div>
    `;
    feed.appendChild(card);
  });
}
async function deleteMoment(id) {
  if (!confirm('确定删除动态？')) return;
  try {
    const res = await fetch(apiUrl('/api/moments/delete'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    });

}
async function toggleLike(id) {
  try {
    const res = await fetch(apiUrl('/api/moments/like'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    });
    if ((await res.json()).ok) fetchMoments();
  } catch(e) {}
}
function toggleCommentBox(id) {

async function submitComment(id) {

  if (!text) return;

      body: JSON.stringify({ id, content: text })
    });

  } catch(e) {}

async function deleteComment(id, idx) {

// ---- 上下文菜单与气泡管理 ----
function showContextMenu(target, id, typeOrRole, textContent = "", model = "", isFailed = false) {
  const rect = target.getBoundingClientRect();
  contextMenu.style.visibility = 'hidden';
  contextMenu.style.display = 'flex';
  contextMenu.innerHTML = '';

  const rows = document.createElement('div');
  rows.className = 'bubble-menu-buttons-row';

  const copyBtn = document.createElement('button');
  copyBtn.className = 'menu-btn';
  copyBtn.textContent = '📄 复制';
  copyBtn.onclick = () => { navigator.clipboard.writeText(textContent); hideContextMenu(); };
  rows.appendChild(copyBtn);

  if (id && typeOrRole === 'charon') {
    const regenBtn = document.createElement('button');
    regenBtn.className = 'menu-btn';
    regenBtn.textContent = '🔄 重新生成';
    regenBtn.onclick = () => { regenerateMessage(id, currentActiveRowEl); hideContextMenu(); };
    rows.appendChild(regenBtn);
  }

  if (id) {
    const delBtn = document.createElement('button');
    delBtn.className = 'menu-btn';
    delBtn.textContent = '🗑️ 撤回';
    delBtn.onclick = () => { deleteMessage(id, currentActiveRowEl); hideContextMenu(); };
    rows.appendChild(delBtn);
  }

  contextMenu.appendChild(rows);
  requestAnimationFrame(() => {
    contextMenu.style.left = (rect.left + rect.width / 2 - contextMenu.offsetWidth / 2 + window.scrollX) + 'px';
    contextMenu.style.top = (rect.top - contextMenu.offsetHeight - 8 + window.scrollY) + 'px';
    contextMenu.style.visibility = 'visible';
  });
}
function hideContextMenu() { contextMenu.style.display = 'none'; }
document.addEventListener('click', (e) => {
  if (!e.target.closest('.bubble') && !e.target.closest('.menu-btn')) hideContextMenu();
});

async function deleteMessage(id, rowEl) {
  try {
    const res = await fetch(apiUrl('/api/chat-delete'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    });
    if ((await res.json()).ok) rowEl.remove();
  } catch (e) {}
}
async function regenerateMessage(id, rowEl) {
  const bubble = rowEl.querySelector('.bubble');
  bubble.textContent = '重构中...'; bubble.classList.add('pending');
  try {
    const res = await fetch(apiUrl('/api/chat-regenerate'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    });
    const data = await res.json();
    if (data.ok) {
      rowEl.replaceWith(renderMsgRow('charon', data.reply, new Date().toISOString(), false, id, data.model));
    }
  } catch (e) {}
}

function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---- 双层小抽屉与层叠便签同步系统 ----
async function loadStatus() {
  try {
    const res = await fetch(apiUrl('/api/chat-status'));
    const data = await res.json();
    if (!data.ok) return;

    statusLabel.textContent = data.status_label || '在线';
    document.getElementById('status-dot').className = 'status-dot' + (data.mood_score < 50 ? ' low' : '');

    const container = document.getElementById('sticky-container');
    container.innerHTML = '';
    
    if (data.sticky_notes && data.sticky_notes.length > 0) {
      data.sticky_notes.forEach((note, index) => {
        const card = document.createElement('div');
        card.className = `sticky-note-card`;
        card.style.transform = `rotate(${(index % 2 === 0 ? 2 : -2)}deg) translateX(${index * 4}px)`;
        card.style.margin = index === 0 ? '0 auto' : '-27px auto 0';
        card.style.zIndex = 15 - index;
        card.style.background = '#ffeef1';

        card.innerHTML = `
          <div class="sticky-note-text">${escapeHtml(note.message)}</div>
          <button class="note-star-btn ${note.is_starred ? 'active' : ''}" onclick="event.stopPropagation(); starNote(${note.id}, ${note.is_starred})">★</button>
        `;
        container.appendChild(card);
      });
    } else {
      container.innerHTML = `<div class="sticky-note-card"><div class="sticky-note-text" style="color:#b08d98;text-align:center;">桌面空落落的</div></div>`;
    }

    const notesBtn = document.getElementById('drawer-notes-btn');
    const lettersBtn = document.getElementById('drawer-letters-btn');
    
    fetch(apiUrl('/api/sticky-notes?status=drawer')).then(res=>res.json()).then(d => {
      if(d.ok) {
        document.getElementById('notes-drawer-count').textContent = `${d.notes.length}/30`;
        document.getElementById('box-notes-count').textContent = `${d.notes.length}/30`;
        if (d.layer_full.drawer) notesBtn.classList.add('layer-full');
      }
    });

    fetch(apiUrl('/api/love-letters?status=drawer')).then(res=>res.json()).then(d => {
      if(d.ok) {
        document.getElementById('letters-drawer-count').textContent = `${d.letters.length}/20`;
        document.getElementById('box-letters-count').textContent = `${d.letters.length}/20`;
        if (d.layer_full.drawer) lettersBtn.classList.add('layer-full');
      }
    });

    document.getElementById('new-letter-indicator').style.display = data.has_new_letter ? 'inline' : 'none';
  } catch (e) {}
}

async function starNote(id, curr) {
  try {
    await fetch(apiUrl('/api/sticky-notes/star'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, is_starred: !curr })

    loadStatus();
  } catch(e) {}
}

// ---- 仿真日历逻辑 ----
async function openPeriodCalendar() {
  openModal('calendar-modal');
  fetchPeriodData();
}
function closePeriodCalendar() { closeModal('calendar-modal'); }
async function fetchPeriodData() {
  try {
    const res = await fetch(apiUrl(`/api/period/calendar?year=${currentYear}`));
    const data = await res.json();
    if (data.ok) { periodRecords = data.records; renderCalendarGrid(); }
  } catch(e) {}
}
function renderCalendarGrid() {
  const grid = document.getElementById('calendar-days-grid');
  grid.innerHTML = '';
  document.getElementById('calendar-month-year').textContent = `${currentYear}年${currentMonth+1}月`;
  const firstDay = new Date(currentYear, currentMonth, 1);
  let dayOfWeek = firstDay.getDay();
  dayOfWeek = (dayOfWeek === 0) ? 6 : dayOfWeek - 1;
  const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

  for (let i = 0; i < dayOfWeek; i++) {
    const span = document.createElement('span');
    grid.appendChild(span);
  }
  for (let day = 1; day <= totalDays; day++) {
    const cell = document.createElement('span');
    cell.style.cssText = "display:inline-block; line-height:30px; height:30px; cursor:pointer; border-radius:50%; text-align:center;";
    cell.textContent = day;
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    
    periodRecords.forEach(r => {
      if (dateStr >= r.start_date && (!r.end_date || dateStr <= r.end_date)) {
        cell.style.background = '#ffb3c1';
        cell.style.color = '#fff';
      }
    });
    cell.onclick = (e) => {
      selectedDateStr = dateStr;
      showDayActionPopup(cell);
    };
    grid.appendChild(cell);
  }
}
function prevMonth() { if (currentMonth===0) { currentMonth=11; currentYear--; } else currentMonth--; renderCalendarGrid(); }
function nextMonth() { if (currentMonth===11) { currentMonth=0; currentYear++; } else currentMonth++; renderCalendarGrid(); }

function showDayActionPopup(btn) {
  const rect = btn.getBoundingClientRect();
  dayActionPopup.style.display = 'flex';
  dayActionPopup.style.left = (rect.left + window.scrollX) + 'px';
  dayActionPopup.style.top = (rect.top - 80 + window.scrollY) + 'px';
  document.getElementById('popup-start-btn').onclick = () => savePeriodDate('start');
  document.getElementById('popup-end-btn').onclick = () => savePeriodDate('end');
}
function hideDayActionPopup() { dayActionPopup.style.display = 'none'; }
async function savePeriodDate(action) {
  try {
    const res = await fetch(apiUrl('/api/period/save'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, date: selectedDateStr })
    });
    if ((await res.json()).ok) { fetchPeriodData(); hideDayActionPopup(); }
  } catch(e) {}
}

function switchTab(tabName) {
  const appEl = document.getElementById('app');
  appEl.className = 'view-' + tabName;
  document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
  
  if (tabName === 'chat') {
    document.querySelectorAll('.tab-item')[0].classList.add('active');
    switchMainView('chat');
  } else if (tabName === 'moments') {
    document.querySelectorAll('.tab-item')[1].classList.add('active');
    switchMainView('moments');
  } else if (tabName === 'desk') {
    document.querySelectorAll('.tab-item')[2].classList.add('active');
  }
}
