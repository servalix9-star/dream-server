<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Charon</title>
<link rel="manifest" href="/manifest.json">
<!-- iOS "添加到主屏幕"认这个标签，不认manifest.json里的icons（Safari对Web Manifest图标支持不完整） -->
<link rel="apple-touch-icon" href="/static/app_icon_192.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Charon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    /* 网格径向渐变，调浅调亮为晨曦迷雾般的柔和马卡龙粉 */
    background: radial-gradient(circle at 10% 20%, #fffcfd 0%, #fbf3f5 35%, #f3e2e6 70%, #ebd3d9 100%);
    background-attachment: fixed;
    font-family: "Songti SC", "STSong", Georgia, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    color: #5a4550; /* 雅致深紫灰 */
  }
  #app {
    display: flex;
    height: 100vh; height: 100dvh;
    padding: 14px;
    gap: 14px;
    position: relative;
    z-index: 2;
  }

  /* ---- 左侧波点玻璃舱导航栏 ---- */
  #nav {
    width: 60px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 24px 0;
    background: rgba(255, 238, 241, 0.6); /* 马卡龙蜜桃粉色底色 */
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px 0 rgba(184, 118, 138, 0.08);
  }
  #nav::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, #000000 0%, #000000 20%, #c0b8c0 30%, #ffffff 40%, #ffffff 60%, #c0b8c0 80%, #000000 100%);
    -webkit-mask-image: 
      radial-gradient(circle, #000 24%, transparent 24.5%),
      radial-gradient(circle, #000 24%, transparent 24.5%);
    -webkit-mask-size: 22px 22px; 
    -webkit-mask-position: 0 0, 11px 11px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.85;
  }
  
  /* ---- 导航图标 & 发送按钮：白水晶高亮白底+粉波点渗透材质 ---- */
  .nav-icon, #send-btn {
    position: relative;
    z-index: 1;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: none !important;
    background: 
      radial-gradient(circle, rgba(255, 143, 163, 0.22) 15%, transparent 15.5%),
      radial-gradient(circle, rgba(255, 143, 163, 0.22) 15%, transparent 15.5%),
      rgba(255, 255, 255, 0.95) !important;
    background-size: 6px 6px, 6px 6px, 100% 100% !important;
    background-position: 0 0, 3px 3px, 0 0 !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #ff8fa3 !important;
    text-decoration: none;
    transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08) !important;
    cursor: pointer;
    padding: 0;
  }
  .nav-icon svg { width: 20px; height: 20px; stroke-width: 1.5px; }
  .nav-icon:hover, #send-btn:hover {
    transform: translateY(-2px) scale(1.05);
    background-color: rgba(255, 255, 255, 0.98) !important;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12) !important;
  }
  .nav-icon:active, #send-btn:active { 
    transform: translateY(0) scale(0.95); 
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05) !important;
  }
  #send-btn svg { width: 18px; height: 18px; stroke-width: 1.5px; transform: rotate(-10deg) translate(-1px, 1px); transition: transform 0.2s ease; }
  #send-btn:hover svg { transform: rotate(5deg) scale(1.1); }
  #send-btn:disabled { opacity: 0.5; filter: grayscale(50%); cursor: default; box-shadow: none !important; }

  /* ---- 中间玻璃舱对话区 ---- */
  #main {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border-radius: 28px; box-shadow: 0 12px 40px rgba(184, 118, 138, 0.10); overflow: hidden; position: relative;
  }
  #main::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%), radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%);
    background-size: 10px 10px; background-position: 0 0, 5px 5px; pointer-events: none; z-index: 0;
  }
  
  /* ---- 酷黑渐变 Header ---- */
  #header, #moments-header {
    padding: 18px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.2); flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between; position: relative;
    background: linear-gradient(to right, #000000 0%, #000000 52%, rgba(26, 18, 30, 0.9) 62%, #cf7d90 85%, #ffb3c1 100%);
  }
  #header::before, #moments-header::before {
    content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 65%;
    background-image: radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%), radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%);
    background-size: 11px 11px; background-position: 0 0, 5.5px 5.5px;
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%); pointer-events: none; z-index: 0;
  }
  
  .avatar-wrapper { position: relative; display: inline-block; width: 36px; height: 36px; flex-shrink: 0; }
  .avatar-wrapper.header-avatar-wrap { width: 44px; height: 44px; }
  .avatar-wrapper .msg-avatar, .avatar-wrapper #header-avatar {
    border: 1.5px solid #ffffff; box-shadow: 0 0 8px rgba(255, 255, 255, 0.6); 
  }
  .avatar-wrapper .star-accent { position: absolute; font-size: 15px; pointer-events: none; user-select: none; animation: star-pulse 2s infinite ease-in-out; }
  .avatar-wrapper.charon .star-accent { top: -6px; left: -6px; color: #000000; text-shadow: 0 0 4px #000000, 0 0 10px rgba(0, 0, 0, 0.95); }
  .avatar-wrapper.user .star-accent { top: -6px; right: -6px; color: #ffb3c1; text-shadow: 0 0 4px #ff5e84, 0 0 10px rgba(255, 94, 132, 0.95); }
  .avatar-wrapper .dust-star { position: absolute; pointer-events: none; user-select: none; color: #ffffff; text-shadow: 0 0 5px rgba(255, 255, 255, 0.8); }
  .avatar-wrapper.charon .dust-star.d-1 { bottom: -4px; right: -4px; font-size: 9px; opacity: 0.8; }
  .avatar-wrapper.charon .dust-star.d-2 { top: 14px; right: -7px; font-size: 8px; opacity: 0.6; }
  .avatar-wrapper.user .dust-star.d-1 { bottom: -4px; left: -4px; font-size: 9px; opacity: 0.8; }
  .avatar-wrapper.user .dust-star.d-2 { top: 14px; left: -7px; font-size: 8px; opacity: 0.6; }
  @keyframes star-pulse { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.15); opacity: 1; } }
  
  .avatar-tag {
    position: absolute; font-family: "Dancing Script", cursive; font-size: 11px; white-space: nowrap; pointer-events: none; user-select: none; z-index: 2;
  }
  .avatar-wrapper.charon .avatar-tag { top: -15px; left: 50%; transform: translateX(-50%); color: #5a4550; text-shadow: 0 0 4px rgba(255, 255, 255, 0.8); }
  .avatar-wrapper.user .avatar-tag { top: -15px; left: 50%; transform: translateX(-50%); color: #cf7d90; text-shadow: 0 0 4px rgba(255, 255, 255, 0.8); }

  #header-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  #header-text { position: relative; z-index: 1; min-width: 0; }
  #header .brand, #moments-header .brand {
    font-family: "Georgia", "Songti SC", serif; font-size: 24px; font-style: italic; letter-spacing: 3px; color: #e599a9; font-weight: 500; line-height: 1.2; text-transform: uppercase;
    text-shadow: 0 0 10px rgba(229, 153, 169, 0.8), 0 0 20px rgba(229, 153, 169, 0.4);
  }
  #header .sub, #moments-header .sub { font-size: 11px; color: rgba(255, 255, 255, 0.7); letter-spacing: 1px; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .status-badge { background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.25); padding: 1px 7px; border-radius: 5px; font-size: 10px; color: #ffffff; display: inline-flex; align-items: center; gap: 4px; }
  #model-select { font-size: 10px; color: #fff; background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 5px; padding: 1px 4px; max-width: 150px; outline: none; }
  #model-select option { color: #000; }
  .model-select-wrap { display: inline-flex; align-items: center; gap: 4px; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #84cc9a; display: inline-block; box-shadow: 0 0 6px #84cc9a; }
  .status-dot.low { background: #c3a1ad; box-shadow: 0 0 6px #c3a1ad; }
  
  .header-signature-wrap { position: relative; z-index: 1; margin-left: auto; display: inline-flex; align-items: center; }
  .sig-star { position: absolute; pointer-events: none; user-select: none; color: #ffffff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.9); }
  .sig-star.s-1 { top: -4px; left: -10px; font-size: 8px; animation: star-pulse 2.5s infinite ease-in-out; }
  .sig-star.s-2 { bottom: -4px; right: -10px; font-size: 10px; animation: star-pulse 1.8s infinite ease-in-out; }
  .header-signature { font-family: "Dancing Script", cursive; font-size: 22px; color: rgba(255, 255, 255, 0.92); text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); user-select: none; pointer-events: none; }

  /* ---- 聊天气泡区域 ---- */
  #messages {
    position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 22px 24px;
    display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch;
  }
  .msg-row { display: flex; align-items: flex-start; gap: 10px; max-width: 88%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.charon { align-self: flex-start; }
  .msg-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .msg-col { display: flex; flex-direction: column; min-width: 0; }
  .msg-row.user .msg-col { align-items: flex-end; }
  .msg-row.charon .msg-col { align-items: flex-start; }
  .msg-time { font-size: 10px; color: #b08d98; margin: 4px 4px 0; }
  .msg-time-row { display: flex; align-items: center; gap: 4px; }

  /* 半调波普印刷气泡 */
  .bubble {
    position: relative; padding: 12px 18px; line-height: 1.6; font-size: 15px; word-wrap: break-word; white-space: pre-wrap;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: pointer;
  }
  .bubble.user {
    background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 15%, transparent 15.5%), radial-gradient(circle, rgba(255, 255, 255, 0.16) 15%, transparent 15.5%), linear-gradient(135deg, #f3b0c3, #e593a4);
    background-size: 6px 6px, 6px 6px, 100% 100%; background-position: 0 0, 3px 3px, 0 0;
    color: #ffffff; border-radius: 18px 4px 18px 18px; box-shadow: 0 4px 15px rgba(184, 96, 118, 0.18);
  }
  .bubble.charon {
    background: radial-gradient(circle, rgba(229, 153, 171, 0.08) 15%, transparent 15.5%), radial-gradient(circle, rgba(229, 153, 171, 0.08) 15%, transparent 15.5%), rgba(255, 255, 255, 0.55);
    background-size: 6px 6px, 6px 6px, 100% 100%; background-position: 0 0, 3px 3px, 0 0;
    border: none; color: #6b5460; border-radius: 4px 18px 18px 18px; box-shadow: 0 4px 15px rgba(184, 118, 138, 0.05);
  }
  .bubble.pending { opacity: 0.5; }

  .typing-dots { display: inline-flex; align-items: center; gap: 4px; padding: 2px 0; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.4;
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 0.9; }
  }

  .bubble.editing-bubble {
    -webkit-user-select: text; user-select: text; cursor: text;
    outline: 2px dashed rgba(255, 255, 255, 0.65); outline-offset: 2px;
  }
  .edit-action-bar { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .edit-action-btn {
    border: none; border-radius: 12px; padding: 4px 12px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: opacity 0.15s;
  }
  .edit-action-btn:disabled { opacity: 0.5; cursor: default; }
  .edit-action-btn.cancel { background: rgba(107, 84, 96, 0.12); color: #6b5460; }
  .edit-action-btn.send { background: linear-gradient(135deg, #f3b0c3, #e593a4); color: #fff; }

  /* ---- 全局悬浮操作菜单 ---- */
  #bubble-menu {
    display: none; flex-direction: column; position: absolute; z-index: 1000; background: rgba(26, 18, 30, 0.95);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 8px; padding: 6px 4px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25); animation: menu-pop 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .bubble-menu-buttons-row { display: flex; }
  @keyframes menu-pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .menu-btn {
    background: none; border: none; color: #e2cbd4; font-size: 12px; padding: 6px 12px; cursor: pointer; font-family: inherit; transition: color 0.15s;
  }
  .menu-btn:hover { color: #ffb3c1; }
  .menu-btn:not(:last-child) { border-right: 1px solid rgba(255, 255, 255, 0.15); }
  .model-tag {
    font-size: 9px; color: #ffffff; margin: 2px 4px 0; align-self: flex-end;
    opacity: 0; transition: opacity 0.2s ease; user-select: none; pointer-events: none;
  }
  .model-tag.visible { opacity: 0.85; }

  #input-bar {
    display: flex; gap: 10px; padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255, 255, 255, 0.2); flex-shrink: 0; position: relative; z-index: 1; overflow: hidden;
  }
  #input-bar::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to right, #ffffff 0%, #ffffff 11%, #c0b8c0 33%, #000000 45%, #000000 55%, #c0b8c0 67%, #ffffff 89%, #ffffff 100%);
    -webkit-mask-image: radial-gradient(circle, #000 24%, transparent 24.5%), radial-gradient(circle, #000 24%, transparent 24.5%);
    -webkit-mask-size: 22px 22px; -webkit-mask-position: 0 0, 11px 11px; pointer-events: none; z-index: 0; opacity: 0.85;
  }
  #input-bar textarea {
    position: relative; z-index: 1; flex: 1; resize: none; border-radius: 16px; border: 1.5px solid rgba(255, 255, 255, 0.6);
    background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #5a4550; padding: 11px 16px; font-size: 15px; font-family: inherit; max-height: 100px; outline: none;
    transition: background 0.2s ease, border-color 0.2s ease; box-shadow: 0 4px 12px rgba(184, 118, 138, 0.05);
  }
  #input-bar textarea:focus { background: rgba(255, 255, 255, 0.9); border-color: rgba(229, 153, 169, 0.8); }
  #input-bar textarea::placeholder { color: #b08d98; }

  /* ---- 右侧状态面板（DESK 手账区） ---- */
  #panel {
    width: 260px; flex-shrink: 0; display: none; flex-direction: column;
    padding: 22px 18px; background: rgba(255, 235, 240, 0.55); border-radius: 24px; position: relative; overflow: hidden;
    border: none; box-shadow: 0 8px 32px rgba(184, 118, 138, 0.08);
  }
  @media (min-width: 769px) { #panel { display: flex; } }
  #panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(to bottom, #ffeef1 0%, #ffeef1 20%, #ffffff 35%, #ffffff 65%, #ffeef1 80%, #ffeef1 100%);
    -webkit-mask-image: radial-gradient(circle, #000 15%, transparent 15.5%), radial-gradient(circle, #000 15%, transparent 15.5%);
    -webkit-mask-size: 14px 14px; -webkit-mask-position: 0 0, 7px 7px; pointer-events: none; z-index: 0; opacity: 0.85;
  }
  .panel-child { position: relative; z-index: 1; }
  .panel-title {
    font-family: "Georgia", "Songti SC", serif; font-size: 15px; letter-spacing: 3px; color: #a66275; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; text-shadow: 0 2px 4px rgba(255,255,255,0.8);
  }

  /* --- 仿真便利贴堆叠留言板 --- */
  .sticky-note-stack {
    position: relative; width: 100%; display: flex; flex-direction: column;
    margin-top: 15px; margin-bottom: 18px; z-index: 1;
  }
  .sticky-note-card {
    position: relative; border: none; border-radius: 3px 14px 14px 14px;
    padding: 12px 11px; width: 88%; aspect-ratio: 1 / 0.572; 
    box-shadow: 0 8px 20px rgba(120, 80, 95, 0.18), 0 2px 5px rgba(120, 80, 95, 0.1);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    -webkit-user-select: none; user-select: none; cursor: pointer; flex-shrink: 0;
  }
  .sticky-note-card:hover {
    transform: rotate(0deg) translateY(-4px) scale(1.03) !important;
    z-index: 100 !important;
    box-shadow: 0 14px 30px rgba(120, 80, 95, 0.26), 0 3px 8px rgba(120, 80, 95, 0.15);
  }
  .sticky-note-text { font-size: 12.5px; line-height: 1.42; font-family: "Songti SC", serif; word-wrap: break-word; }
  .note-star-btn {
    position: absolute; bottom: 8px; right: 12px; background: none; border: none; font-size: 20px; cursor: pointer;
    opacity: 0.5; transition: transform 0.2s, opacity 0.2s, filter 0.2s; color: #e5a4b5; padding: 4px; line-height: 1;
  }
  .note-star-btn:hover { transform: scale(1.15); }
  .note-star-btn.active { opacity: 1; color: #ff8fa3 !important; filter: drop-shadow(0 2px 5px rgba(255, 143, 163, 0.45)); }

  /* --- 秘密小抽屉收纳盒 --- */
  .drawer-wrapper { display: flex; flex-direction: column; gap: 12px; margin-top: auto; padding-top: 10px; }
  .drawer-btn {
    background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255,255,255,1); border-radius: 12px; 
    padding: 14px 10px; text-align: center; cursor: pointer; position: relative;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    color: #a66275; font-family: "Georgia", serif; 
    box-shadow: 0 4px 15px rgba(184, 118, 138, 0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .drawer-btn-title { font-weight: bold; font-size: 13px; letter-spacing: 1px; }
  .drawer-btn-count { font-size: 10px; opacity: 0.75; font-family: "Courier New", monospace; }
  .drawer-btn::before {
    content: ''; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px;
    background: 
      radial-gradient(circle, rgba(166,98,117,0.4) 2px, transparent 2.5px) top left / 10px 10px no-repeat,
      radial-gradient(circle, rgba(166,98,117,0.4) 2px, transparent 2.5px) top right / 10px 10px no-repeat,
      radial-gradient(circle, rgba(166,98,117,0.4) 2px, transparent 2.5px) bottom left / 10px 10px no-repeat,
      radial-gradient(circle, rgba(166,98,117,0.4) 2px, transparent 2.5px) bottom right / 10px 10px no-repeat;
    pointer-events: none; opacity: 0.7;
  }
  .drawer-btn:hover { background: #ffffff; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(184, 118, 138, 0.15); }
  .drawer-btn.layer-full { background: #fff5f6; border-color: rgba(255,94,132,0.6); animation: drawer-warn-glow 1.5s infinite alternate; }
  @keyframes drawer-warn-glow {
    from { box-shadow: 0 0 8px rgba(255, 94, 132, 0.2); }
    to { box-shadow: 0 0 16px rgba(255, 94, 132, 0.5), inset 0 1px 2px rgba(255,255,255,1); }
  }
  .new-letter-sparkle {
    position: absolute; top: -6px; right: -6px; font-size: 18px; color: #ffffff;
    text-shadow: 0 0 6px #fff, 0 0 12px #ff5e84; animation: star-pulse 1.2s infinite ease-in-out; pointer-events: none;
  }

  /* =========================================================
     ---- 朋友圈 (Moments) 沉浸重构界面样式 ----
     ========================================================= */
  #moments-wrapper {
    flex: 1; min-width: 0; display: none; flex-direction: column;
    background: rgba(255, 255, 255, 0.42); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border-radius: 28px; box-shadow: 0 12px 40px rgba(184, 118, 138, 0.10); overflow: hidden; position: relative;
  }
  #moments-wrapper::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.45) 15%, transparent 15.5%), radial-gradient(rgba(255, 255, 255, 0.45) 15%, transparent 15.5%);
    background-size: 10px 10px; background-position: 0 0, 5px 5px; pointer-events: none; z-index: 0;
  }
  
  .publish-btn {
    background: linear-gradient(135deg, #f3b0c3, #e593a4); border: none; border-radius: 16px;
    padding: 7px 15px; color: #fff; font-size: 12.5px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 12px rgba(229, 147, 164, 0.35); transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex; align-items: center; gap: 6px; z-index: 2;
  }
  .publish-btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 6px 16px rgba(229, 147, 164, 0.5); }
  .publish-btn:active { transform: translateY(0) scale(0.96); }

  #moments-feed {
    flex: 1; overflow-y: auto; padding: 0 0 40px 0; display: flex; flex-direction: column;
    -webkit-overflow-scrolling: touch; position: relative; z-index: 1;
  }

  /* 朋友圈头部视觉看板（双人情侣专属拍立得封面区） */
  .moments-cover {
    position: relative; width: 100%; margin-bottom: 26px; overflow: hidden;
    background: linear-gradient(180deg, rgba(26, 18, 30, 0.95) 0%, rgba(68, 41, 56, 0.85) 60%, rgba(255, 238, 241, 0.3) 100%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    padding: 38px 24px 22px;
  }
  .moments-cover::before {
    content: ''; position: absolute; top:0; left:0; right:0; bottom:0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.25) 12%, transparent 12.5%);
    background-size: 12px 12px; pointer-events: none; opacity: 0.6;
  }
  .cover-inner {
    position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: flex-end;
  }
  .cover-motto {
    font-family: "Georgia", "Songti SC", serif; font-style: italic; color: #ffe6ec; font-size: 13.5px;
    letter-spacing: 1px; max-width: 60%; line-height: 1.6; text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .cover-motto-sig {
    font-family: "Dancing Script", cursive; font-size: 16px; color: #ff9cb3; margin-top: 4px; display: block;
  }
  
  /* 双人拍立得错叠头像组 */
  .cover-avatars-cluster {
    position: relative; width: 84px; height: 60px;
  }
  .polaroid-avatar-chip {
    position: absolute; width: 44px; height: 44px; border-radius: 10px;
    border: 2px solid #ffffff; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    background: #fff; overflow: hidden; transition: transform 0.25s ease;
  }
  .polaroid-avatar-chip img { width: 100%; height: 100%; object-fit: cover; }
  .polaroid-avatar-chip.charon-chip {
    left: 0; bottom: 0; transform: rotate(-8deg); z-index: 1;
  }
  .polaroid-avatar-chip.user-chip {
    right: 0; top: 0; transform: rotate(10deg); z-index: 2;
    box-shadow: 0 8px 18px rgba(255, 94, 132, 0.4);
  }
  .cover-avatars-cluster:hover .charon-chip { transform: rotate(-2deg) translateY(-2px); }
  .cover-avatars-cluster:hover .user-chip { transform: rotate(4deg) translateY(-2px); }

  /* 动态列表容器 */
  .moments-list {
    display: flex; flex-direction: column; gap: 20px; padding: 0 22px;
  }

  /* 单条朋友圈卡片：晨曦胶囊 + 半调纸片排版 */
  .moment-card {
    background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 20px; padding: 18px; box-shadow: 0 6px 20px rgba(184, 118, 138, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.95); position: relative;
    transition: box-shadow 0.25s ease, transform 0.25s ease;
  }
  .moment-card:hover {
    box-shadow: 0 10px 28px rgba(184, 118, 138, 0.14);
  }
  
  .moment-main-layout { display: flex; gap: 14px; align-items: flex-start; }
  
  /* 左侧头像 */
  .moment-left-col { flex-shrink: 0; position: relative; }
  .moment-avatar-box {
    width: 42px; height: 42px; border-radius: 50%; position: relative;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  }
  .moment-avatar-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 1.5px solid #fff; }

  /* 右侧主体信息 */
  .moment-right-col { flex: 1; min-width: 0; }
  
  .moment-user-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
  }
  .moment-author-info { display: flex; align-items: center; gap: 8px; }
  .moment-author-name {
    font-family: "Georgia", "Songti SC", serif; font-size: 15px; font-weight: bold; color: #4a3742; letter-spacing: 0.5px;
  }
  .moment-author-name.charon-author { color: #1a121e; }
  .moment-badge {
    font-size: 9.5px; padding: 1px 7px; border-radius: 8px; font-family: "Courier New", monospace;
    font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .moment-badge.charon-badge { background: rgba(26, 18, 30, 0.08); color: #442938; border: 1px solid rgba(26, 18, 30, 0.15); }
  .moment-badge.user-badge { background: rgba(255, 94, 132, 0.12); color: #ff5e84; border: 1px solid rgba(255, 94, 132, 0.25); }

  /* 动态正文 */
  .moment-content {
    font-size: 14.5px; line-height: 1.68; color: #4a3742; margin: 6px 0 12px;
    white-space: pre-wrap; word-break: break-word; font-family: "Songti SC", serif;
  }

  /* 拍立得照片留白相框展示 */
  .moment-polaroid-frame {
    margin: 8px 0 12px; display: inline-block; background: #fff; padding: 6px 6px 14px 6px;
    border-radius: 4px; box-shadow: 0 4px 14px rgba(120, 80, 95, 0.15);
    border: 1px solid rgba(0,0,0,0.04); max-width: 200px; transform: rotate(-1deg);
  }
  .moment-polaroid-frame img { width: 100%; border-radius: 2px; display: block; }

  /* 底部状态与操作触发条 */
  .moment-footer-bar {
    display: flex; align-items: center; justify-content: space-between; position: relative;
    margin-top: 4px;
  }
  .moment-meta-left {
    display: flex; align-items: center; gap: 10px; font-size: 11px; color: #b08d98; font-family: "Courier New", monospace;
  }
  .moment-del-link {
    color: #a66275; cursor: pointer; text-decoration: none; font-size: 11px;
    transition: color 0.15s;
  }
  .moment-del-link:hover { color: #ff5e84; text-decoration: underline; }

  /* 微信经典操作小药丸触发按钮 (··) */
  .moment-action-trigger {
    width: 32px; height: 20px; border-radius: 5px; background: rgba(255, 238, 241, 0.7);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 3px; transition: all 0.2s; color: #a66275;
  }
  .moment-action-trigger:hover { background: #ffe4e9; color: #ff5e84; transform: scale(1.06); }
  .trigger-dot { width: 3.5px; height: 3.5px; border-radius: 50%; background: currentColor; }

  /* 微信样式的浮动展开操作小气泡 (赞 / 评论) */
  .moment-action-popover {
    display: none; position: absolute; right: 38px; top: -6px; z-index: 100;
    background: rgba(26, 18, 30, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 8px; padding: 4px 6px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    animation: popover-slide 0.18s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .moment-action-popover.active { display: flex; align-items: center; gap: 4px; }
  @keyframes popover-slide {
    from { opacity: 0; transform: translateX(8px) scale(0.92); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }
  .popover-btn {
    background: none; border: none; color: #fff; font-size: 12px; padding: 5px 12px;
    cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: inherit;
    border-radius: 4px; transition: background 0.15s, color 0.15s; white-space: nowrap;
  }
  .popover-btn:hover { background: rgba(255, 255, 255, 0.12); color: #ffb3c1; }
  .popover-btn.liked { color: #ff8fa3; }
  .popover-divider { width: 1px; height: 14px; background: rgba(255, 255, 255, 0.15); }

  /* 微信经典凹凸互动卡片（点赞 + 评论汇总区） */
  .moment-interaction-box {
    margin-top: 10px; background: rgba(255, 246, 248, 0.7); border-radius: 12px;
    position: relative; border: 1px solid rgba(229, 153, 169, 0.2); overflow: hidden;
  }
  /* 向上的小三角指针 */
  .moment-interaction-box::before {
    content: ''; position: absolute; top: -5px; right: 12px;
    width: 9px; height: 9px; background: rgba(255, 246, 248, 0.95);
    border-left: 1px solid rgba(229, 153, 169, 0.2); border-top: 1px solid rgba(229, 153, 169, 0.2);
    transform: rotate(45deg);
  }

  /* 点赞列表 */
  .interaction-likes {
    padding: 8px 12px; font-size: 12.5px; color: #a66275; display: flex;
    align-items: center; gap: 6px; border-bottom: 1px solid rgba(229, 153, 169, 0.12);
  }
  .interaction-likes:last-child { border-bottom: none; }
  .like-heart-icon { color: #ff5e84; font-size: 13px; }
  .like-user-name { font-weight: bold; font-size: 12px; color: #784856; }

  /* 评论列表 */
  .interaction-comments {
    padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
  }
  .interaction-comment-item {
    font-size: 13px; line-height: 1.5; color: #4a3742; word-break: break-word;
  }
  .comment-speaker { font-weight: bold; color: #8a485a; margin-right: 4px; }
  .comment-speaker.charon-speaker { color: #221820; }

  /* 行内评论输入框 */
  .moment-comment-input-wrap {
    display: none; margin-top: 8px; padding: 6px 10px; background: #fff;
    border-radius: 18px; border: 1px solid rgba(229, 153, 169, 0.4);
    box-shadow: 0 2px 8px rgba(184, 118, 138, 0.08); align-items: center; gap: 8px;
  }
  .moment-comment-input-wrap.active { display: flex; animation: menu-pop 0.18s ease; }
  .moment-comment-input {
    flex: 1; border: none; outline: none; font-size: 13px; font-family: inherit;
    background: transparent; color: #4a3742; padding: 4px 6px;
  }
  .moment-comment-send {
    background: linear-gradient(135deg, #f3b0c3, #e593a4); border: none;
    border-radius: 12px; color: #fff; font-size: 11.5px; font-weight: bold;
    padding: 5px 12px; cursor: pointer; transition: transform 0.2s;
  }
  .moment-comment-send:hover { transform: scale(1.05); }

  /* --- 手机自适应底部毛玻璃 Tab 导航栏 --- */
  #bottom-tabs { display: none; }
  @media (max-width: 768px) {
    #app {
      padding: 8px 8px calc(64px + env(safe-area-inset-bottom)) 8px; 
      height: 100vh; height: 100dvh; display: block; overflow: hidden;
    }
    #nav { display: none !important; }
    #main, #panel, #moments-wrapper { display: none; width: 100% !important; height: 100% !important; margin: 0 !important; border-radius: 20px !important; }
    #app.tab-chat #main, #app.tab-desk #panel, #app.tab-moments #moments-wrapper { display: flex; }
    
    #bottom-tabs {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(56px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255, 238, 241, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border-top: 1px solid rgba(255, 255, 255, 0.4); z-index: 1000; justify-content: space-around; align-items: center; box-shadow: 0 -4px 24px rgba(184, 118, 138, 0.08);
    }
    .tab-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b08d98; cursor: pointer; opacity: 0.6; transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); width: 60px;
    }
    .tab-item .tab-icon { font-size: 20px; line-height: 1.2; filter: grayscale(100%); }
    .tab-item .tab-icon svg { width: 22px; height: 22px; stroke-width: 1.5px; }
    .tab-item .tab-label { font-size: 10px; margin-top: 2px; font-weight: bold; }
    .tab-item.active { color: #ff5e84; opacity: 1; transform: translateY(-3px); }
    .tab-item.active .tab-icon { filter: grayscale(0%); filter: drop-shadow(0 0 4px rgba(255, 94, 132, 0.4)); }
  }

  /* --- 弹窗容器统一 --- */
  #letter-modal, #archive-modal, #drawer-notes-modal, #calendar-modal, #persona-modal, #publish-modal {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(26, 18, 30, 0.65); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    z-index: 2000; align-items: center; justify-content: center; padding: 20px; animation: modal-fade 0.3s ease;
  }
  @keyframes modal-fade { from { opacity: 0; } to { opacity: 1; } }
  .letter-container {
    background: #fffdfd; border-radius: 18px; width: 100%; max-width: 440px; max-height: 82vh;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,94,132,0.1);
    display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .letter-header {
    padding: 16px 20px; border-bottom: 1px dashed rgba(229,153,169,0.3); display: flex; justify-content: space-between; align-items: center;
  }
  .letter-title { font-family: "Georgia", "Songti SC", serif; color: #ff5e84; font-size: 16px; font-weight: bold; letter-spacing: 2px; }
  .close-modal { background: none; border: none; font-size: 24px; color: #a66275; cursor: pointer; padding: 0; line-height: 1; }
  .letter-content-area { padding: 20px; overflow-y: auto; flex: 1; font-family: "Songti SC", serif; font-size: 15px; color: #4a3742; line-height: 1.8; }
  .single-letter { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(0,0,0,0.03); position: relative; }
  .letter-time-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .letter-time { font-family: "Courier New", monospace; font-size: 11px; color: #b08d98; }
  .letter-act-group { display: flex; gap: 8px; align-items: center; }
  .letter-del-btn { background: none; border: none; color: #a66275; font-size: 11px; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all 0.2s; }
  .letter-del-btn:hover { color: #ff5e84; background-color: rgba(255, 94, 132, 0.08); }
  .note-act-btn.star-btn { color: #d1b3bd; font-size: 15px; }
  .note-act-btn.star-btn.active { color: #ff5e84; filter: drop-shadow(0 1px 3px rgba(255, 94, 132, 0.45)); }
  .letter-text { white-space: pre-wrap; font-style: italic; }

  /* 心境氛围贴纸药丸 */
  .moment-mood-pills { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .mood-pill {
    font-size: 12px; padding: 4px 10px; border-radius: 12px; background: rgba(255, 238, 241, 0.6);
    border: 1px solid rgba(229,153,169,0.3); color: #a66275; cursor: pointer; transition: all 0.2s;
  }
  .mood-pill.active { background: #ff8fa3; color: #fff; border-color: #ff8fa3; }

  /* 仿真手账生理日历 */
  .calendar-box { background: #fffdfd; border-radius: 20px; width: 100%; max-width: 440px; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 2.5px solid #000; }
  .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; font-family: "Georgia", "Songti SC", serif; }
  .calendar-nav-btn { background: none; border: none; font-size: 20px; color: #a66275; cursor: pointer; }
  .calendar-title-text { font-size: 16px; font-weight: bold; color: #5a4550; letter-spacing: 2px; }
  .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: #b08d98; font-weight: bold; margin-bottom: 10px; }
  .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 12px; text-align: center; }
  .calendar-day { position: relative; height: 36px; display: flex; align-items: center; justify-content: center; font-family: "Courier New", monospace; font-size: 13px; color: #5a4550; cursor: pointer; border-radius: 50%; width: 36px; margin: 0 auto; transition: background 0.2s; }
  .calendar-day:hover { background: rgba(229,153,169,0.15); }
  .calendar-day.empty { pointer-events: none; }
  .calendar-day.period-active { background: #ffb3c1; color: #fff; font-weight: bold; box-shadow: 0 0 10px rgba(255, 94, 132, 0.4); }
  .calendar-day.period-ongoing { border: 2px dashed #ff5e84; color: #ff5e84; font-weight: bold; }
  .calendar-day.today-marker { border: 1.5px solid #000000; }
  .calendar-legend { display: flex; justify-content: center; gap: 15px; margin-top: 18px; font-size: 11px; color: #b08d98; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-color { width: 10px; height: 10px; border-radius: 50%; }
  .legend-color.active { background: #ffb3c1; }
  .legend-color.ongoing { border: 2px dashed #ff5e84; }
  .day-action-popup { display: none; position: absolute; background: rgba(26,18,30,0.95); border-radius: 8px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.25); z-index: 2100; flex-direction: column; gap: 8px; width: 130px; }
  .day-action-btn { border: none; border-radius: 6px; padding: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; color: #fff; }
  .day-action-btn.start-period { background: #ff5e84; }
  .day-action-btn.end-period { background: #a66275; }
  .day-action-btn.cancel-action { background: transparent; color: #e2cbd4; border: 1px solid rgba(255,255,255,0.15); }
</style>
</head>
<body>
<div id="app">

  <!-- 1. 左侧波点玻璃舱导航栏 -->
  <div id="nav">
    <a class="nav-icon" href="javascript:void(0)" onclick="switchMainView('chat')" title="聊天">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <a class="nav-icon" href="javascript:void(0)" onclick="switchMainView('moments')" title="私密双人朋友圈">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </a>
    <a class="nav-icon" href="javascript:void(0)" onclick="openPeriodCalendar()" title="月经生理日历">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    </a>
    <a class="nav-icon" href="javascript:void(0)" onclick="openArchiveBox()" title="恋爱档案箱">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3.1-9-7.56c0-1.25.5-2.4 1.1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z"/><path d="M8 14v.5"/><path d="M16 14v.5"/><path d="M11.25 16.25h1.5L12 17l-.75-.75Z"/></svg>
    </a>
    <a class="nav-icon" href="javascript:void(0)" onclick="openPersonaEditor()" title="人设编辑">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="M15 5l4 4"/></svg>
    </a>
  </div>

  <!-- 2. 中间玻璃舱对话区 -->
  <div id="main">
    <div id="header">
      <div class="avatar-wrapper header-avatar-wrap charon">
        <img id="header-avatar" src="{{ avatar_charon }}" alt="Charon">
        <span class="star-accent">✦</span>
        <span class="dust-star d-1">✦</span>
        <span class="dust-star d-2">✦</span>
      </div>
      <div id="header-text">
        <div class="brand">CHARON</div>
        <div class="sub">
          <span class="status-badge"><span class="status-dot" id="status-dot"></span><span id="status-label">加载中…</span></span>
          <span class="model-select-wrap"><span class="status-dot" id="model-status-dot"></span><select id="model-select" title="选择模型"></select></span>
        </div>
      </div>
      <div class="header-signature-wrap">
        <span class="sig-star s-1">✦</span>
        <span class="sig-star s-2">✦</span>
        <div class="header-signature">@Seraphina</div>
      </div>
      <button id="push-enable-btn" onclick="enablePushNotifications()" title="开启通知推送"
        style="display:none; position:absolute; right:10px; bottom:6px; background:none; border:none; font-size:16px; cursor:pointer; opacity:0.6;">🔔</button>
    </div>
    <div id="messages"><div id="empty-hint">加载中…</div></div>
    <div id="input-bar">
      <textarea id="input" placeholder="说点什么…" rows="1"></textarea>
      <button id="send-btn" title="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <!-- 2.5 朋友圈视图 (全新拟物社交空间设计) -->
  <div id="moments-wrapper">
    <div id="moments-header">

<script>
const CODE = {{ code_param | tojson }};
const AVATAR_CHARON = {{ avatar_charon | tojson }};
const AVATAR_USER = {{ avatar_user | tojson }};
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusLabel = document.getElementById('status-label');
const contextMenu = document.getElementById('bubble-menu');
const dayActionPopup = document.getElementById('day-action-popup');

// 日历排盘与月经数据缓存
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let periodRecords = [];
let selectedDateStr = "";

// 长按/右键/双击 触发状态记录
let currentActiveMsgId = null;
let currentActiveRowEl = null;

// 发布动态选择的心境标签
let selectedMoodTag = "";

function addDoubleTapListener(element, callback) {
  let lastTap = 0;
  element.addEventListener('click', function(e) {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    if (tapLength < 300 && tapLength > 0) {
      e.preventDefault();
      callback(e);
    }
    lastTap = currentTime;
  });
}

function apiUrl(path) {
  const sep = path.includes('?') ? '&' : '?';
  return CODE ? `${path}${sep}code=${encodeURIComponent(CODE)}` : path;
}

function formatTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return '';
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  return h + ':' + m;
}

// 朋友圈相对时间智能计算（模拟主流聊天软件真实互动体验）
function formatRelativeTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const diffSec = Math.floor((now - d) / 1000);
  
  if (diffSec < 60) return '刚刚';
  if (diffSec < 3600) return `${Math.floor(diffSec / 60)}分钟前`;
  if (diffSec < 86400 && now.getDate() === d.getDate()) {
    return `今天 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }
  const yesterday = new Date(now);
  yesterday.setDate(yesterday.getDate() - 1);
  if (yesterday.getDate() === d.getDate() && yesterday.getMonth() === d.getMonth()) {
    return `昨天 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }
  return `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function renderMsgRow(role, content, createdAt, pending, msgId, model, isFailed) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'charon');
  if (msgId) row.dataset.msgId = msgId;
  if (createdAt) row.dataset.createdAt = createdAt;
  if (model) row.dataset.model = model;
  if (isFailed) row.dataset.failed = '1';

  const avatarWrap = document.createElement('div');
  avatarWrap.className = 'avatar-wrapper ' + (role === 'user' ? 'user' : 'charon');

  const tag = document.createElement('span');
  tag.className = 'avatar-tag';
  tag.textContent = role === 'user' ? 'Seraphina' : 'Charon';
  avatarWrap.appendChild(tag);

  const avatar = document.createElement('img');
  avatar.className = 'msg-avatar';
  avatar.src = role === 'user' ? AVATAR_USER : AVATAR_CHARON;
  avatarWrap.appendChild(avatar);

  const star = document.createElement('span');
  star.className = 'star-accent';
  star.textContent = '✦';
  avatarWrap.appendChild(star);

  const d1 = document.createElement('span');
  d1.className = 'dust-star d-1';
  d1.textContent = '✦';
  avatarWrap.appendChild(d1);

  const d2 = document.createElement('span');
  d2.className = 'dust-star d-2';
  d2.textContent = '✦';
  avatarWrap.appendChild(d2);

  row.appendChild(avatarWrap);

  const col = document.createElement('div');
  col.className = 'msg-col';

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'charon') + (pending ? ' pending' : '');
  if (pending && !content) {
    bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
  } else {
    bubble.textContent = content;
  }
  col.appendChild(bubble);

  let modelTagEl = null;
  if (role !== 'user' && model) {
    modelTagEl = document.createElement('div');
    modelTagEl.className = 'model-tag';
    modelTagEl.textContent = model;
    col.appendChild(modelTagEl);
  }

  const timeRow = document.createElement('div');
  timeRow.className = 'msg-time-row';

  const timeEl = document.createElement('span');
  timeEl.className = 'msg-time';
  timeEl.textContent = formatTime(createdAt);
  timeRow.appendChild(timeEl);

  col.appendChild(timeRow);
  row.appendChild(col);

  addDoubleTapListener(bubble, (e) => {
    if (row.classList.contains('editing')) return;
    currentActiveRowEl = row;
    showContextMenu(bubble, msgId, role, content, model, isFailed);
    if (modelTagEl) modelTagEl.classList.add('visible');
  });

  return row;
}

// 行内编辑模式
function enterEditMode(row, bubble, msgId, originalContent) {
  if (row.classList.contains('editing')) return;
  row.classList.add('editing');

  bubble.contentEditable = 'true';
  bubble.classList.add('editing-bubble');
  bubble.focus();
  const range = document.createRange();
  range.selectNodeContents(bubble);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  const actionBar = document.createElement('div');
  actionBar.className = 'edit-action-bar';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'edit-action-btn cancel';
  cancelBtn.textContent = '取消';

  const sendBtn = document.createElement('button');
  sendBtn.className = 'edit-action-btn send';
  sendBtn.textContent = '发送';

  actionBar.appendChild(cancelBtn);
  actionBar.appendChild(sendBtn);
  row.querySelector('.msg-col').appendChild(actionBar);

  function exitEditMode(restoreContent) {
    bubble.contentEditable = 'false';
    bubble.classList.remove('editing-bubble');
    if (restoreContent !== undefined) bubble.textContent = restoreContent;
    actionBar.remove();
    row.classList.remove('editing');
  }

  cancelBtn.onclick = () => exitEditMode(originalContent);

  sendBtn.onclick = async () => {
    const rawHtml = bubble.innerHTML.replace(/<div>/gi, '\n').replace(/<\/div>/gi, '').replace(/<br\s*\/?>/gi, '\n');
    const tempEl = document.createElement('div');
    tempEl.innerHTML = rawHtml;
    const newContent = tempEl.textContent.trim();
    if (!newContent) { exitEditMode(originalContent); return; }
    if (newContent === originalContent) { exitEditMode(); return; }

    sendBtn.disabled = true;
    cancelBtn.disabled = true;
    bubble.contentEditable = 'false';
    bubble.classList.remove('editing-bubble');
    bubble.classList.add('pending');

    try {
      const res = await fetch(apiUrl('/api/chat-edit-resend'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: msgId, new_content: newContent })
      });
      const data = await res.json();
      if (!data.ok) {
        alert('编辑失败：' + (data.error || '未知错误'));
        exitEditMode(originalContent);
        return;
      }
      bubble.textContent = newContent;
      bubble.classList.remove('pending');
      actionBar.remove();
      row.classList.remove('editing');

      let sibling = row.nextSibling;
      while (sibling) {
        const toRemove = sibling;
        sibling = sibling.nextSibling;
        toRemove.remove();
      }

      messagesEl.appendChild(renderMsgRow('charon', data.reply, new Date().toISOString(), false, data.charon_msg_id, data.model));
      scrollToBottom();
      loadStatus();
    } catch (e) {
      alert('网络错误，编辑重发失败');
      exitEditMode(originalContent);
    }
  };
}

// 全局上下文菜单管理
function showContextMenu(targetElement, id, typeOrRole, textContent = "", model = "", isFailed = false) {
  const rect = targetElement.getBoundingClientRect();
  contextMenu.style.visibility = 'hidden';
  contextMenu.style.display = 'flex';
  contextMenu.innerHTML = '';

  const buttonsRow = document.createElement('div');
  buttonsRow.className = 'bubble-menu-buttons-row';

  if (isFailed) {
    const clearBtn = document.createElement('button');
    clearBtn.className = 'menu-btn';
    clearBtn.textContent = '🗑️ 清除这条提示';
    clearBtn.onclick = () => {
      if (currentActiveRowEl) currentActiveRowEl.remove();
      hideWeChatMenu();
    };
    buttonsRow.appendChild(clearBtn);
    contextMenu.appendChild(buttonsRow);
    requestAnimationFrame(() => {
      const menuWidth = contextMenu.offsetWidth || 200;
      const menuHeight = contextMenu.offsetHeight || 34;
      contextMenu.style.left = (rect.left + rect.width / 2 - menuWidth / 2 + window.scrollX) + 'px';
      contextMenu.style.top = (rect.top - menuHeight - 8 + window.scrollY) + 'px';
      contextMenu.style.visibility = 'visible';
    });
    return;
  }

  if (typeOrRole === 'user' || typeOrRole === 'charon') {
    const copyBtn = document.createElement('button');
    copyBtn.className = 'menu-btn';
    copyBtn.textContent = '📄 复制';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(textContent).then(() => hideWeChatMenu());
    };
    buttonsRow.appendChild(copyBtn);

    if (id) {
      if (typeOrRole === 'user') {
        const editBtn = document.createElement('button');
        editBtn.className = 'menu-btn';
        editBtn.textContent = '✍️ 重新编辑';
        editBtn.onclick = () => {
          if (currentActiveRowEl) {
            const bubbleEl = currentActiveRowEl.querySelector('.bubble');
            if (bubbleEl) enterEditMode(currentActiveRowEl, bubbleEl, id, textContent);
          }
          hideWeChatMenu();
        };
        buttonsRow.appendChild(editBtn);
      } else if (typeOrRole === 'charon') {
        const regenBtn = document.createElement('button');
        regenBtn.className = 'menu-btn';
        regenBtn.textContent = '🔄 重新生成';
        regenBtn.onclick = () => {
          if (currentActiveRowEl) regenerateMessage(id, currentActiveRowEl);
          hideWeChatMenu();
        };
        buttonsRow.appendChild(regenBtn);
      }

      const recallBtn = document.createElement('button');
      recallBtn.className = 'menu-btn';
      recallBtn.textContent = '🗑️ 撤回';
      recallBtn.onclick = () => {
        if (currentActiveRowEl) deleteMessage(id, currentActiveRowEl);
        hideWeChatMenu();
      };
      buttonsRow.appendChild(recallBtn);
    }
  } else if (typeOrRole === 'desk-note') {
    const moveBtn = document.createElement('button');
    moveBtn.className = 'menu-btn';
    moveBtn.textContent = '📥 移入抽屉';
    moveBtn.onclick = () => { moveNote(id, 'drawer', 'desk'); hideWeChatMenu(); };
    buttonsRow.appendChild(moveBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'menu-btn';
    delBtn.textContent = '🗑️ 撕掉丢弃';
    delBtn.onclick = () => {
      targetElement.style.transition = 'all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1)';
      targetElement.style.transform = 'translateY(60px) scale(0.7) rotate(20deg)';
      targetElement.style.opacity = '0';
      setTimeout(() => { deleteNote(id, 'desk'); }, 400);
      hideWeChatMenu();
    };
    buttonsRow.appendChild(delBtn);
  }

  contextMenu.appendChild(buttonsRow);

  requestAnimationFrame(() => {
    const menuWidth = contextMenu.offsetWidth || 200;
    const menuHeight = contextMenu.offsetHeight || 34;
    contextMenu.style.left = (rect.left + rect.width / 2 - menuWidth / 2 + window.scrollX) + 'px';
    contextMenu.style.top = (rect.top - menuHeight - 8 + window.scrollY) + 'px';
    contextMenu.style.visibility = 'visible';
  });
}

function hideWeChatMenu() {
  contextMenu.style.display = 'none';
  contextMenu.style.visibility = 'visible';
  if (currentActiveRowEl) {
    const tagEl = currentActiveRowEl.querySelector('.model-tag');
    if (tagEl) tagEl.classList.remove('visible');
  }
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.bubble') && !e.target.closest('.sticky-note-card') && !e.target.classList.contains('menu-btn')) {
    hideWeChatMenu();
  }
  if (!e.target.classList.contains('calendar-day') && !e.target.classList.contains('day-action-btn')) {
    hideDayActionPopup();
  }
  // 全局点击自动收起朋友圈微信样式的展开气泡
  if (!e.target.closest('.moment-action-trigger') && !e.target.closest('.moment-action-popover')) {
    document.querySelectorAll('.moment-action-popover.active').forEach(el => el.classList.remove('active'));
  }
});

async function deleteMessage(msgId, rowEl) {
  try {
    const res = await fetch(apiUrl('/api/chat-delete'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: msgId })
    });
    const data = await res.json();
    if (data.ok) { rowEl.remove(); loadStatus(); } 
    else { alert('撤回失败：' + (data.error || '未知错误')); }
  } catch (e) { alert('网络错误，无法撤回'); }
}

async function regenerateMessage(msgId, rowEl) {
  const bubble = rowEl.querySelector('.bubble');
  const originalText = bubble ? bubble.textContent : '';
  const createdAt = rowEl.dataset.createdAt || new Date().toISOString();
  if (bubble) { bubble.textContent = '…'; bubble.classList.add('pending'); }
  try {
    const res = await fetch(apiUrl('/api/chat-regenerate'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: msgId })
    });
    const data = await res.json();
    if (data.ok) {
      rowEl.replaceWith(renderMsgRow('charon', data.reply, createdAt, false, msgId, data.model));
      loadStatus();
    } else {
      if (bubble) { bubble.textContent = originalText; bubble.classList.remove('pending'); }
      alert('重新生成失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    if (bubble) { bubble.textContent = originalText; bubble.classList.remove('pending'); }
    alert('网络错误，重新生成失败');
  }
}

function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

let oldestLoadedAt = null;
let hasMoreHistory = true;
let isLoadingMoreHistory = false;

async function loadHistory() {
  try {
    const res = await fetch(apiUrl('/api/chat-messages'));
    const data = await res.json();
    messagesEl.innerHTML = '';
    if (!data.ok) { messagesEl.innerHTML = '<div id="empty-hint">加载失败</div>'; return; }
    if (!data.messages || data.messages.length === 0) { messagesEl.innerHTML = '<div id="empty-hint">还没有聊过，说点什么吧</div>'; return; }
    data.messages.forEach(m => messagesEl.appendChild(renderMsgRow(m.role, m.content, m.created_at, false, m.id, m.model)));
    oldestLoadedAt = data.messages[0].created_at;
    hasMoreHistory = !!data.has_more;
    scrollToBottom();
  } catch (e) { messagesEl.innerHTML = '<div id="empty-hint">网络错误</div>'; }
}

async function loadMoreHistory() {
  if (isLoadingMoreHistory || !hasMoreHistory || !oldestLoadedAt) return;
  isLoadingMoreHistory = true;
  try {
    const res = await fetch(apiUrl(`/api/chat-messages?before=${encodeURIComponent(oldestLoadedAt)}`));
    const data = await res.json();
    if (!data.ok || !data.messages || data.messages.length === 0) {
      hasMoreHistory = false;
      return;
    }
    const prevScrollHeight = messagesEl.scrollHeight;
    const frag = document.createDocumentFragment();
    data.messages.forEach(m => frag.appendChild(renderMsgRow(m.role, m.content, m.created_at, false, m.id, m.model)));
    messagesEl.insertBefore(frag, messagesEl.firstChild);
    messagesEl.scrollTop += (messagesEl.scrollHeight - prevScrollHeight);
    oldestLoadedAt = data.messages[0].created_at;
    hasMoreHistory = !!data.has_more;
  } catch (e) {
  } finally {
    isLoadingMoreHistory = false;
  }
}

messagesEl.addEventListener('scroll', () => {
  if (messagesEl.scrollTop < 40) loadMoreHistory();
});

function getPersonalizedStyle(id, index) {
  const colors = [
    { bg: '#ffe3e7', grad: '#ffd1d7', text: '#7a5a65', name: 'sakura' },  
    { bg: '#e8f5e9', grad: '#d4eed8', text: '#4e5a50', name: 'mint' },    
    { bg: '#fffde7', grad: '#fff9c4', text: '#6b6450', name: 'cream' },   
    { bg: '#e3f2fd', grad: '#bbdefb', text: '#455160', name: 'sky' },     
    { bg: '#efebe9', grad: '#d7ccc8', text: '#5c443f', name: 'coffee' }   
  ];
  const color = colors[id % 5];
  let bgStyle = '';
  const textureType = index % 5;
  if (textureType === 0) {
    bgStyle = `background: radial-gradient(circle, rgba(255, 255, 255, 0.45) 15%, transparent 15.5%), radial-gradient(circle, rgba(255, 255, 255, 0.45) 15%, transparent 15.5%), ${color.bg}; background-size: 8px 8px, 8px 8px; background-position: 0 0, 4px 4px;`;
  } else if (textureType === 1) {
    bgStyle = `background: repeating-linear-gradient(transparent, transparent 15px, rgba(90, 69, 80, 0.05) 15px, rgba(90, 69, 80, 0.05) 16px), ${color.bg}; background-position: 0 0;`;
  } else if (textureType === 2) {
    bgStyle = `background: repeating-linear-gradient(transparent, transparent 15px, rgba(90, 69, 80, 0.04) 15px, rgba(90, 69, 80, 0.04) 16px), repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(90, 69, 80, 0.04) 15px, rgba(90, 69, 80, 0.04) 16px), ${color.bg};`;
  } else if (textureType === 3) {
    bgStyle = `background: ${color.bg};`;
  } else {
    bgStyle = `background: linear-gradient(135deg, ${color.bg} 0%, ${color.grad} 100%);`;
  }
  return { bgStyle: bgStyle, textColor: color.text };
}

// ---- 加载状态 (Desk & 堆叠便签) ----
async function loadStatus() {
  try {
    const res = await fetch(apiUrl('/api/chat-status'));
    const data = await res.json();
    if (!data.ok) return;

    statusLabel.textContent = data.status_label || '在线';
    document.getElementById('status-dot').className = 'status-dot' + (data.mood_score < 50 ? ' low' : '');

    const container = document.getElementById('sticky-container');
    container.innerHTML = '';
    
    if (data.sticky_notes && data.sticky_notes.length > 0) {
      const isDeskFull = data.desk_full;

      data.sticky_notes.forEach((note, index) => {
        const card = document.createElement('div');
        card.className = `sticky-note-card`;

        function hashNoteId(n, salt) {
          n = (n ^ salt) >>> 0;
          n = Math.imul(n ^ (n >>> 16), 0x45d9f3b) >>> 0;
          n = Math.imul(n ^ (n >>> 16), 0x45d9f3b) >>> 0;
          n = (n ^ (n >>> 16)) >>> 0;
          return n % 1000;
        }
        const h1 = hashNoteId(note.id, 0);
        const h2 = hashNoteId(note.id, 7919);
        const rotateDeg = ((h1 / 1000) * 10 - 5).toFixed(1);   
        const shiftX = ((h2 / 1000) * 32 - 16).toFixed(1);      
        card.style.transform = `rotate(${rotateDeg}deg) translateX(${shiftX}px)`;
        card.style.margin = index === 0 ? '0 auto' : '-27px auto 0'; 
        card.style.zIndex = 15 - index;
        
        const styleObj = getPersonalizedStyle(note.id, index);
        card.style.cssText += styleObj.bgStyle;
        card.style.color = styleObj.textColor;

        if (isDeskFull) {
          card.style.boxShadow = '0 0 15px rgba(255, 94, 132, 0.4), inset 0 0 0 1px rgba(255,255,255,1)';
        }

        const starIcon = note.is_starred ? '★' : '☆';
        const starClass = note.is_starred ? 'active' : '';

        card.innerHTML = `
          <div class="sticky-note-text" style="color: ${styleObj.textColor};">${escapeHtml(note.message)}</div>
          <button class="note-star-btn ${starClass}" onclick="event.stopPropagation(); starNote(${note.id}, ${note.is_starred}, 'desk', this)" title="标星收藏">${starIcon}</button>
        `;

        addDoubleTapListener(card, (e) => {
          showContextMenu(card, note.id, "desk-note");
        });

        container.appendChild(card);
      });
    } else {
      container.innerHTML = `
        <div class="sticky-note-card" style="transform: rotate(-1deg); position: relative; margin: 0 auto;">
          <div class="sticky-note-text" style="color:#b08d98; text-align:center;">桌面空空的，TA还没有新的留言。</div>
        </div>
      `;
    }

    const notesBtn = document.getElementById('drawer-notes-btn');
    const lettersBtn = document.getElementById('drawer-letters-btn');
    
    fetch(apiUrl('/api/sticky-notes?status=drawer')).then(res=>res.json()).then(d => {
      if(d.ok) {
        document.getElementById('notes-drawer-count').textContent = `${d.notes.length}/30`;
        document.getElementById('box-notes-count').textContent = `${d.notes.length}/30`;
        if (d.layer_full.drawer) notesBtn.classList.add('layer-full');
        else notesBtn.classList.remove('layer-full');
      }
    });

    fetch(apiUrl('/api/love-letters?status=drawer')).then(res=>res.json()).then(d => {
      if(d.ok) {
        document.getElementById('letters-drawer-count').textContent = `${d.letters.length}/20`;
        document.getElementById('box-letters-count').textContent = `${d.letters.length}/20`;
        if (d.layer_full.drawer) lettersBtn.classList.add('layer-full');
        else lettersBtn.classList.remove('layer-full');
      }
    });

    Promise.all([
      fetch(apiUrl('/api/sticky-notes?status=archive')).then(res=>res.json()),
      fetch(apiUrl('/api/love-letters?status=archive')).then(res=>res.json())
    ]).then(([noteData, letterData]) => {
      if(noteData.ok && letterData.ok) {
        const total = noteData.notes.length + letterData.letters.length;
        document.getElementById('box-archive-count').textContent = `${total}/200`;
      }
    });

    document.getElementById('new-letter-indicator').style.display = data.has_new_letter ? 'inline' : 'none';

  } catch (e) { console.error("状态加载失败", e); }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = ''; inputEl.style.height = 'auto'; sendBtn.disabled = true;

  const nowIso = new Date().toISOString();
  const userRow = renderMsgRow('user', text, nowIso, false);
  messagesEl.appendChild(userRow);
  const pendingRow = renderMsgRow('charon', '', nowIso, true);
  messagesEl.appendChild(pendingRow);
  scrollToBottom();

  const pendingBubble = pendingRow.querySelector('.bubble');

  try {
    const res = await fetch(apiUrl('/api/chat-send'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text })
    });

    if (!res.ok || !res.body) {
      throw new Error('网络请求失败');
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let sawDone = false;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data: ')) continue;
        const jsonStr = line.slice('data: '.length);
        let evt;
        try { evt = JSON.parse(jsonStr); } catch (e) { continue; }

        if (evt.delta) {
          pendingBubble.textContent += evt.delta;
          scrollToBottom();
        } else if (evt.error) {
        } else if (evt.done) {
          sawDone = true;
          if (evt.reply) {
            userRow.replaceWith(renderMsgRow('user', text, nowIso, false, evt.user_msg_id));
            pendingRow.replaceWith(renderMsgRow('charon', evt.reply, nowIso, false, evt.charon_msg_id, evt.model));
          } else {
            pendingRow.replaceWith(renderMsgRow('charon', '（没能回复：模型调用失败）', nowIso, false, null, null, true));
          }
        }
      }
    }

    if (!sawDone) {
      const partial = pendingBubble.textContent;
      pendingRow.replaceWith(renderMsgRow('charon', partial || '（连接中断，没能收到完整回复）', nowIso, false, null, null, true));
    }
  } catch (e) {
    pendingRow.replaceWith(renderMsgRow('charon', '（网络错误，没发出去）', nowIso, false, null, null, true));
  }
  scrollToBottom(); sendBtn.disabled = false; loadStatus();
}

function renderMoments(moments) {
  const feed = document.getElementById('moments-feed');
  feed.innerHTML = '';

  // 1. 顶部情侣专属拍立得封面看板 (微信朋友圈经典的 Cover Header)
  const coverEl = document.createElement('div');
  coverEl.className = 'moments-cover';
  coverEl.innerHTML = `
    <div class="cover-inner">
      <div class="cover-motto">
        “无论在日常的哪个缝隙，<br>目光始终停留在你身上。”
        <span class="cover-motto-sig">SERAPHINA & CHARON</span>
      </div>
      <div class="cover-avatars-cluster">
        <div class="polaroid-avatar-chip charon-chip" title="Charon">
          <img src="${AVATAR_CHARON}" alt="Charon">
        </div>
        <div class="polaroid-avatar-chip user-chip" title="Seraphina">
          <img src="${AVATAR_USER}" alt="Seraphina">
        </div>
      </div>
    </div>
  `;
  feed.appendChild(coverEl);

  const listContainer = document.createElement('div');
  listContainer.className = 'moments-list';

  if (!moments || moments.length === 0) {
    listContainer.innerHTML = '<div style="text-align:center; color:#b08d98; margin: 40px 0; font-size:13px;">空间还空着呢，留下你们的第一条专属回忆吧。</div>';
    feed.appendChild(listContainer);
    return;
  }

  // 2. 循环渲染单条动态
  moments.forEach(m => {
    const isUser = m.author === 'user';
    const authorName = isUser ? 'Seraphina' : 'Charon';
    const avatar = isUser ? AVATAR_USER : AVATAR_CHARON;
    const badgeText = isUser ? 'MINE' : 'CHARON';
    const isLikedByUser = m.likes && m.likes.includes('user');
    
    // 点赞列表渲染
    let likesHtml = '';
    if (m.likes && m.likes.length > 0) {
      const namesHtml = m.likes.map(l => {
        const uName = l === 'user' ? 'Seraphina' : 'Charon';
        return `<span class="like-user-name">${uName}</span>`;
      }).join(', ');
      likesHtml = `
        <div class="interaction-likes">
          <span class="like-heart-icon">♥</span>
          <div>${namesHtml} 觉得很甜</div>
        </div>
      `;
    }

    // 评论列表渲染
    let commentsHtml = '';
    if (m.comments && m.comments.length > 0) {
      commentsHtml = `<div class="interaction-comments">`;
      m.comments.forEach(c => {
        const isCCharon = c.author === 'charon';
        const cName = isCCharon ? 'Charon' : 'Seraphina';
        commentsHtml += `
          <div class="interaction-comment-item">
            <span class="comment-speaker ${isCCharon ? 'charon-speaker' : ''}">${cName}:</span>
            ${escapeHtml(c.content)}
          </div>
        `;
      });
      commentsHtml += `</div>`;
    }

    // 拍立得照片相框展示
    let photoHtml = '';
    if (m.image_url) {
      photoHtml = `
        <div class="moment-polaroid-frame">
          <img src="${escapeHtml(m.image_url)}" alt="Polaroid moment">
        </div>
      `;
    }

    // 作者删除权限按钮（仅允许删除用户自己发的）
    let deleteHtml = '';
    if (isUser) {
      deleteHtml = `<a class="moment-del-link" onclick="deleteMoment('${m.id}')">删除</a>`;
    }

    const card = document.createElement('div');
    card.className = 'moment-card';
    card.id = `moment-card-${m.id}`;

    card.innerHTML = `
      <div class="moment-main-layout">
        <div class="moment-left-col">
          <div class="moment-avatar-box">
            <img src="${avatar}" alt="${authorName}">
          </div>
        </div>
        <div class="moment-right-col">
          <div class="moment-user-header">
            <div class="moment-author-info">
              <span class="moment-author-name ${isUser ? '' : 'charon-author'}">${authorName}</span>
              <span class="moment-badge ${isUser ? 'user-badge' : 'charon-badge'}">${badgeText}</span>
            </div>
          </div>
          
          <div class="moment-content">${escapeHtml(m.content)}</div>
          ${photoHtml}

          <div class="moment-footer-bar">
            <div class="moment-meta-left">
              <span>${formatRelativeTime(m.created_at)}</span>
              ${deleteHtml}
            </div>

            <!-- 微信经典双点 (··) 操作触发器 -->
            <button class="moment-action-trigger" onclick="toggleActionPopover(event, '${m.id}')" title="互动">
              <span class="trigger-dot"></span>
              <span class="trigger-dot"></span>
            </button>

            <!-- 浮动操作条 (赞 / 评论) -->
            <div class="moment-action-popover" id="popover-${m.id}">
              <button class="popover-btn ${isLikedByUser ? 'liked' : ''}" onclick="toggleLike('${m.id}', ${isLikedByUser})">
                <span style="font-size:13px;">${isLikedByUser ? '♥' : '♡'}</span> ${isLikedByUser ? '已赞' : '赞'}
              </button>
              <div class="popover-divider"></div>
              <button class="popover-btn" onclick="openCommentInput('${m.id}')">
                <span style="font-size:12px;">💬</span> 评论
              </button>
            </div>
          </div>

          <!-- 点赞和评论聚合展示卡片 -->
          ${ (likesHtml || commentsHtml) ? `
            <div class="moment-interaction-box">
              ${likesHtml}
              ${commentsHtml}
            </div>
          ` : '' }

          <!-- 展开的快捷评论输入框 -->
          <div class="moment-comment-input-wrap" id="comment-wrap-${m.id}">
            <input type="text" class="moment-comment-input" placeholder="写一句温和的评论..." id="comment-input-${m.id}" onkeydown="handleCommentKey(event, '${m.id}')">
            <button class="moment-comment-send" onclick="submitComment('${m.id}')">发送</button>
          </div>
        </div>
      </div>
    `;

    listContainer.appendChild(card);
  });

  feed.appendChild(listContainer);
}

// 展开/收起 微信样式浮动药丸小操作条
function toggleActionPopover(event, id) {
  event.stopPropagation();
  const target = document.getElementById(`popover-${id}`);
  const wasActive = target.classList.contains('active');
  
  // 先关掉所有其他的展开条
  document.querySelectorAll('.moment-action-popover.active').forEach(el => el.classList.remove('active'));
  
  if (!wasActive) {
    target.classList.add('active');
  }
}

// 唤起行内评论输入框并聚焦
function openCommentInput(id) {
  const popover = document.getElementById(`popover-${id}`);
  if (popover) popover.classList.remove('active');
  
  const wrap = document.getElementById(`comment-wrap-${id}`);
  const input = document.getElementById(`comment-input-${id}`);
  if (wrap) {
    wrap.classList.add('active');
    setTimeout(() => { input && input.focus(); }, 100);
  }
}

function handleCommentKey(e, id) {
  if (e.key === 'Enter') {
    e.preventDefault();
    submitComment(id);
  }
}

async function submitMoment() {
  const rawText = document.getElementById('moment-input-textarea').value.trim();
  if (!rawText) return;
  
  const content = selectedMoodTag ? `[${selectedMoodTag}] ${rawText}` : rawText;
  const saveBtn = document.getElementById('moment-save-btn');
  saveBtn.disabled = true;
  
  try {
    const res = await fetch(apiUrl('/api/moments'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: content })
    });
    const data = await res.json();
    if (data.ok) {
      closePublishModal();
      fetchMoments();
      loadStatus();
    } else {
      alert('发布失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('发布失败：网络错误');
  } finally {
    saveBtn.disabled = false;
  }
}

async function toggleLike(id, isLiked) {
  const popover = document.getElementById(`popover-${id}`);
  if (popover) popover.classList.remove('active');

  try {
    const res = await fetch(apiUrl('/api/moments/like'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    });
    const data = await res.json();
    if (data.ok) {
      fetchMoments();
    }
  } catch (e) {
    alert('网络错误');
  }
}

async function submitComment(id) {
  const input = document.getElementById(`comment-input-${id}`);
  const text = input.value.trim();
  if (!text) return;
  
  try {
    const res = await fetch(apiUrl('/api/moments/comment'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, content: text })
    });
    const data = await res.json();
    if (data.ok) {
      input.value = '';
      const wrap = document.getElementById(`comment-wrap-${id}`);
      if (wrap) wrap.classList.remove('active');
      fetchMoments();
    } else {
      alert('评论失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('评论失败：网络错误');
  }
}

async function deleteMoment(id) {
  if (!confirm('确定要抹去这条珍贵的回忆吗？')) return;
  const card = document.getElementById(`moment-card-${id}`);
  if (card) {
    card.style.transition = 'all 0.35s ease';
    card.style.opacity = '0';
    card.style.transform = 'translateY(-10px) scale(0.96)';
  }
  try {
    const res = await fetch(apiUrl('/api/moments/delete'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    });
    const data = await res.json();
    if (data.ok) {
      setTimeout(() => { if (card) card.remove(); }, 350);
    } else {
      alert('删除失败：' + (data.error || '未知错误'));
      fetchMoments();
    }
  } catch (e) {
    alert('网络错误');
    fetchMoments();
  }
}

async function fetchPeriodData(year) {
  try {
    const res = await fetch(apiUrl(`/api/period/calendar?year=${year}`));
    const data = await res.json();
    if (data.ok) {
      periodRecords = data.records;
      renderCalendarGrid();
    }
  } catch(e) {}
}

function renderCalendarGrid() {
  const grid = document.getElementById('calendar-days-grid');
  const title = document.getElementById('calendar-month-year');
  grid.innerHTML = '';

  title.textContent = `${currentYear}年${currentMonth + 1}月`;

  const firstDay = new Date(currentYear, currentMonth, 1);
  let dayOfWeek = firstDay.getDay(); 
  dayOfWeek = (dayOfWeek === 0) ? 6 : dayOfWeek - 1; 

  const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

  for (let i = 0; i < dayOfWeek; i++) {
    const span = document.createElement('span');
    span.className = 'calendar-day empty';
    grid.appendChild(span);
  }

  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

  for (let day = 1; day <= totalDays; day++) {
    const dayBtn = document.createElement('span');
    dayBtn.className = 'calendar-day';
    dayBtn.textContent = day;

    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    if (dateStr === todayStr) dayBtn.classList.add('today-marker');

    periodRecords.forEach(record => {
      const start = record.start_date;
      const end = record.end_date;
      if (start) {
        if (end) {
          if (dateStr >= start && dateStr <= end) dayBtn.classList.add('period-active');
        } else {
          if (dateStr >= start && dateStr <= todayStr) dayBtn.classList.add('period-active');
          if (dateStr === start) dayBtn.classList.add('period-ongoing');
        }
      }
    });

    dayBtn.onclick = (e) => {
      e.stopPropagation();
      selectedDateStr = dateStr;
      showDayActionPopup(dayBtn);
    };
    grid.appendChild(dayBtn);
  }
}

function prevMonth() {
  if (currentMonth === 0) { currentMonth = 11; currentYear--; fetchPeriodData(currentYear); } 
  else { currentMonth--; renderCalendarGrid(); }
}
function nextMonth() {
  if (currentMonth === 11) { currentMonth = 0; currentYear++; fetchPeriodData(currentYear); } 
  else { currentMonth++; renderCalendarGrid(); }
}

function showDayActionPopup(dayBtn) {
  const rect = dayBtn.getBoundingClientRect();
  dayActionPopup.style.display = 'flex';
  dayActionPopup.style.left = (rect.left + rect.width/2 - 65 + window.scrollX) + 'px';
  dayActionPopup.style.top = (rect.top - 110 + window.scrollY) + 'px';
  document.getElementById('popup-start-btn').onclick = () => savePeriodDate('start');
  document.getElementById('popup-end-btn').onclick = () => savePeriodDate('end');

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function setupPushNotifications() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const registration = await navigator.serviceWorker.register('/service-worker.js');
    if (Notification.permission === 'denied') return; 
    let subscription = await registration.pushManager.getSubscription();
    if (subscription) return; 
    const btn = document.getElementById('push-enable-btn');
    if (btn) btn.style.display = 'block';
    if (Notification.permission === 'granted') {
      await subscribeToPush(registration);
      if (btn) btn.style.display = 'none';
    }
  } catch (e) { console.warn('Service worker注册失败', e); }
}

async function subscribeToPush(registration) {
  try {
    const keyRes = await fetch(apiUrl('/api/push/vapid-public-key'));
    const keyData = await keyRes.json();
    if (!keyData.ok) return;

    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(keyData.public_key)
    });

    await fetch(apiUrl('/api/push/subscribe'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(subscription.toJSON())
    });
  } catch (e) { console.warn('订阅推送失败', e); }
}

window.enablePushNotifications = async function() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('当前浏览器不支持推送通知');
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      alert('未授权通知权限，无法开启推送');
      return;
    }
    const registration = await navigator.serviceWorker.ready;
    await subscribeToPush(registration);
    const btn = document.getElementById('push-enable-btn');
    if (btn) btn.style.display = 'none';
    alert('推送通知已开启');
  } catch (e) { alert('开启失败：' + e.message); }
};

setupPushNotifications();
</script>
