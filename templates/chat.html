<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Charon</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/app_icon_192.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Charon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: radial-gradient(circle at 10% 20%, #fffcfd 0%, #fbf3f5 35%, #f3e2e6 70%, #ebd3d9 100%);
    background-attachment: fixed;
    font-family: "Songti SC", "STSong", Georgia, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    color: #5a4550;
    overflow: hidden;
  }
  
  /* 基础桌面布局框架 */
  #app {
    display: flex;
    height: 100vh; height: 100dvh;
    padding: 14px;
    gap: 14px;
    position: relative;
    z-index: 2;
    transition: all 0.3s ease;
  }

  /* ---- 左侧波点玻璃舱导航栏 (PC端专用) ---- */
  #nav {
    width: 60px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 24px 0;
    background: rgba(255, 238, 241, 0.6);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px 0 rgba(184, 118, 138, 0.08);
  }
  #nav::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, #000000 0%, #000000 20%, #c0b8c0 30%, #ffffff 40%, #ffffff 60%, #c0b8c0 80%, #000000 100%);
    -webkit-mask-image: 
      radial-gradient(circle, #000 24%, transparent 24.5%),
      radial-gradient(circle, #000 24%, transparent 24.5%);
    -webkit-mask-size: 22px 22px; 
    -webkit-mask-position: 0 0, 11px 11px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.85;
  }
  
  /* ---- 导航图标 & 操作圆形按钮 ---- */
  .nav-icon, #send-btn, .tool-circle-btn {
    position: relative;
    z-index: 1;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: none !important;
    background: 
      radial-gradient(circle, rgba(255, 143, 163, 0.22) 15%, transparent 15.5%),
      radial-gradient(circle, rgba(255, 143, 163, 0.22) 15%, transparent 15.5%),
      rgba(255, 255, 255, 0.95) !important;
    background-size: 6px 6px, 6px 6px, 100% 100% !important;
    background-position: 0 0, 3px 3px, 0 0 !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #ff8fa3 !important;
    text-decoration: none;
    transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08) !important;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .nav-icon svg, .tool-circle-btn svg { width: 20px; height: 20px; stroke-width: 1.6px; }
  .nav-icon:hover, #send-btn:hover, .tool-circle-btn:hover {
    transform: translateY(-2px) scale(1.05);
    background-color: rgba(255, 255, 255, 0.98) !important;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12) !important; 
  }
  .nav-icon:active, #send-btn:active, .tool-circle-btn:active { 
    transform: translateY(0) scale(0.95); 
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05) !important;
  }
  .nav-icon.active {
    background: linear-gradient(135deg, #f3b0c3, #e593a4) !important;
    color: #ffffff !important;
  }
  #send-btn svg { width: 18px; height: 18px; stroke-width: 1.5px; transform: rotate(-10deg) translate(-1px, 1px); transition: transform 0.2s ease; }
  #send-btn:hover svg { transform: rotate(5deg) scale(1.1); }
  #send-btn:disabled { opacity: 0.5; filter: grayscale(50%); cursor: default; box-shadow: none !important; }

  /* ---- 中间玻璃舱对话区 ---- */
  #main {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border-radius: 28px; box-shadow: 0 12px 40px rgba(184, 118, 138, 0.10); overflow: hidden; position: relative;
    background-size: cover; background-position: center;
  }
  #main::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%), radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%);
    background-size: 10px 10px; background-position: 0 0, 5px 5px; pointer-events: none; z-index: 0;
  }
  
  /* ---- Header ---- */
  #header {
    padding: 16px 22px; border-bottom: 1px solid rgba(255, 255, 255, 0.2); flex-shrink: 0;
    display: flex; align-items: center; gap: 14px; position: relative;
    background: linear-gradient(to right, #000000 0%, #000000 52%, rgba(26, 18, 30, 0.9) 62%, #cf7d90 85%, #ffb3c1 100%);
    z-index: 1;
  }
  #header::before {
    content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 65%;
    background-image: radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%), radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%);
    background-size: 11px 11px; background-position: 0 0, 5.5px 5.5px;
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%); pointer-events: none; z-index: 0;
  }
  
  .avatar-wrapper { position: relative; display: inline-block; width: 36px; height: 36px; flex-shrink: 0; cursor: pointer; }
  .avatar-wrapper.header-avatar-wrap { width: 44px; height: 44px; }
  .avatar-wrapper .msg-avatar, .avatar-wrapper #header-avatar {
    border: 1.5px solid #ffffff; box-shadow: 0 0 8px rgba(255, 255, 255, 0.6); 
  }
  .avatar-wrapper .star-accent { position: absolute; font-size: 15px; pointer-events: none; user-select: none; animation: star-pulse 2s infinite ease-in-out; }
  .avatar-wrapper.charon .star-accent { top: -6px; left: -6px; color: #000000; text-shadow: 0 0 4px #000000, 0 0 10px rgba(0, 0, 0, 0.95); }
  .avatar-wrapper.user .star-accent { top: -6px; right: -6px; color: #ffb3c1; text-shadow: 0 0 4px #ff5e84, 0 0 10px rgba(255, 94, 132, 0.95); }
  .avatar-wrapper .dust-star { position: absolute; pointer-events: none; user-select: none; color: #ffffff; text-shadow: 0 0 5px rgba(255, 255, 255, 0.8); }
  .avatar-wrapper.charon .dust-star.d-1 { bottom: -4px; right: -4px; font-size: 9px; opacity: 0.8; }
  .avatar-wrapper.charon .dust-star.d-2 { top: 14px; right: -7px; font-size: 8px; opacity: 0.6; }
  .avatar-wrapper.user .dust-star.d-1 { bottom: -4px; left: -4px; font-size: 9px; opacity: 0.8; }
  .avatar-wrapper.user .dust-star.d-2 { top: 14px; left: -7px; font-size: 8px; opacity: 0.6; }
  @keyframes star-pulse { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.15); opacity: 1; } }
  
  .avatar-tag {
    position: absolute; font-family: "Dancing Script", cursive; font-size: 11px; white-space: nowrap; pointer-events: none; user-select: none; z-index: 2;
  }
  .avatar-wrapper.charon .avatar-tag { top: -15px; left: 50%; transform: translateX(-50%); color: #5a4550; text-shadow: 0 0 4px rgba(255, 255, 255, 0.8); }
  .avatar-wrapper.user .avatar-tag { top: -15px; left: 50%; transform: translateX(-50%); color: #cf7d90; text-shadow: 0 0 4px rgba(255, 255, 255, 0.8); }

  #header-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  #header-text { position: relative; z-index: 1; min-width: 0; }
  #header .brand {
    font-family: "Georgia", "Songti SC", serif; font-size: 24px; font-style: italic; letter-spacing: 3px; color: #e599a9; font-weight: 500; line-height: 1.2; text-transform: uppercase;
    text-shadow: 0 0 10px rgba(229, 153, 169, 0.8), 0 0 20px rgba(229, 153, 169, 0.4);
  }
  #header .sub { font-size: 11px; color: rgba(255, 255, 255, 0.7); letter-spacing: 1px; margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .status-badge { background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.25); padding: 1px 7px; border-radius: 5px; font-size: 10px; color: #ffffff; display: inline-flex; align-items: center; gap: 4px; }
  #model-select { font-size: 10px; color: #fff; background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 5px; padding: 1px 4px; max-width: 140px; outline: none; }
  #model-select option { color: #000; }
  .model-select-wrap { display: inline-flex; align-items: center; gap: 4px; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #84cc9a; display: inline-block; box-shadow: 0 0 6px #84cc9a; }
  .status-dot.low { background: #c3a1ad; box-shadow: 0 0 6px #c3a1ad; }
  
  .header-signature-wrap { position: relative; z-index: 1; margin-left: auto; display: inline-flex; align-items: center; cursor: pointer; }
  .sig-star { position: absolute; pointer-events: none; user-select: none; color: #ffffff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.9); }
  .sig-star.s-1 { top: -4px; left: -10px; font-size: 8px; animation: star-pulse 2.5s infinite ease-in-out; }
  .sig-star.s-2 { bottom: -4px; right: -10px; font-size: 10px; animation: star-pulse 1.8s infinite ease-in-out; }
  .header-signature { font-family: "Dancing Script", cursive; font-size: 22px; color: rgba(255, 255, 255, 0.92); text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); user-select: none; }

  /* ---- 聊天气泡区域 ---- */
  #messages {
    position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 18px 20px;
    display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch;
  }
  .msg-row { display: flex; align-items: flex-start; gap: 10px; max-width: 84%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.charon { align-self: flex-start; }
  .msg-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .msg-col { display: flex; flex-direction: column; min-width: 0; }
  .msg-row.user .msg-col { align-items: flex-end; }
  .msg-row.charon .msg-col { align-items: flex-start; }
  .msg-time { font-size: 10px; color: #b08d98; margin: 4px 4px 0; }
  .msg-time-row { display: flex; align-items: center; gap: 4px; }

  /* 半调网点气泡 */
  .bubble {
    position: relative; padding: 11px 16px; line-height: 1.6; font-size: 14.5px; word-wrap: break-word; white-space: pre-wrap;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: pointer;
  }
  .bubble.user {
    background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 15%, transparent 15.5%), radial-gradient(circle, rgba(255, 255, 255, 0.16) 15%, transparent 15.5%), linear-gradient(135deg, #f3b0c3, #e593a4);
    background-size: 6px 6px, 6px 6px, 100% 100%; background-position: 0 0, 3px 3px, 0 0;
    color: #ffffff; border-radius: 18px 4px 18px 18px; box-shadow: 0 4px 15px rgba(184, 96, 118, 0.18);
  }
  .bubble.charon {
    background: radial-gradient(circle, rgba(229, 153, 171, 0.08) 15%, transparent 15.5%), radial-gradient(circle, rgba(229, 153, 171, 0.08) 15%, transparent 15.5%), rgba(255, 255, 255, 0.7);
    background-size: 6px 6px, 6px 6px, 100% 100%; background-position: 0 0, 3px 3px, 0 0;
    border: none; color: #6b5460; border-radius: 4px 18px 18px 18px; box-shadow: 0 4px 15px rgba(184, 118, 138, 0.05);
  }
  .bubble.pending { opacity: 0.5; }

  /* 图片、表情与转账气泡扩展样式 */
  .bubble.image-bubble {
    padding: 6px; border-radius: 16px; overflow: hidden; background: rgba(255, 255, 255, 0.85);
  }
  .bubble-img {
    display: block; max-width: 240px; max-height: 260px; border-radius: 12px; object-fit: cover; cursor: zoom-in;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.2s ease;
  }
  .bubble-img:hover { transform: scale(1.02); }
  .bubble-img-caption { padding: 6px 8px 3px; font-size: 13px; color: #5a4550; }

  .bubble.sticker-bubble {
    background: transparent !important; box-shadow: none !important; padding: 4px;
  }
  .bubble-sticker {
    max-width: 130px; max-height: 130px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(184, 118, 138, 0.15));
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .bubble-sticker:hover { transform: scale(1.1); }

  /* 恋爱专属转账卡片 (心意币) */
  .transfer-card {
    width: 230px; border-radius: 18px; overflow: hidden; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff9bb0 0%, #ff6b8b 100%);
    box-shadow: 0 6px 20px rgba(255, 107, 139, 0.25);
    border: 1.5px solid rgba(255, 255, 255, 0.7);
    padding: 14px 16px; position: relative;
  }
  .transfer-card::after {
    content: '🪙'; position: absolute; right: 12px; bottom: 8px; font-size: 42px; opacity: 0.18; pointer-events: none;
  }
  .transfer-card-header { display: flex; align-items: center; gap: 8px; font-size: 12px; opacity: 0.92; margin-bottom: 8px; }
  .transfer-card-amount { font-family: "Georgia", serif; font-size: 24px; font-weight: bold; letter-spacing: 1px; margin-bottom: 6px; }
  .transfer-card-amount span { font-size: 13px; font-weight: normal; margin-left: 4px; }
  .transfer-card-msg { font-size: 12.5px; opacity: 0.95; line-height: 1.4; border-top: 1px dashed rgba(255,255,255,0.4); padding-top: 8px; }

  /* 打字指示器 */
  .typing-dots { display: inline-flex; align-items: center; gap: 4px; padding: 2px 0; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.4;
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 0.9; }
  }

  /* 行内编辑模式 */
  .bubble.editing-bubble { -webkit-user-select: text; user-select: text; cursor: text; outline: 2px dashed rgba(255, 255, 255, 0.65); outline-offset: 2px; }
  .edit-action-bar { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .edit-action-btn { border: none; border-radius: 12px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .edit-action-btn.cancel { background: rgba(107, 84, 96, 0.12); color: #6b5460; }
  .edit-action-btn.send { background: linear-gradient(135deg, #f3b0c3, #e593a4); color: #fff; }

  /* ---- 输入区 ---- */
  #input-bar {
    display: flex; align-items: flex-end; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255, 255, 255, 0.2); flex-shrink: 0; position: relative; z-index: 10;
  }
  #input-bar::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to right, #ffffff 0%, #ffffff 11%, #c0b8c0 33%, #000000 45%, #000000 55%, #c0b8c0 67%, #ffffff 89%, #ffffff 100%);
    -webkit-mask-image: radial-gradient(circle, #000 24%, transparent 24.5%), radial-gradient(circle, #000 24%, transparent 24.5%);
    -webkit-mask-size: 22px 22px; -webkit-mask-position: 0 0, 11px 11px; pointer-events: none; z-index: 0; opacity: 0.85;
  }
  .input-tools { display: flex; gap: 6px; align-items: center; position: relative; z-index: 1; margin-bottom: 2px; }
  #input-bar textarea {
    position: relative; z-index: 1; flex: 1; resize: none; border-radius: 18px; border: 1.5px solid rgba(255, 255, 255, 0.6);
    background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #5a4550; padding: 10px 14px; font-size: 14.5px; font-family: inherit; max-height: 100px; outline: none;
    transition: background 0.2s ease, border-color 0.2s ease; box-shadow: 0 4px 12px rgba(184, 118, 138, 0.05); line-height: 1.4;
  }
  #input-bar textarea:focus { background: rgba(255, 255, 255, 0.95); border-color: rgba(229, 153, 169, 0.8); }

  /* ---- 表情包悬浮选择盘 ---- */
  #sticker-drawer {
    display: none; position: absolute; bottom: calc(100% + 8px); left: 16px; right: 16px; max-height: 240px;
    background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border-radius: 20px; box-shadow: 0 12px 35px rgba(184, 118, 138, 0.2); border: 1px solid rgba(255,255,255,0.9);
    padding: 12px; z-index: 100; flex-direction: column; gap: 10px;
  }
  #sticker-drawer.open { display: flex; animation: modal-fade 0.2s ease; }
  .sticker-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 10px; overflow-y: auto; max-height: 180px; padding: 4px;
  }
  .sticker-item-wrap { position: relative; display: flex; align-items: center; justify-content: center; height: 62px; }
  .sticker-item-img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: pointer; transition: transform 0.15s; }
  .sticker-item-img:hover { transform: scale(1.15); }
  .sticker-del-tag {
    position: absolute; top: -4px; right: -4px; background: rgba(0,0,0,0.5); color: #fff; width: 16px; height: 16px;
    border-radius: 50%; font-size: 10px; display: none; align-items: center; justify-content: center; cursor: pointer;
  }
  .sticker-item-wrap:hover .sticker-del-tag { display: flex; }
  .sticker-bar-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(184, 118, 138, 0.15); padding-top: 6px; }
  .sticker-upload-btn { font-size: 11px; color: #ff5e84; background: none; border: 1px dashed #ff5e84; border-radius: 8px; padding: 4px 10px; cursor: pointer; }

  /* ---- 右侧手账面板 (DESK) ---- */
  #panel {
    width: 260px; flex-shrink: 0; display: flex; flex-direction: column;
    padding: 22px 18px; background: rgba(255, 235, 240, 0.55); border-radius: 24px; position: relative; overflow: hidden;
    box-shadow: 0 8px 32px rgba(184, 118, 138, 0.08);
  }
  #panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(to bottom, #ffeef1 0%, #ffeef1 20%, #ffffff 35%, #ffffff 65%, #ffeef1 80%, #ffeef1 100%);
    -webkit-mask-image: radial-gradient(circle, #000 15%, transparent 15.5%), radial-gradient(circle, #000 15%, transparent 15.5%);
    -webkit-mask-size: 14px 14px; -webkit-mask-position: 0 0, 7px 7px; pointer-events: none; z-index: 0; opacity: 0.85;
  }
  .panel-child { position: relative; z-index: 1; }
  .panel-title {
    font-family: "Georgia", "Songti SC", serif; font-size: 15px; letter-spacing: 3px; color: #a66275; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; text-shadow: 0 2px 4px rgba(255,255,255,0.8);
  }

  /* 便签卡片 */
  .sticky-note-stack { position: relative; width: 100%; display: flex; flex-direction: column; margin-top: 15px; margin-bottom: 18px; z-index: 1; }
  .sticky-note-card {
    position: relative; border: none; border-radius: 3px 14px 14px 14px; padding: 12px 11px; width: 88%;
    aspect-ratio: 1 / 0.572; box-shadow: 0 8px 20px rgba(120, 80, 95, 0.18), 0 2px 5px rgba(120, 80, 95, 0.1);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); -webkit-user-select: none; user-select: none; cursor: pointer; flex-shrink: 0;
  }
  .sticky-note-card:hover { transform: rotate(0deg) translateY(-4px) scale(1.03) !important; z-index: 100 !important; }
  .sticky-note-text { font-size: 12.5px; line-height: 1.42; font-family: "Songti SC", serif; word-wrap: break-word; }
  .note-star-btn {
    position: absolute; bottom: 8px; right: 12px; background: none; border: none; font-size: 20px; cursor: pointer;
    opacity: 0.5; color: #e5a4b5; padding: 4px; line-height: 1;
  }
  .note-star-btn.active { opacity: 1; color: #ff8fa3 !important; }

  /* 抽屉按钮 */
  .drawer-wrapper { display: flex; flex-direction: column; gap: 12px; margin-top: auto; padding-top: 10px; }
  .drawer-btn {
    background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255,255,255,1); border-radius: 12px; 
    padding: 14px 10px; text-align: center; cursor: pointer; position: relative; transition: all 0.25s;
    color: #a66275; font-family: "Georgia", serif; box-shadow: 0 4px 15px rgba(184, 118, 138, 0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .drawer-btn-title { font-weight: bold; font-size: 13px; letter-spacing: 1px; }
  .drawer-btn-count { font-size: 10px; opacity: 0.75; font-family: "Courier New", monospace; }
  .drawer-btn:hover { background: #ffffff; transform: translateY(-2px); }
  .drawer-btn.layer-full { background: #fff5f6; border-color: rgba(255,94,132,0.6); }

  /* ==========================================================================
     核心响应式状态机隔离 (消灭移动端与桌面端互相干扰的排版Bug)
     ========================================================================== */
  
  /* 1. 桌面端模式 (>768px) */
  @media (min-width: 769px) {
    #bottom-tabs { display: none !important; }

    #app.view-chat #main { display: flex; }
    #app.view-chat #panel { display: flex; }
    #app.view-chat #moments-wrapper { display: none; }

    /* 朋友圈模式：左导航 + 宽幅朋友圈 + 隐藏右侧 */
    #app.view-moments #main { display: none; }
    #app.view-moments #panel { display: none; }
    #app.view-moments #moments-wrapper { display: flex; }

    /* 便签桌模式：大屏默认便签在右侧，若切换到desk也可居中显示 */
    #app.view-desk #main { display: flex; }
    #app.view-desk #panel { display: flex; }
    #app.view-desk #moments-wrapper { display: none; }
  }

  /* 2. 移动端模式 (<=768px) */
  @media (max-width: 768px) {
    #app {
      padding: 8px 8px calc(62px + env(safe-area-inset-bottom)) 8px !important;
      display: block !important;
      overflow: hidden !important;
    }
    #nav { display: none !important; }
    #main, #panel, #moments-wrapper {
      display: none !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;

    #app.view-moments #moments-wrapper { display: flex !important; }
    #app.view-desk #panel { display: flex !important; }

    /* 移动端底部切换栏 */
    #bottom-tabs {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(56px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);

  /* ---- 悬浮菜单 & 弹窗通用 ---- */
  #bubble-menu {
    display: none; position: absolute; z-index: 1000; background: rgba(26, 18, 30, 0.95);

  .letter-container {

  .letter-content-area { padding: 18px; overflow-y: auto; flex: 1; font-size: 14.5px; color: #4a3742; line-height: 1.8; }
  .single-letter { margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(0,0,0,0.04); }

  /* 个人资料设置卡片 */
  .profile-section { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px dashed rgba(229,153,169,0.25); }

  .avatar-change-hint {

    border: 1px solid rgba(229,153,169,0.3); border-radius: 8px; padding: 6px 10px; font-size: 13px; outline: none; background: rgba(255,255,255,0.8);
  }

  /* 日历系统 */
  .calendar-box { background: #fffdfd; border-radius: 20px; width: 100%; max-width: 420px; padding: 20px; border: 2px solid #000; }
  .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-family: "Georgia", serif; }

  .calendar-day.period-active { background: #ffb3c1; color: #fff; font-weight: bold; }

  /* 图片预览灯箱 */
  #lightbox-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.88); z-index: 3000; align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox-modal img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
</style>

<script>
const CODE = {{ code_param | tojson }};
let AVATAR_CHARON = {{ avatar_charon | tojson }};
let AVATAR_USER = {{ avatar_user | tojson }};
let USER_NICKNAME = "Seraphina";
let CHARON_NICKNAME = "Charon";

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusLabel = document.getElementById('status-label');
const contextMenu = document.getElementById('bubble-menu');

let currentReplyTargets = {};
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let periodRecords = [];
let currentActiveRowEl = null;

function apiUrl(path) {
  const sep = path.includes('?') ? '&' : '?';
  return CODE ? `${path}${sep}code=${encodeURIComponent(CODE)}` : path;
}

function formatTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return '';
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function addDoubleTapListener(element, callback) {
  let lastTap = 0;
  element.addEventListener('click', function(e) {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    if (tapLength < 300 && tapLength > 0) {
      e.preventDefault();
      callback(e);
    }
    lastTap = currentTime;
  });
}

// 渲染聊天气泡（完美支持 text / image / sticker / transfer）
function renderMsgRow(role, content, createdAt, pending, msgId, model, isFailed, msgType = 'text', extra = null) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'charon');
  if (msgId) row.dataset.msgId = msgId;
  if (createdAt) row.dataset.createdAt = createdAt;
  if (model) row.dataset.model = model;
  if (isFailed) row.dataset.failed = '1';

  const avatarWrap = document.createElement('div');
  avatarWrap.className = 'avatar-wrapper ' + (role === 'user' ? 'user' : 'charon');
  const tag = document.createElement('span');
  tag.className = 'avatar-tag';
  tag.textContent = role === 'user' ? USER_NICKNAME : CHARON_NICKNAME;
  avatarWrap.appendChild(tag);

  const avatar = document.createElement('img');
  avatar.className = 'msg-avatar';
  avatar.src = role === 'user' ? AVATAR_USER : AVATAR_CHARON;
  avatarWrap.appendChild(avatar);

  const star = document.createElement('span'); star.className = 'star-accent'; star.textContent = '✦'; avatarWrap.appendChild(star);
  const d1 = document.createElement('span'); d1.className = 'dust-star d-1'; d1.textContent = '✦'; avatarWrap.appendChild(d1);
  const d2 = document.createElement('span'); d2.className = 'dust-star d-2'; d2.textContent = '✦'; avatarWrap.appendChild(d2);
  row.appendChild(avatarWrap);

  const col = document.createElement('div');
  col.className = 'msg-col';

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'charon') + (pending ? ' pending' : '');

  // 1. 转账卡片
  if (msgType === 'transfer') {
    const amt = extra && extra.amount ? extra.amount : '心意';
    const msg = (extra && extra.message) ? extra.message : (content || '心意转账');
    bubble.className = 'transfer-card';
    bubble.innerHTML = `
      <div class="transfer-card-header"><span>♥</span> 恋爱专属心意转账</div>
      <div class="transfer-card-amount">${amt} <span>心意币</span></div>
      <div class="transfer-card-msg">${escapeHtml(msg)}</div>
    `;
  }
  // 2. 表情包
  else if (msgType === 'sticker') {
    bubble.classList.add('sticker-bubble');
    const imgUrl = (extra && extra.image_url) ? extra.image_url : content;
    bubble.innerHTML = `<img class="bubble-sticker" src="${imgUrl}" alt="表情包">`;
  }
  // 3. 图片消息
  else if (msgType === 'image') {
    bubble.classList.add('image-bubble');
    const imgUrl = (extra && extra.image_url) ? extra.image_url : content;
    let captionHtml = (content && content !== '[图片]') ? `<div class="bubble-img-caption">${escapeHtml(content)}</div>` : '';
    bubble.innerHTML = `<img class="bubble-img" src="${imgUrl}" onclick="openLightbox('${imgUrl}')">${captionHtml}`;
  }
  // 4. 普通文字
  else {
    if (pending && !content) {
      bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
    } else {
      bubble.textContent = content;
    }
  }

  col.appendChild(bubble);

  if (role !== 'user' && model) {
    const modelTagEl = document.createElement('div');
    modelTagEl.className = 'model-tag';
    modelTagEl.textContent = model;
    col.appendChild(modelTagEl);
  }

  const timeRow = document.createElement('div');
  timeRow.className = 'msg-time-row';
  const timeEl = document.createElement('span');
  timeEl.className = 'msg-time';
  timeEl.textContent = formatTime(createdAt);
  timeRow.appendChild(timeEl);
  col.appendChild(timeRow);
  row.appendChild(col);

  addDoubleTapListener(bubble, (e) => {
    if (row.classList.contains('editing')) return;
    currentActiveRowEl = row;
    showContextMenu(bubble, msgId, role, content, model, isFailed);
  });

  return row;
}

function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox-modal').style.display = 'flex';
}

// 统一历史记录加载
async function loadHistory() {
  try {
    const res = await fetch(apiUrl('/api/chat-messages'));
    const data = await res.json();
    messagesEl.innerHTML = '';
    if (!data.ok || !data.messages || data.messages.length === 0) {
      messagesEl.innerHTML = '<div id="empty-hint">还没有聊过，说点什么吧…</div>';
      return;
    }
    data.messages.forEach(m => {
      messagesEl.appendChild(renderMsgRow(m.role, m.content, m.created_at, false, m.id, m.model, false, m.msg_type || 'text', m.extra));
    });
    scrollToBottom();
  } catch (e) {
    messagesEl.innerHTML = '<div id="empty-hint">网络错误，消息加载失败</div>';
  }
}

function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

// 发送文字消息
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = ''; inputEl.style.height = 'auto'; sendBtn.disabled = true;
  await sendChatPayload({ message: text });
  sendBtn.disabled = false;
}

// 通用发送调度（对接 SSE 流式接口，兼容 text / image / sticker / transfer）
async function sendChatPayload(bodyData) {
  const nowIso = new Date().toISOString();
  const msgType = bodyData.msg_type || 'text';
  const displayContent = bodyData.message || (msgType === 'image' ? '[图片]' : (msgType === 'sticker' ? '[表情]' : '[转账]'));

  const userRow = renderMsgRow('user', displayContent, nowIso, false, null, null, false, msgType, bodyData);
  messagesEl.appendChild(userRow);

  const pendingRow = renderMsgRow('charon', '', nowIso, true);
  messagesEl.appendChild(pendingRow);
  scrollToBottom();

  const pendingBubble = pendingRow.querySelector('.bubble');

  try {
    const res = await fetch(apiUrl('/api/chat-send'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyData)
    });
    if (!res.ok || !res.body) throw new Error('网络请求异常');

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let sawDone = false;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data: ')) continue;
        const jsonStr = line.slice('data: '.length);
        let evt;
        try { evt = JSON.parse(jsonStr); } catch (e) { continue; }

        if (evt.delta) {
          pendingBubble.textContent += evt.delta;
          scrollToBottom();
        } else if (evt.done) {
          sawDone = true;
          if (evt.reply) {
            pendingRow.replaceWith(renderMsgRow('charon', evt.reply, nowIso, false, evt.charon_msg_id, evt.model));
          } else {
            pendingRow.replaceWith(renderMsgRow('charon', '（没能回复：模型调用失败）', nowIso, false, null, null, true));
          }
        }
      }
    }
    if (!sawDone) {
      const partial = pendingBubble.textContent;
      pendingRow.replaceWith(renderMsgRow('charon', partial || '（连接中断）', nowIso, false, null, null, true));
    }
  } catch (e) {
    pendingRow.replaceWith(renderMsgRow('charon', '（网络异常，未能发送出去）', nowIso, false, null, null, true));
  }
  scrollToBottom();
  loadStatus();
}

// 1. 发送图片处理
async function handleChatImageUpload(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  const formData = new FormData();
  formData.append('file', file);

  const notice = renderMsgRow('user', '正在上传图片...', new Date().toISOString(), true);
  messagesEl.appendChild(notice);
  scrollToBottom();

  try {
    const res = await fetch(apiUrl('/api/chat-upload-image'), { method: 'POST', body: formData });
    const data = await res.json();
    notice.remove();
    if (data.ok && data.image_url) {
      await sendChatPayload({ msg_type: 'image', image_url: data.image_url, message: '' });
    } else {
      alert('图片上传失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    notice.remove();
    alert('网络错误，图片上传失败');
  }
  input.value = '';
}

    if (data.ok && data.stickers) {
      data.stickers.forEach(s => {
        const item = document.createElement('div');
        item.className = 'sticker-item-wrap';
        item.innerHTML = `
          <img class="sticker-item-img" src="${s.image_url}">
          <span class="sticker-del-tag" onclick="event.stopPropagation(); deleteSticker('${s.id}')">×</span>

          document.getElementById('sticker-drawer').classList.remove('open');
          sendChatPayload({ msg_type: 'sticker', sticker_id: s.id, image_url: s.image_url });
        };
        grid.appendChild(item);
      });

async function handleAvatarUpload(userId, input) {
  if (!input.files || !input.files[0]) return;
  const formData = new FormData();
  formData.append('file', input.files[0]);
  formData.append('user_id', userId);

  try {
    const res = await fetch(apiUrl('/api/profile/avatar'), { method: 'POST', body: formData });
    const data = await res.json();
    if (data.ok && data.profile) {
      alert('头像更换成功！');
      if (userId === 'user') {
        AVATAR_USER = data.profile.avatar_url;
        document.getElementById('profile-avatar-user').src = AVATAR_USER;
      } else {
        AVATAR_CHARON = data.profile.avatar_url;
        document.getElementById('profile-avatar-charon').src = AVATAR_CHARON;
        document.getElementById('header-avatar').src = AVATAR_CHARON;
      }
    }
  } catch (e) { alert('网络错误'); }
  input.value = '';
}

async function saveChatBackground() {
  const bg = document.getElementById('profile-bg-input').value.trim();
  try {
    const res = await fetch(apiUrl('/api/profile/update'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: 'user', chat_background: bg })
    });
    const data = await res.json();
    if (data.ok) {
      alert('聊天背景已保存并应用！');
      applyChatBackground(bg);
      closeProfileModal();
    }
  } catch(e) { alert('网络错误'); }
}

function applyChatBackground(bg) {
  const main = document.getElementById('main');
  if (!bg) { main.style.backgroundImage = ''; return; }
  if (bg.startsWith('http') || bg.startsWith('/')) {
    main.style.backgroundImage = `url("${bg}")`;
  } else {
    main.style.background = bg;
  }
}

// 统一控制双端路由：通过纯净的 CSS Class 控制，彻底告别 style.display 污染
function switchTab(tabName) {
  const appEl = document.getElementById('app');
  appEl.className = 'view-' + tabName;

  document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
  document.querySelectorAll('#nav .nav-icon').forEach(icon => icon.classList.remove('active'));

  const tabMap = { 'chat': 0, 'moments': 1, 'desk': 2 };
  const bottomTabs = document.querySelectorAll('.tab-item');
  if (bottomTabs[tabMap[tabName]]) bottomTabs[tabMap[tabName]].classList.add('active');

  const navIcons = document.querySelectorAll('#nav .nav-icon');
  if (navIcons[tabMap[tabName]]) navIcons[tabMap[tabName]].classList.add('active');

  if (tabName === 'moments') fetchMoments();
  if (tabName === 'chat') scrollToBottom();
}

// 朋友圈数据拉取（新→旧已在后端排好，直接顺序渲染）
async function fetchMoments() {
  const feed = document.getElementById('moments-feed');
  feed.innerHTML = '<div style="text-align:center; color:#b08d98; margin-top:80px;">正在加载朋友圈...</div>';
  try {
    const res = await fetch(apiUrl('/api/moments'));
    const data = await res.json();
    if (data.ok) renderMoments(data.moments);
  } catch(e) {
    feed.innerHTML = '<div style="text-align:center; color:#b08d98; margin-top:80px;">网络错误</div>';
  }
}

function renderMoments(moments) {
  const feed = document.getElementById('moments-feed');
  feed.innerHTML = '';

  const coverSection = document.createElement('div');
  coverSection.className = 'moments-cover-section';
  coverSection.innerHTML = `
    <div class="cover-branding-text">
      <h1>MOMENTS</h1>
      <p>私密双人朋友圈 · Time stands still when with you.</p>
    </div>
    <div class="moments-user-profile">
      <div class="profile-name-label">${escapeHtml(USER_NICKNAME)}</div>
      <div class="moments-avatar-polaroid">
        <img src="${AVATAR_USER}">
      </div>
    </div>
  `;
  feed.appendChild(coverSection);

  if (!moments || moments.length === 0) {
    const emptyHint = document.createElement('div');
    emptyHint.style.cssText = 'text-align:center; color:#b08d98; padding: 40px 24px;';
    emptyHint.textContent = '空间空空的，发条动态记录此刻吧。';
    feed.appendChild(emptyHint);
    return;
  }

  moments.forEach((m) => {
    const isUser = m.author === 'user';
    const authorName = isUser ? USER_NICKNAME : CHARON_NICKNAME;
    const avatar = isUser ? AVATAR_USER : AVATAR_CHARON;
    const isLikedByUser = m.likes && m.likes.includes('user');

    let likesHtml = (m.likes && m.likes.length > 0) ? `<div class="moment-likes">♥ 觉得很赞</div>` : '';
    let commentsHtml = '';
    if (m.comments && m.comments.length > 0) {
      commentsHtml = `<div class="moment-comments">`;
      m.comments.forEach((c, idx) => {
        const cName = c.author === 'user' ? USER_NICKNAME : CHARON_NICKNAME;
        commentsHtml += `
          <div class="comment-item">
            <span><span class="comment-author">${cName}:</span>${escapeHtml(c.content)}</span>
            ${c.author === 'user' ? `<span style="cursor:pointer; color:#c08ea3;" onclick="deleteComment('${m.id}', ${idx})">×</span>` : ''}
          </div>
        `;
      });
      commentsHtml += `</div>`;
    }

    const card = document.createElement('div');
    card.className = 'moment-card-container';
    card.innerHTML = `
      <div class="moment-card">
        <div class="moment-retro-stamp">POSTED BY ${isUser ? 'SERAPHINA' : 'CHARON'}</div>
        <div class="moment-header">
          <div class="avatar-wrapper ${isUser ? 'user' : 'charon'}" style="width:36px; height:36px;">
            <img class="msg-avatar" src="${avatar}">
          </div>
          <div style="margin-left: 6px;">
            <div class="moment-author">${authorName}</div>
            <div class="moment-time">${formatTime(m.created_at)} ${isUser ? `<span style="cursor:pointer; color:#c08ea3; margin-left:6px;" onclick="deleteMoment('${m.id}')">删除</span>` : ''}</div>
          </div>
        </div>
        <div class="moment-content">${escapeHtml(m.content)}</div>
        <div class="moment-actions">
          <button class="action-btn ${isLikedByUser ? 'liked' : ''}" onclick="toggleLike('${m.id}')">♥ ${isLikedByUser ? '已赞' : '点赞'}</button>
          <button class="action-btn" onclick="toggleCommentBox('${m.id}')">💬 评论</button>
        </div>
        ${likesHtml}
        ${commentsHtml}
        <div class="comment-input-area" id="comment-box-${m.id}">
          <input type="text" class="comment-input" placeholder="写下温和的评论..." id="comment-input-${m.id}">
          <button class="edit-action-btn send" onclick="submitComment('${m.id}')">发送</button>
        </div>
      </div>
    `;
    feed.appendChild(card);
  });
}

function toggleCommentBox(id) {
  document.getElementById(`comment-box-${id}`).classList.toggle('active');
}

async function submitComment(id) {
  const input = document.getElementById(`comment-input-${id}`);
  const text = input.value.trim();
  if (!text) return;
  try {
    const res = await fetch(apiUrl('/api/moments/comment'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, content: text })
    });
    const d = await res.json();
    if (d.ok) fetchMoments();
  } catch(e) {}
}

async function deleteComment(id, commentIndex) {
  if (!confirm('删除这条评论？')) return;
  try {
    const res = await fetch(apiUrl('/api/moments/comment/delete'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, comment_index: commentIndex })
    });
    const d = await res.json();
    if (d.ok) fetchMoments();
  } catch(e) {}
}

async function toggleLike(id) {
  try {
    const res = await fetch(apiUrl('/api/moments/like'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    });
    const d = await res.json();
    if (d.ok) fetchMoments();
  } catch(e) {}
}

async function submitMoment() {
  const text = document.getElementById('moment-input-textarea').value.trim();
  if (!text) return;
  try {
    const res = await fetch(apiUrl('/api/moments'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: text })
    });
    const d = await res.json();
    if (d.ok) { closePublishModal(); fetchMoments(); }
  } catch(e) {}
}

async function deleteMoment(id) {
  if (!confirm('确定删除该动态？')) return;
  try {
    const res = await fetch(apiUrl('/api/moments/delete'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    });
    const d = await res.json();
    if (d.ok) fetchMoments();
  } catch(e) {}
}

function openPublishModal() { document.getElementById('publish-modal').style.display = 'flex'; }
function closePublishModal() { document.getElementById('publish-modal').style.display = 'none'; }

// Desk 便签状态及抽屉逻辑
async function loadStatus() {
  try {
    const res = await fetch(apiUrl('/api/chat-status'));
    const data = await res.json();
    if (!data.ok) return;

    statusLabel.textContent = data.status_label || '在线';
    document.getElementById('status-dot').className = 'status-dot' + (data.mood_score < 50 ? ' low' : '');

    const container = document.getElementById('sticky-container');
    container.innerHTML = '';
    if (data.sticky_notes && data.sticky_notes.length > 0) {
      data.sticky_notes.forEach((note, index) => {
        const card = document.createElement('div');
        card.className = 'sticky-note-card';
        card.style.transform = `rotate(${((note.id % 10) - 5)}deg)`;
        card.style.margin = index === 0 ? '0 auto' : '-27px auto 0';
        card.style.background = '#ffe3e7';
        card.innerHTML = `
          <div class="sticky-note-text">${escapeHtml(note.message)}</div>
          <button class="note-star-btn ${note.is_starred ? 'active' : ''}" onclick="starNote(${note.id}, ${note.is_starred}, this)">★</button>
        `;
        container.appendChild(card);
      });
    }

    fetch(apiUrl('/api/sticky-notes?status=drawer')).then(r=>r.json()).then(d => {
      if(d.ok) document.getElementById('notes-drawer-count').textContent = `${d.notes.length}/30`;
    });
    fetch(apiUrl('/api/love-letters?status=drawer')).then(r=>r.json()).then(d => {
      if(d.ok) document.getElementById('letters-drawer-count').textContent = `${d.letters.length}/20`;
    });
  } catch(e) {}
}

async function starNote(id, currentStarred, btn) {
  const next = !currentStarred;
  try {
    await fetch(apiUrl('/api/sticky-notes/star'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, is_starred: next })
    });
    btn.classList.toggle('active', next);
  } catch(e) {}
}

function openDrawerNotes() { document.getElementById('drawer-notes-modal').style.display = 'flex'; }
function closeDrawerNotes() { document.getElementById('drawer-notes-modal').style.display = 'none'; }
function openLoveLetters() { document.getElementById('letter-modal').style.display = 'flex'; }
function closeLoveLetters() { document.getElementById('letter-modal').style.display = 'none'; }
function openArchiveBox() { document.getElementById('archive-modal').style.display = 'flex'; }
function closeArchiveBox() { document.getElementById('archive-modal').style.display = 'none'; }
function openPersonaEditor() { document.getElementById('persona-modal').style.display = 'flex'; }
function closePersonaEditor() { document.getElementById('persona-modal').style.display = 'none'; }
function openPeriodCalendar() { document.getElementById('calendar-modal').style.display = 'flex'; renderCalendarGrid(); }
function closePeriodCalendar() { document.getElementById('calendar-modal').style.display = 'none'; }

function renderCalendarGrid() {
  const grid = document.getElementById('calendar-days-grid');
  document.getElementById('calendar-month-year').textContent = `${currentYear}年${currentMonth + 1}月`;
  grid.innerHTML = '';
  const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
  for (let d = 1; d <= totalDays; d++) {
    const span = document.createElement('span');
    span.className = 'calendar-day';
    span.textContent = d;
    grid.appendChild(span);
  }
}
function prevMonth() { currentMonth--; renderCalendarGrid(); }
function nextMonth() { currentMonth++; renderCalendarGrid(); }

// 模型选择器
async function loadModelSelector() {
  try {
    const res = await fetch(apiUrl('/api/chat-model'));
    const data = await res.json();
    if (!data.ok) return;
    const select = document.getElementById('model-select');
    select.innerHTML = '';
    data.available_models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      if (m === data.current_model) opt.selected = true;
      select.appendChild(opt);
    });
  } catch(e) {}
}

document.getElementById('model-select').addEventListener('change', async (e) => {
  await fetch(apiUrl('/api/chat-model'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: e.target.value })
  });
});

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

// 初始化启动
loadHistory();
loadStatus();
loadModelSelector();
</script>
