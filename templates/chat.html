<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Charon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    /* 网格径向渐变，调浅调亮为晨曦迷雾般的柔和马卡龙粉 */
    background: radial-gradient(circle at 10% 20%, #fffcfd 0%, #fbf3f5 35%, #f3e2e6 70%, #ebd3d9 100%);
    background-attachment: fixed;
    font-family: "Songti SC", "STSong", Georgia, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    color: #5a4550; /* 恢复至初始雅致深紫灰 */
  }
  #app {
    display: flex;
    height: 100vh; height: 100dvh;
    padding: 14px;
    gap: 14px;
    position: relative;
    z-index: 2;
  }

  /* ---- 左侧波点玻璃舱导航栏 ---- */
  #nav {
    width: 60px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 24px 0;
    background: rgba(255, 238, 241, 0.6); /* 马卡龙蜜桃粉色底色 */
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px 0 rgba(184, 118, 138, 0.08);
  }
  /* 纯 CSS 垂直多色渐变遮罩波点 - 放大到 22px 并且调整色比 */
  #nav::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    /* 垂直黑-灰-白-灰-黑渐变 (比例 2:1:3:2:2) */
    background: linear-gradient(to bottom, #000000 0%, #000000 20%, #c0b8c0 30%, #ffffff 40%, #ffffff 60%, #c0b8c0 80%, #000000 100%);
    -webkit-mask-image: 
      radial-gradient(circle, #000 24%, transparent 24.5%), /* 挤密和放大波点 */
      radial-gradient(circle, #000 24%, transparent 24.5%);
    -webkit-mask-size: 22px 22px; 
    -webkit-mask-position: 0 0, 11px 11px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.85;
  }
  .nav-icon {
    position: relative;
    z-index: 1; /* 确保不被波点底层遮挡，保持可点 */
    width: 42px; height: 42px;
    border-radius: 50%; /* 圆形按钮 */
    display: flex; align-items: center; justify-content: center;
    background: #ffffff; /* 导航按钮底色改成纯白色 */
    color: #ffb3c1; /* 内部图案改成粉色 */
    font-size: 23px; /* 图案放大 */
    text-decoration: none;
    border: 2px solid #000000; /* 高对比度纯黑圆圈线 */
    transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); /* 实体投影 */
  }
  .nav-icon:hover {
    background: rgba(255, 255, 255, 0.8);
    transform: translateY(-2px);
    color: #ffb3c1;
  }
  .nav-icon:active { transform: translateY(0) scale(0.95); }

  /* ---- 中间玻璃舱对话区 ---- */
  #main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(184, 118, 138, 0.10);
    overflow: hidden;
    position: relative;
  }
  /* 聊天室通体淡淡的白色微小波点背景 */
  #main::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%),
      radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%);
    background-size: 10px 10px;
    background-position: 0 0, 5px 5px;
    pointer-events: none;
    z-index: 0;
  }
  
  /* ---- 酷黑渐变 Header ---- */
  #header {
    padding: 20px 24px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    /* 纯黑到粉色(渐变底色拉高)的渐变条，黑、粉渐变比例为 3:2 */
    background: linear-gradient(to right, #000000 0%, #000000 52%, rgba(26, 18, 30, 0.9) 62%, #cf7d90 85%, #ffb3c1 100%);
  }
  /* 增强白色波点颜色对比度并共同往右扩展 (65% 宽度) */
  #header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 65%; /* 伴随黑色渐变一起向右扩展 */
    background-image:
      radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%),
      radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%);
    background-size: 11px 11px; /* 内部波点放大 */
    background-position: 0 0, 5.5px 5.5px;
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
    pointer-events: none;
    z-index: 0;
  }
  
  /* 头像外层容器 - 承载精致星光效果，与左侧栏完全物理隔离 */
  .avatar-wrapper {
    position: relative;
    display: inline-block;
    width: 36px; height: 36px;
    flex-shrink: 0;
  }
  .avatar-wrapper.header-avatar-wrap {
    width: 44px; height: 44px;
  }
  
  /* 统一头像外边圈：全部修改为干净发光的白色外圆环 */
  .avatar-wrapper .msg-avatar,
  .avatar-wrapper #header-avatar {
    border: 1.5px solid #ffffff;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.6); /* 统一白色发光外圈 */
  }
  
  /* 进一步放大的主星芒样式（✦） */
  .avatar-wrapper .star-accent {
    position: absolute;
    font-size: 15px; /* 加大星芒 */
    pointer-events: none;
    user-select: none;
    animation: star-pulse 2s infinite ease-in-out;
  }
  /* Charon（左侧头像）
