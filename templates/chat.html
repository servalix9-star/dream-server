<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Charon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    /* 网格径向渐变，调浅调亮为晨曦迷雾般的柔和马卡龙粉 */
    background: radial-gradient(circle at 10% 20%, #fffcfd 0%, #fbf3f5 35%, #f3e2e6 70%, #ebd3d9 100%);
    background-attachment: fixed;
    font-family: "Songti SC", "STSong", Georgia, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    color: #5a4550; /* 恢复至初始雅致深紫灰 */
  }
  #app {
    display: flex;
    height: 100vh; height: 100dvh;
    padding: 14px;
    gap: 14px;
    position: relative;
    z-index: 2;
  }

  /* ---- 左侧波点玻璃舱导航栏 ---- */
  #nav {
    width: 60px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 24px 0;
    background: rgba(255, 238, 241, 0.6); /* 马卡龙蜜桃粉色底色 */
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px 0 rgba(184, 118, 138, 0.08);
  }
  /* 纯 CSS 垂直多色渐变遮罩波点 - 放大到 22px 并且调整色比 */
  #nav::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    /* 垂直黑-灰-白-灰-黑渐变 (比例 2:1:3:2:2) */
    background: linear-gradient(to bottom, #000000 0%, #000000 20%, #c0b8c0 30%, #ffffff 40%, #ffffff 60%, #c0b8c0 80%, #000000 100%);
    -webkit-mask-image: 
      radial-gradient(circle, #000 24%, transparent 24.5%),
      radial-gradient(circle, #000 24%, transparent 24.5%);
    -webkit-mask-size: 22px 22px; 
    -webkit-mask-position: 0 0, 11px 11px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.85;
  }
  .nav-icon {
    position: relative;
    z-index: 1; 
    width: 42px; height: 42px;
    border-radius: 50%; /* 圆形按钮 */
    display: flex; align-items: center; justify-content: center;
    background: #ffeef1; /* 统一采用温柔的浅粉底色 */
    color: #ffb3c1; /* 内部图案粉色 */
    font-size: 23px; 
    text-decoration: none;
    border: 2px solid #000000; /* 高对比度纯黑圆圈线 */
    transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); 
  }
  .nav-icon:hover {
    background: #ffffff;
    transform: translateY(-2px);
  }
  .nav-icon:active { transform: translateY(0) scale(0.95); }

  /* ---- 中间玻璃舱对话区 ---- */
  #main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(184, 118, 138, 0.10);
    overflow: hidden;
    position: relative;
  }
  /* 聊天室通体淡淡的白色微小波点背景 */
  #main::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%),
      radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%);
    background-size: 10px 10px;
    background-position: 0 0, 5px 5px;
    pointer-events: none;
    z-index: 0;
  }
  
  /* ---- 酷黑渐变 Header ---- */
  #header {
    padding: 20px 24px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    /* 纯黑到粉色的渐变条，黑、粉渐变比例为 3:2 */
    background: linear-gradient(to right, #000000 0%, #000000 52%, rgba(26, 18, 30, 0.9) 62%, #cf7d90 85%, #ffb3c1 100%);
  }
  /* 增强白色波点颜色对比度并共同往右扩展 (65% 宽度) */
  #header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 65%; /* 伴随黑色渐变一起向右扩展 */
    background-image:
      radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%),
      radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%);
    background-size: 11px 11px; /* 内部波点放大 */
    background-position: 0 0, 5.5px 5.5px;
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
    pointer-events: none;
    z-index: 0;
  }
  
  /* 头像外层容器 - 承载精致星光效果，与左侧栏完全物理隔离 */
  .avatar-wrapper {
    position: relative;
    display: inline-block;
    width: 36px; height: 36px;
    flex-shrink: 0;
  }
  .avatar-wrapper.header-avatar-wrap {
    width: 44px; height: 44px;
  }
  
  /* 统一头像外边圈：全部修改为干净发光的白色外圆环 */
  .avatar-wrapper .msg-avatar,
  .avatar-wrapper #header-avatar {
    border: 1.5px solid #ffffff;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.6); /* 统一白色发光外圈 */
  }
  
  /* 进一步放大的主星芒样式（✦） */
  .avatar-wrapper .star-accent {
    position: absolute;
    font-size: 15px; /* 加大星芒 */
    pointer-events: none;
    user-select: none;
    animation: star-pulse 2s infinite ease-in-out;
  }
  /* Charon（左侧头像）：主星悬浮在【左上角】（镜像调换），【纯黑色】星芒并带有极其明显的极夜黑发光霓虹光晕 */
  .avatar-wrapper.charon .star-accent {
    top: -6px;
    left: -6px;
    color: #000000;
    text-shadow: 0 0 4px #000000, 0 0 10px rgba(0, 0, 0, 0.95);
  }
  /* User（右侧头像）：主星悬浮在【右上角】（镜像调换），【粉色】星芒并带有极其明显的蜜桃粉发光霓虹光晕 */
  .avatar-wrapper.user .star-accent {
    top: -6px;
    right: -6px;
    color: #ffb3c1;
    text-shadow: 0 0 4px #ff5e84, 0 0 10px rgba(255, 94, 132, 0.95);
  }
  
  /* 碎星样式（✦） - 适当放大尺寸 */
  .avatar-wrapper .dust-star {
    position: absolute;
    pointer-events: none;
    user-select: none;
    color: #ffffff;
    text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
  }
  /* Charon（左侧头像）：碎星镜像对调，现在点缀在【右下角】和【右侧】 */
  .avatar-wrapper.charon .dust-star.d-1 {
    bottom: -4px;
    right: -4px;
    font-size: 9px; /* 碎星放大 */
    opacity: 0.8;
  }
  .avatar-wrapper.charon .dust-star.d-2 {
    top: 14px;
    right: -7px;
    font-size: 8px; /* 碎星放大 */
    opacity: 0.6;
  }
  /* User（右侧头像）：碎星镜像对调，现在点缀在【左下角】和【左侧】 */
  .avatar-wrapper.user .dust-star.d-1 {
    bottom: -4px;
    left: -4px;
    font-size: 9px;
    opacity: 0.8;
  }
  .avatar-wrapper.user .dust-star.d-2 {
    top: 14px;
    left: -7px;
    font-size: 8px;
    opacity: 0.6;
  }

  /* 星光非常柔和、缓慢的呼吸微动效果 */
  @keyframes star-pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
  }
  
  /* 迷你手写名字挂件 */
  .avatar-tag {
    position: absolute;
    font-family: "Dancing Script", cursive;
    font-size: 11px;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    z-index: 2;
  }
  /* Charon 的名字挂件：悬浮于头像上方 */
  .avatar-wrapper.charon .avatar-tag {
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    color: #5a4550; /* 深紫灰 */
    text-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
  }
  /* Seraphina 的名字挂件：悬浮于头像上方 */
  .avatar-wrapper.user .avatar-tag {
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    color: #cf7d90; /* 暖粉色 */
    text-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
  }

  #header-avatar {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }
  #header-text { 
    position: relative;
    z-index: 1;
    min-width: 0; 
  }
  #header .brand {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 26px;
    font-style: italic;
    letter-spacing: 3px;
    color: #e599a9; /* 玫瑰粉色搭配 */
    font-weight: 500;
    line-height: 1.2;
    text-transform: uppercase;
    /* 注入发光光晕效果 */
    text-shadow: 0 0 10px rgba(229, 153, 169, 0.8), 0 0 20px rgba(229, 153, 169, 0.4);
  }
  #header .sub {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 1px;
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  /* 带有半透明白色背景框的在线状态 */
  .status-badge {
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.25);
    padding: 1px 7px;
    border-radius: 5px;
    font-size: 10px;
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  #model-select {
    margin-left: 6px; font-size: 10px; color: #fff;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 5px; padding: 1px 4px; max-width: 130px;
    outline: none;
  }
  #model-select option { color: #000; }
  .status-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #84cc9a;
    display: inline-block;
    box-shadow: 0 0 6px #84cc9a;
  }
  .status-dot.low { 
    background: #c3a1ad; 
    box-shadow: 0 0 6px #c3a1ad;
  }
  
  /* 顶部右下角签名包裹容器 - 完美隔离星光动效 */
  .header-signature-wrap {
    position: relative;
    z-index: 1;
    margin-left: auto; /* 靠右对齐 */
    display: inline-flex;
    align-items: center;
  }
  /* 签名旁点缀的白色小星芒 */
  .sig-star {
    position: absolute;
    pointer-events: none;
    user-select: none;
    color: #ffffff;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
  }
  .sig-star.s-1 {
    top: -4px;
    left: -10px;
    font-size: 8px;
    animation: star-pulse 2.5s infinite ease-in-out;
  }
  .sig-star.s-2 {
    bottom: -4px;
    right: -10px;
    font-size: 10px;
    animation: star-pulse 1.8s infinite ease-in-out;
  }
  /* 顶部右下角签名感的花体字 - 移除旋转倾斜，保持平直 */
  .header-signature {
    font-family: "Dancing Script", "Brush Script MT", cursive;
    font-size: 22px; /* 签名体 */
    color: rgba(255, 255, 255, 0.92);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    user-select: none;
    pointer-events: none;
  }

  #messages {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .msg-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    max-width: 88%;
  }
  .msg-row.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-row.charon {
    align-self: flex-start;
  }
  .msg-avatar {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }
  .msg-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .msg-row.user .msg-col { align-items: flex-end; }
  .msg-row.charon .msg-col { align-items: flex-start; }
  .msg-time {
    font-size: 10px;
    color: #b08d98;
    margin: 4px 4px 0;
  }
  
  /* 时间戳位置优化 */
  .msg-time-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* 完美的半调波普印刷微缩网点气泡（6px 极致层级呼应） */
  .bubble {
    position: relative;
    padding: 12px 18px;
    line-height: 1.6;
    font-size: 15px;
    word-wrap: break-word;
    white-space: pre-wrap;
    -webkit-user-select: none;
    user-select: none; /* 移动端防干扰长按 */
    -webkit-touch-callout: none;
    cursor: pointer;
  }
  .bubble.user {
    /* 更柔和、透亮的新雪姬粉渐变底色，搭配微型半透明白波点 */
    background: 
      radial-gradient(circle, rgba(255, 255, 255, 0.16) 15%, transparent 15.5%),
      radial-gradient(circle, rgba(255, 255, 255, 0.16) 15%, transparent 15.5%),
      linear-gradient(135deg, #f3b0c3, #e593a4);
    background-size: 6px 6px, 6px 6px, 100% 100%;
    background-position: 0 0, 3px 3px, 0 0;
    color: #ffffff;
    border-radius: 18px 4px 18px 18px; 
    box-shadow: 0 4px 15px rgba(184, 96, 118, 0.18);
  }
  .bubble.charon {
    /* 白透底色叠加上极其精致、浓度极低的微型粉灰小波点 */
    background: 
      radial-gradient(circle, rgba(229, 153, 171, 0.08) 15%, transparent 15.5%),
      radial-gradient(circle, rgba(229, 153, 171, 0.08) 15%, transparent 15.5%),
      rgba(255, 255, 255, 0.55);
    background-size: 6px 6px, 6px 6px, 100% 100%;
    background-position: 0 0, 3px 3px, 0 0;
    border: none; /* 彻底取消气泡边框 */
    color: #6b5460;
    border-radius: 4px 18px 18px 18px; 
    box-shadow: 0 4px 15px rgba(184, 118, 138, 0.05);
  }
  .bubble.pending { opacity: 0.5; }

  /* ---- 悬浮微信样式撤回菜单 ---- */
  #bubble-menu {
    display: none;
    position: absolute;
    z-index: 1000;
    background: rgba(26, 18, 30, 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 8px;
    padding: 6px 4px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    animation: menu-pop 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  @keyframes menu-pop {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .menu-btn {
    background: none;
    border: none;
    color: #e2cbd4;
    font-size: 12px;
    padding: 4px 12px;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.15s;
  }
  .menu-btn:hover {
    color: #ffb3c1;
  }
  .menu-btn:not(:last-child) {
    border-right: 1px solid rgba(255, 255, 255, 0.15);
  }

  #input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
    overflow: hidden; /* 裁剪边缘 */
  }
  
  /* 完美清除主聊区底部的溢出波点，并将其严格限制、封装于输入框背景中（对齐最左侧 22px 渐变波点尺寸） */
  #input-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    /* 横向白、灰、黑、灰、白渐变波点 (比例 1:2:3:2:1) */
    background: linear-gradient(to right, #ffffff 0%, #ffffff 11%, #c0b8c0 33%, #000000 45%, #000000 55%, #c0b8c0 67%, #ffffff 89%, #ffffff 100%);
    -webkit-mask-image: 
      radial-gradient(circle, #000 24%, transparent 24.5%), /* 放大并挤密底部波点 */
      radial-gradient(circle, #000 24%, transparent 24.5%);
    -webkit-mask-size: 22px 22px; /* 和左栏波点大小完全保持一致 */
    -webkit-mask-position: 0 0, 11px 11px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.85;
  }
  
  /* 增加高对比度高透光毛玻璃输入框，遮挡背景的波点 */
  #input-bar textarea {
    position: relative;
    z-index: 1; /* 确保在背景波点之上 */
    flex: 1;
    resize: none;
    border-radius: 16px;
    border: 1.5px solid rgba(255, 255, 255, 0.6); /* 立体透明圆框 */
    background: rgba(255, 255, 255, 0.75); /* 高浓度白色遮罩 */
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #5a4550;
    padding: 11px 16px;
    font-size: 15px;
    font-family: inherit;
    max-height: 100px;
    outline: none;
    transition: background 0.2s ease, border-color 0.2s ease;
    box-shadow: 0 4px 12px rgba(184, 118, 138, 0.05);
  }
  #input-bar textarea:focus {
    background: rgba(255, 255, 255, 0.9);
    border-color: rgba(229, 153, 169, 0.8);
  }
  #input-bar textarea::placeholder { color: #b08d98; }
  
  #input-bar button {
    position: relative;
    z-index: 1;
    width: 44px; height: 44px;
    border-radius: 50%; border: 2px solid #000000; background: #ffb3c1; color: #ffffff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); padding: 0;
  }
  #input-bar button svg { transform: rotate(-10deg) translate(-1px, 1px); transition: transform 0.2s ease; }
  #input-bar button:hover { background: #e599a9; transform: translateY(-2px) scale(1.05); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2); }
  #input-bar button:hover svg { transform: rotate(5deg) scale(1.1); }
  #input-bar button:active { transform: translateY(0) scale(0.95); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1); }
  #input-bar button:disabled { opacity: 0.4; box-shadow: none; cursor: default; background: #ffeef1; color: #b08d98; border-color: rgba(0,0,0,0.2); }

  /* ---- 右侧状态面板（现为 DESK 手账区，无边框，全面屏融合） ---- */
  #panel {
    width: 260px;
    flex-shrink: 0; display: none; flex-direction: column; gap: 16px;
    padding: 22px 18px; background: rgba(255, 235, 240, 0.55);
    border-radius: 24px; position: relative; overflow: hidden;
    border: none; /* 去除一切白色外边框，完美融入天色 */
    box-shadow: 0 8px 32px rgba(184, 118, 138, 0.08);
  }
  @media (min-width: 769px) { #panel { display: flex; } }
  
  #panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(to bottom, #ffeef1 0%, #ffeef1 20%, #ffffff 35%, #ffffff 65%, #ffeef1 80%, #ffeef1 100%);
    -webkit-mask-image: radial-gradient(circle, #000 15%, transparent 15.5%), radial-gradient(circle, #000 15%, transparent 15.5%);
    -webkit-mask-size: 14px 14px; -webkit-mask-position: 0 0, 7px 7px;
    pointer-events: none; z-index: 0; opacity: 0.85;
  }
  .panel-child { position: relative; z-index: 1; }
  .panel-title {
    font-family: "Georgia", "Songti SC", serif; font-size: 15px; letter-spacing: 3px;
    color: #a66275; margin-bottom: 6px; text-transform: uppercase; font-weight: bold;
    text-shadow: 0 2px 4px rgba(255,255,255,0.8);
  }

  /* --- 仿真实物便利贴堆叠留言板 --- */
  .sticky-note-stack {
    position: relative;
    width: 100%;
    min-height: 140px; /* 堆叠容器基准高度动态分配 */
    margin-top: 15px;
    margin-bottom: 25px;
    z-index: 1;
  }
  .sticky-note-card {
    position: absolute;
    top: 0; left: 0; right: 0;
    background: #ffffff; /* 干净纯净的白纸质感 */
    border-radius: 4px 18px 18px 18px; /* 模拟手账纸张微折角 */
    padding: 16px 16px 36px 16px; /* 底部留足空间给标星按钮 */
    box-shadow: 2px 4px 15px rgba(184, 118, 138, 0.15);
    /* 通过 CSS 变量动态计算原位，保证动画极度丝滑且散落错置 */
    transform: translate(var(--tx, 0), var(--ty, 0)) rotate(var(--rot, 0deg));
    transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
    cursor: pointer;
  }
  
  /* 情绪氛围极浅渐变叠加 (保留微弱的颜色区分) */
  .sticky-note-card.stage-sweet { background: linear-gradient(135deg, #fffcfd, #fff0f3); }
  .sticky-note-card.stage-tsundere { background: linear-gradient(135deg, #fffcfd, #f5eef1); }
  .sticky-note-card.stage-vulnerable { background: linear-gradient(135deg, #fffcfd, #ede3e7); }
  .sticky-note-card.stage-period { background: linear-gradient(135deg, #fffcfd, #fde8eb); }

  /* 悬浮交互：原位无缝浮起放大，绝不跳跃 */
  .sticky-note-card:hover {
    /* 保持原来的 XY 偏移，仅修改 Y 轴上升和比例 */
    transform: translate(var(--tx, 0), calc(var(--ty, 0px) - 6px)) rotate(0deg) scale(1.03) !important;
    z-index: 100 !important;
    opacity: 1 !important;
    box-shadow: 4px 8px 24px rgba(184, 118, 138, 0.22);
  }
  
  /* 便签纯文本区 */
  .sticky-note-text {
    font-size: 12.5px; color: #5a4550; line-height: 1.6; font-family: "Songti SC", serif;
    word-wrap: break-word;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  
  /* 恢复最经典的粉色星芒标星按钮 */
  .note-star-btn {
    position: absolute;
    bottom: 8px;
    right: 12px;
    background: none;
    border: none;
    font-size: 20px; 
    cursor: pointer;
    opacity: 0.6;
    transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.2s, filter 0.2s, color 0.2s;
    color: #d1b3bd; /* 未点亮的粉灰 */
    padding: 4px;
    line-height: 1;
  }
  .note-star-btn:hover {
    transform: scale(1.15);
  }
  .note-star-btn.active {
    opacity: 1;
    color: #ff5e84; /* 恢复完美的甜心粉色 */
    filter: drop-shadow(0 2px 4px rgba(255, 94, 132, 0.4));
  }

  /* --- 秘密双层收纳抽屉 (对称排列并沉于底部) --- */
  .drawer-wrapper { 
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: auto; /* 保证抽屉在状态面板的最下方 */
  }
  .drawer-btn {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px; /* 图标文字与分数的均匀间距 */
    background: rgba(255, 255, 255, 0.85); /* 纯白高透面板 */
    border: 1px solid rgba(255,255,255,1);
    border-radius: 12px; 
    padding: 16px; 
    cursor: pointer; 
    position: relative;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    color: #a66275; 
    font-weight: bold; 
    font-family: "Georgia", serif; 
    font-size: 13px;
    letter-spacing: 1px;
    box-shadow: 0 4px 15px rgba(184, 118, 138, 0.08);
  }
  /* 专属数字样式 */
  .drawer-count-text {
    font-family: "Courier New", monospace;
    font-weight: normal;
    color: #a66275;
    opacity: 0.8;
    font-size: 11px;
  }
  /* 抽屉面板上的四个精致粉色小波点阵列 */
  .drawer-btn::before {
    content: ''; 
    position: absolute; 
    top: 6px; left: 6px; right: 6px; bottom: 6px;
    background: 
      radial-gradient(circle, #a66275 2px, transparent 2.5px) top left / 10px 10px no-repeat,
      radial-gradient(circle, #a66275 2px, transparent 2.5px) top right / 10px 10px no-repeat,
      radial-gradient(circle, #a66275 2px, transparent 2.5px) bottom left / 10px 10px no-repeat,
      radial-gradient(circle, #a66275 2px, transparent 2.5px) bottom right / 10px 10px no-repeat;
    pointer-events: none;
    opacity: 0.7;
  }
  .drawer-btn:hover {
    background: #ffffff;
    transform: translateY(-2px); 
    box-shadow: 0 6px 20px rgba(184, 118, 138, 0.15);
  }
  .drawer-btn:active { transform: translateY(1px); }
  
  /* 抽屉容量已满警告状态 */
  .drawer-btn.layer-full {
    background: #fff5f6;
    border-color: rgba(255,94,132,0.6);
    animation: drawer-warn-glow 1.5s infinite alternate;
  }
  @keyframes drawer-warn-glow {
    from { box-shadow: 0 0 8px rgba(255, 94, 132, 0.2); }
    to { box-shadow: 0 0 16px rgba(255, 94, 132, 0.5), inset 0 1px 2px rgba(255,255,255,1); }

  .new-letter-sparkle {

  .letter-container {

  /* --- 仿真手账月经日历系统设计 --- */

  .calendar-legend {

  /* 仿真手账日历的日期操作卡片（日历内嵌或弹窗） */

</style>

const CODE = {{ code_param | tojson }};
const AVATAR_CHARON = {{ avatar_charon | tojson }};
const AVATAR_USER = {{ avatar_user | tojson }};
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusDot = document.getElementById('status-dot');
const statusLabel = document.getElementById('status-label');
const contextMenu = document.getElementById('bubble-menu');
const dayActionPopup = document.getElementById('day-action-popup');

// 日历排盘与月经数据缓存
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth(); // 0-11
let periodRecords = [];
let selectedDateStr = "";

// 长按/右键菜单相关的触发状态记录
let pressTimer;
let currentActiveMsgId = null;
let currentActiveRowEl = null;

function apiUrl(path) {
  const sep = path.includes('?') ? '&' : '?';
  return CODE ? `${path}${sep}code=${encodeURIComponent(CODE)}` : path;
}

function formatTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return '';
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  return h + ':' + m;
}

function renderMsgRow(role, content, createdAt, pending, msgId) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'charon');
  if (msgId) row.dataset.msgId = msgId;
  if (createdAt) row.dataset.createdAt = createdAt;

  // 头像星光容器化
  const avatarWrap = document.createElement('div');
  avatarWrap.className = 'avatar-wrapper ' + (role === 'user' ? 'user' : 'charon');

  // 手写迷你名字挂件悬浮标签
  const tag = document.createElement('span');
  tag.className = 'avatar-tag';
  tag.textContent = role === 'user' ? 'Seraphina' : 'Charon';
  avatarWrap.appendChild(tag);

  const avatar = document.createElement('img');
  avatar.className = 'msg-avatar';
  avatar.src = role === 'user' ? AVATAR_USER : AVATAR_CHARON;
  avatarWrap.appendChild(avatar);

  // 主星芒 (✦)
  const star = document.createElement('span');
  star.className = 'star-accent';
  star.textContent = '✦';
  avatarWrap.appendChild(star);

  // 镜像碎星 1 (✦)
  const d1 = document.createElement('span');
  d1.className = 'dust-star d-1';
  d1.textContent = '✦';
  avatarWrap.appendChild(d1);

  // 镜像碎星 2 (✦)
  const d2 = document.createElement('span');
  d2.className = 'dust-star d-2';
  d2.textContent = '✦';
  avatarWrap.appendChild(d2);

  row.appendChild(avatarWrap);

  const col = document.createElement('div');
  col.className = 'msg-col';

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'charon') + (pending ? ' pending' : '');
  bubble.textContent = content;
  col.appendChild(bubble);

  const timeRow = document.createElement('div');
  timeRow.className = 'msg-time-row';

  const timeEl = document.createElement('span');
  timeEl.className = 'msg-time';
  timeEl.textContent = formatTime(createdAt);
  timeRow.appendChild(timeEl);

  col.appendChild(timeRow);
  row.appendChild(col);

  // 微信悬浮撤回菜单触发机制 (电脑端右键，移动端长按)
  const bindContextMenu = (e) => {
    e.preventDefault();
    currentActiveMsgId = msgId;
    currentActiveRowEl = row;
    showWeChatMenu(bubble, msgId, role);
  };

  bubble.addEventListener('contextmenu', bindContextMenu);
  
  bubble.addEventListener('touchstart', (e) => {
    pressTimer = setTimeout(() => {
      currentActiveMsgId = msgId;
      currentActiveRowEl = row;
      showWeChatMenu(bubble, msgId, role);
    }, 600);
  }, { passive: true });
  
  bubble.addEventListener('touchend', () => clearTimeout(pressTimer));
  bubble.addEventListener('touchmove', () => clearTimeout(pressTimer));

  return row;
}

function showWeChatMenu(targetElement, id, typeOrRole) {
  const rect = targetElement.getBoundingClientRect();
  contextMenu.style.display = 'flex';
  contextMenu.innerHTML = '';

  if (typeOrRole === 'charon' || typeOrRole === 'user') {
    // ---- 聊天气泡菜单 ----
    if (id) {
      if (typeOrRole === 'charon') {
        const regenBtn = document.createElement('button');
        regenBtn.className = 'menu-btn';
        regenBtn.textContent = '重新生成';
        regenBtn.onclick = () => {
          if (currentActiveRowEl) regenerateMessage(id, currentActiveRowEl);
          hideWeChatMenu();
        };
        contextMenu.appendChild(regenBtn);
      }
      const recallBtn = document.createElement('button');
      recallBtn.className = 'menu-btn';
      recallBtn.textContent = '撤回';
      recallBtn.onclick = () => {
        if (currentActiveRowEl) deleteMessage(id, currentActiveRowEl);
        hideWeChatMenu();
      };
      contextMenu.appendChild(recallBtn);
    }
  } else if (typeOrRole === 'desk-note') {
    // ---- 桌面便签长按菜单 ----
    const moveBtn = document.createElement('button');
    moveBtn.className = 'menu-btn';
    moveBtn.textContent = '📥 移入抽屉';
    moveBtn.onclick = () => { moveNote(id, 'drawer', 'desk'); hideWeChatMenu(); };
    contextMenu.appendChild(moveBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'menu-btn';
    delBtn.textContent = '🗑️ 撕掉丢弃';
    delBtn.onclick = () => {
      // 物理撕下并揉碎动画
      targetElement.style.transition = 'all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1)';
      targetElement.style.transform = 'translateY(60px) scale(0.7) rotate(20deg)';
      targetElement.style.opacity = '0';
      setTimeout(() => { deleteNote(id, 'desk'); }, 400);
      hideWeChatMenu();
    };
    contextMenu.appendChild(delBtn);
  }

  const menuWidth = contextMenu.offsetWidth || 120;
  const menuHeight = contextMenu.offsetHeight || 34;
  contextMenu.style.left = (rect.left + rect.width / 2 - menuWidth / 2 + window.scrollX) + 'px';
  contextMenu.style.top = (rect.top - menuHeight - 8 + window.scrollY) + 'px';
}

function hideWeChatMenu() {
  contextMenu.style.display = 'none';
}

// 监听屏幕全局点击，自动收起菜单或日历弹窗
document.addEventListener('click', (e) => {

async function deleteMessage(msgId, rowEl) {
  if (!confirm('确定要撤回这条消息吗？')) return;
  try {
    const res = await fetch(apiUrl('/api/chat-delete'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: msgId })
    });
    const data = await res.json();
    if (data.ok) {
      rowEl.remove();
      loadStatus(); 
    } else {
      alert('撤回失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('网络错误，无法撤回');
  }
}

async function regenerateMessage(msgId, rowEl) {
  const bubble = rowEl.querySelector('.bubble');
  const originalText = bubble ? bubble.textContent : '';
  const createdAt = rowEl.dataset.createdAt || new Date().toISOString();
  if (bubble) {
    bubble.textContent = '…';
    bubble.classList.add('pending');
  }
  try {
    const res = await fetch(apiUrl('/api/chat-regenerate'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: msgId })
    });
    const data = await res.json();
    if (data.ok) {
      rowEl.replaceWith(renderMsgRow('charon', data.reply, createdAt, false, msgId));
      loadStatus();
    } else {
      if (bubble) {
        bubble.textContent = originalText;
        bubble.classList.remove('pending');
      }
      alert('重新生成失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    if (bubble) {
      bubble.textContent = originalText;
      bubble.classList.remove('pending');
    }
    alert('网络错误，重新生成失败');
  }
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function loadHistory() {
  try {
    const res = await fetch(apiUrl('/api/chat-messages'));
    const data = await res.json();
    messagesEl.innerHTML = '';
    if (!data.ok) {
      messagesEl.innerHTML = '<div id="empty-hint">加载失败</div>';
      return;
    }
    if (!data.messages || data.messages.length === 0) {
      messagesEl.innerHTML = '<div id="empty-hint">还没有聊过，说点什么吧</div>';
      return;
    }
    data.messages.forEach(m => messagesEl.appendChild(renderMsgRow(m.role, m.content, m.created_at, false, m.id)));
    scrollToBottom();
  } catch (e) {
    messagesEl.innerHTML = '<div id="empty-hint">网络错误</div>';
  }
}

function formatHours(h) {
  if (h === null || h === undefined) return '还没互动过';
  if (h < 1) return Math.round(h * 60) + ' 分钟前';
  return h.toFixed(1) + ' 小时前';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---- 便签相关的操作与数据同步函数 ----
async function deleteNote(id, sourceStr = "desk") {
  // 桌面便签经过动画撕碎处理，这里只做请求和刷新即可，不再拦截弹窗
  if (sourceStr !== "desk" && !confirm('确定要丢弃这张便签吗？它将被永久删除。')) return;
  try {
    const res = await fetch(apiUrl('/api/sticky-notes/delete'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id })
    });
    const data = await res.json();
    if (data.ok) {
      if (sourceStr === "desk") loadStatus();
      else if (sourceStr === "drawer") openDrawerNotes();
      else if (sourceStr === "archive") openArchiveBox();
    } else {
      alert('删除失败：' + (data.error || '未知错误'));
    }
  } catch (e) { alert('网络错误，丢弃失败'); }
}

async function moveNote(id, targetStatus, sourceStr) {
  try {
    const res = await fetch(apiUrl('/api/sticky-notes/move'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, target_status: targetStatus })
    });
    const data = await res.json();
    if (data.ok) {
      if (data.target_full) {
        alert(`已成功移入！但注意：当前${targetStatus === 'drawer' ? '便签抽屉' : '档案箱'}容量已满，记得及时清理哦！`);
      }
      if (sourceStr === "desk") loadStatus();
      else if (sourceStr === "drawer") openDrawerNotes();
      else if (sourceStr === "archive") openArchiveBox();
    }
  } catch(e) { alert('网络错误，移动便签失败'); }
}

async function starNote(id, isStarredNow, sourceStr) {
  try {
    const res = await fetch(apiUrl('/api/sticky-notes/star'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, is_starred: !isStarredNow })
    });
    const data = await res.json();
    if (data.ok) {
      if (sourceStr === "desk") loadStatus();
      else if (sourceStr === "drawer") openDrawerNotes();
      else if (sourceStr === "archive") openArchiveBox();
    }
  } catch(e) { alert('网络错误'); }
}

// ---- 加载状态 (Desk & 堆叠散开便签 & 警告判定) ----
async function loadStatus() {
  try {
    const res = await fetch(apiUrl('/api/chat-status'));
    const data = await res.json();
    if (!data.ok) return;

    statusLabel.textContent = data.status_label || '在线';
    statusDot.className = 'status-dot' + (data.mood_score < 50 ? ' low' : '');

    // 渲染桌面仿真层叠散开便签
    const container = document.getElementById('sticky-container');
    container.innerHTML = '';
    
    if (data.sticky_notes && data.sticky_notes.length > 0) {
      // 桌面满警告：卡片套上红色阴影或变色
      const isDeskFull = data.desk_full;

      data.sticky_notes.forEach((note, index) => {
        const card = document.createElement('div');
        card.className = `sticky-note-card stage-${note.stage || 'steady'}`;
        
        // 仿真手账微倾斜与错落散开算法 (大幅拉长 Y 轴间距以暴露底层)
        const rotateDeg = (index === 0) ? -2 : (index === 1 ? 3 : (index === 2 ? -1 : (index % 2 === 0 ? -4 : 4)));
        const offsetTop = index * 45; // [重点改进] 将原先的 10px 放大为 45px，完美散开
        const offsetX = index % 2 === 0 ? 4 : -4; // 微弱的左右蛇形交错
        
        // 将位移写入 CSS 变量，供悬浮动效无缝接管
        card.style.setProperty('--rot', `${rotateDeg}deg`);
        card.style.setProperty('--tx', `${offsetX}px`);
        card.style.setProperty('--ty', `${offsetTop}px`);
        
        card.style.zIndex = 15 - index;
        
        // 底层适当淡化，更有景深感
        if (index > 0) {
          card.style.opacity = 1 - index * 0.08; 
        }
        
        // 满载警告效果
        if (isDeskFull) {
          card.style.boxShadow = '0 0 15px rgba(255, 94, 132, 0.4), inset 0 0 0 1px rgba(255,255,255,1)';
        }

        const starIcon = note.is_starred ? '⭐' : '☆';
        const starClass = note.is_starred ? 'active' : '';

        // 彻底清空杂乱图标，只保留文本和右下角星芒
        card.innerHTML = `
          <div class="sticky-note-text">${escapeHtml(note.message)}</div>
          <button class="note-star-btn ${starClass}" onclick="event.stopPropagation(); starNote(${note.id}, ${note.is_starred}, 'desk')" title="标星收藏">${starIcon}</button>
        `;

        // 绑定右键/长按撕纸抛弃和整理机制
        const triggerNoteMenu = (e) => {
          e.preventDefault();
          e.stopPropagation();
          showWeChatMenu(card, note.id, "desk-note");
        };
        card.addEventListener('contextmenu', triggerNoteMenu);
        card.addEventListener('touchstart', (e) => {
          pressTimer = setTimeout(() => triggerNoteMenu(e), 600);
        }, { passive: true });
        card.addEventListener('touchend', () => clearTimeout(pressTimer));
        card.addEventListener('touchmove', () => clearTimeout(pressTimer));

        container.appendChild(card);
      });
      // 动态撑开容器高度，完美容纳所有散开的便签
      container.style.minHeight = (110 + (data.sticky_notes.length - 1) * 45) + 'px';
    } else {
      container.innerHTML = `
        <div class="sticky-note-card" style="--rot:-1deg; --tx:0; --ty:0;">
          <div class="sticky-note-text" style="color:#b08d98; text-align:center;">桌面空空的，TA还没有留言。</div>
        </div>
      `;
      container.style.minHeight = '110px';
    }

    // 抽屉容量统计与满仓霓虹闪烁警告
    const notesBtn = document.getElementById('drawer-notes-btn');
    const lettersBtn = document.getElementById('drawer-letters-btn');
    
    // 异步获取抽屉计数
    fetch(apiUrl('/api/sticky-notes?status=drawer')).then(res=>res.json()).then(d => {
      if(d.ok) {
        document.getElementById('notes-drawer-count').textContent = `${d.notes.length}/30`;
        document.getElementById('box-notes-count').textContent = `${d.notes.length}/30`;
        if (d.layer_full.drawer) notesBtn.classList.add('layer-full');
        else notesBtn.classList.remove('layer-full');
      }
    });

    fetch(apiUrl('/api/love-letters?status=drawer')).then(res=>res.json()).then(d => {
      if(d.ok) {
        document.getElementById('letters-drawer-count').textContent = `${d.letters.length}/20`;
        document.getElementById('box-letters-count').textContent = `${d.letters.length}/20`;
        if (d.layer_full.drawer) lettersBtn.classList.add('layer-full');
        else lettersBtn.classList.remove('layer-full');
      }
    });

    // 档案箱容量总数提示
    Promise.all([
      fetch(apiUrl('/api/sticky-notes?status=archive')).then(res=>res.json()),
      fetch(apiUrl('/api/love-letters?status=archive')).then(res=>res.json())
    ]).then(([noteData, letterData]) => {
      if(noteData.ok && letterData.ok) {
        const total = noteData.notes.length + letterData.letters.length;
        document.getElementById('box-archive-count').textContent = `${total}/200`;
      }
    });

    // 新情书红点星芒提示
    const spark = document.getElementById('new-letter-indicator');
    spark.style.display = data.has_new_letter ? 'inline' : 'none';

  } catch (e) { console.error("状态加载失败", e); }
}

    ]);

      html += `<div style="font-family: 'Georgia', serif; font-size:14px; color:#a66275; margin-bottom:15px; border-bottom:1px solid rgba(0,0,0,0.06); padding-bottom:8px;">★ Pinned Notes (${noteData.notes.length}/100)</div>`;
      if (noteData.notes.length > 0) {
        noteData.notes.forEach(note => {
          const starIcon = note.is_starred ? '⭐' : '☆';
          const starClass = note.is_starred ? 'active' : '';
          html += `
            <div class="single-letter">
              <div class="letter-time-row">
                <span class="letter-time">📌 ${formatTime(note.created_at)} · ${note.created_at.substring(0,10)}</span>
                <div class="letter-act-group">
                  <button class="note-act-btn star-btn ${starClass}" onclick="starNote(${note.id}, ${note.is_starred}, 'archive')">${starIcon}</button>
                  <button class="letter-del-btn" style="color: #a66275;" onclick="moveNote(${note.id}, 'drawer', 'archive')" title="取出，移回便签抽屉">📤 取出</button>
                  <button class="letter-del-btn" onclick="deleteNote(${note.id}, 'archive')" title="永久删除">🗑️ 丢弃</button>
                </div>
              </div>
              <div class="letter-text" style="font-family: inherit; font-style: normal;">${escapeHtml(note.message)}</div>
            </div>
          `;
        });
      } else {
        html += '<div style="text-align:center; color:#b08d98; margin:15px 0; font-size:12px;">这里还没有归档便签...</div>';
      }

      // 档案箱情书列表
      html += `<div style="font-family: 'Georgia', serif; font-size:14px; color:#a66275; margin-top:30px; margin-bottom:15px; border-bottom:1px solid rgba(0,0,0,0.06); padding-bottom:8px;">★ Letters Box (${letterData.letters.length}/100)</div>`;
      if (letterData.letters.length > 0) {
        letterData.letters.forEach(letter => {
          const typeIcon = letter.letter_type === 'sweet' ? '💌' : '🌧️';
          const starIcon = letter.is_starred ? '⭐' : '☆';
          const starClass = letter.is_starred ? 'active' : '';
          html += `
            <div class="single-letter">
              <div class="letter-time-row">
                <span class="letter-time">${typeIcon} ${formatTime(letter.created_at)} · ${letter.created_at.substring(0,10)}</span>
                <div class="letter-act-group">
                  <button class="note-act-btn star-btn ${starClass}" onclick="starLetter(${letter.id}, ${letter.is_starred}, 'archive')">${starIcon}</button>
                  <button class="letter-del-btn" onclick="deleteLetter(${letter.id})" title="永久删除">🗑️ 丢弃</button>
                </div>
              </div>
              <div class="letter-text">${escapeHtml(letter.content)}</div>
            </div>
          `;
        });
      } else {
        html += '<div style="text-align:center; color:#b08d98; margin:15px 0; font-size:12px;">这里还没有归档情书...</div>';
      }

      area.innerHTML = html;
    }
  } catch(e) {
    area.innerHTML = '<div style="text-align:center; color:#b08d98; margin-top:40px;">档案箱锁死，无法开启</div>';
  }
}
function closeArchiveBox() { document.getElementById('archive-modal').style.display = 'none'; }


// ==========================================
// ---- 4. 生理期仿真手账日历系统功能 ----
// ==========================================
async function openPeriodCalendar() {
  document.getElementById('calendar-modal').style.display = 'flex';
  await fetchPeriodData(currentYear);
}
function closePeriodCalendar() {
  document.getElementById('calendar-modal').style.display = 'none';
}

async function fetchPeriodData(year) {
  try {
    const res = await fetch(apiUrl(`/api/period/calendar?year=${year}`));
    const data = await res.json();
    if (data.ok) {
      periodRecords = data.records;
      renderCalendarGrid();
    }
  } catch(e) { console.error("日历数据获取失败", e); }
}

function renderCalendarGrid() {
  const grid = document.getElementById('calendar-days-grid');
  const title = document.getElementById('calendar-month-year');
  grid.innerHTML = '';

  title.textContent = `${currentYear}年${currentMonth + 1}月`;

  // 计算当月首日是星期几（转换为周一为0，周日为6）
  const firstDay = new Date(currentYear, currentMonth, 1);
  let dayOfWeek = firstDay.getDay(); 
  dayOfWeek = (dayOfWeek === 0) ? 6 : dayOfWeek - 1; // 调整为：0=周一, 6=周日

  const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

  // 1. 填充空白日期占位
  for (let i = 0; i < dayOfWeek; i++) {
    const span = document.createElement('span');
    span.className = 'calendar-day empty';
    grid.appendChild(span);
  }

  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

  // 2. 绘制每一天
  for (let day = 1; day <= totalDays; day++) {
    const dayBtn = document.createElement('span');
    dayBtn.className = 'calendar-day';
    dayBtn.textContent = day;

    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    
    // 是否为今天
    if (dateStr === todayStr) {
      dayBtn.classList.add('today-marker');
    }

    // 匹配生理期数据库区间，高亮上色
    periodRecords.forEach(record => {
      const start = record.start_date;
      const end = record.end_date;
      if (start) {
        if (end) {
          // 已结束生理期
          if (dateStr >= start && dateStr <= end) {
            dayBtn.classList.add('period-active');
          }
        } else {
          // 正在进行中
          if (dateStr >= start && dateStr <= todayStr) {
            dayBtn.classList.add('period-active');
          }
          if (dateStr === start) {
            // 唯一起点带虚框
            dayBtn.classList.add('period-ongoing');
          }
        }
      }
    });

    // 点击弹出选择开始还是结束的控制板
    dayBtn.onclick = (e) => {
      e.stopPropagation();
      selectedDateStr = dateStr;
      showDayActionPopup(dayBtn);
    };

    grid.appendChild(dayBtn);
  }
}

function prevMonth() {
  if (currentMonth === 0) {
    currentMonth = 11;
    currentYear--;
    fetchPeriodData(currentYear);
  } else {
    currentMonth--;
    renderCalendarGrid();
  }
}
function nextMonth() {
  if (currentMonth === 11) {
    currentMonth = 0;
    currentYear++;
    fetchPeriodData(currentYear);
  } else {
    currentMonth++;
    renderCalendarGrid();
  }
}

function showDayActionPopup(dayBtn) {
  const rect = dayBtn.getBoundingClientRect();
  dayActionPopup.style.display = 'flex';
  
  // 智能避让边界定位
  dayActionPopup.style.left = (rect.left + rect.width/2 - 65 + window.scrollX) + 'px';
  dayActionPopup.style.top = (rect.top - 110 + window.scrollY) + 'px';

  // 绑定事件
  document.getElementById('popup-start-btn').onclick = () => savePeriodDate('start');
  document.getElementById('popup-end-btn').onclick = () => savePeriodDate('end');
}

function hideDayActionPopup() {
  dayActionPopup.style.display = 'none';
}

async function savePeriodDate(actionType) {
  try {
    const res = await fetch(apiUrl('/api/period/save'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: actionType, date: selectedDateStr })
    });
    const data = await res.json();
    if (data.ok) {
      alert(`已成功标记生理期：${actionType === 'start' ? '开始' : '结束'} (${selectedDateStr})`);
      fetchPeriodData(currentYear); // 刷新日历盘
      hideDayActionPopup();
    } else {
      alert('标记失败：' + (data.error || '未知错误'));
    }
  } catch (e) { alert('网络错误，记录失败'); }
}


// ---- 以下发送相关保持不变 ----
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = ''; inputEl.style.height = 'auto'; sendBtn.disabled = true;

  const nowIso = new Date().toISOString();
  const userRow = renderMsgRow('user', text, nowIso, false);
  messagesEl.appendChild(userRow);
  const pendingRow = renderMsgRow('charon', '…', nowIso, true);
  messagesEl.appendChild(pendingRow);
  scrollToBottom();

  const pendingBubble = pendingRow.querySelector('.bubble');

  try {
    const res = await fetch(apiUrl('/api/chat-send'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    if (data.ok) {
      pendingBubble.textContent = data.reply; pendingBubble.classList.remove('pending');
      userRow.replaceWith(renderMsgRow('user', text, nowIso, false, data.user_msg_id));
      pendingRow.replaceWith(renderMsgRow('charon', data.reply, nowIso, false, data.charon_msg_id));
    } else {
      pendingBubble.textContent = '（没能回复：' + (data.error || '未知错误') + '）';
      pendingBubble.classList.remove('pending');
    }
  } catch (e) {
    pendingBubble.textContent = '（网络错误，没发出去）'; pendingBubble.classList.remove('pending');
  }
  scrollToBottom(); sendBtn.disabled = false; loadStatus();
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

const modelSelect = document.getElementById('model-select');
async function loadModelSelector() {
  try {
    const res = await fetch(apiUrl('/api/chat-model'));
    const data = await res.json();
    if (!data.ok) return;
    modelSelect.innerHTML = '';
    data.available_models.forEach(m => {
      const opt = document.createElement('option'); opt.value = m; opt.textContent = m;
      if (m === data.current_model) opt.selected = true; modelSelect.appendChild(opt);
    });
  } catch (e) {}
}
modelSelect.addEventListener('change', async () => {
  const chosen = modelSelect.value;
  try {
    const res = await fetch(apiUrl('/api/chat-model'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: chosen })
    });
    const data = await res.json();
    if (!data.ok) { alert('切换失败：' + (data.error || '未知错误')); loadModelSelector(); }
  } catch (e) { alert('网络错误'); loadModelSelector(); }
});


loadHistory();
loadStatus();
loadModelSelector();
</script>
