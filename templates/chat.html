<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Charon</title>
<link rel="manifest" href="/manifest.json">
<!-- iOS "添加到主屏幕"认这个标签，不认manifest.json里的icons（Safari对Web Manifest图标支持不完整） -->
<link rel="apple-touch-icon" href="/static/app_icon_192.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Charon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    /* 网格径向渐变，调浅调亮为晨曦迷雾般的柔和马卡龙粉 */
    background: radial-gradient(circle at 10% 20%, #fffcfd 0%, #fbf3f5 35%, #f3e2e6 70%, #ebd3d9 100%);
    background-attachment: fixed;
    font-family: "Songti SC", "STSong", Georgia, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    color: #5a4550; /* 恢复至初始雅致深紫灰 */
  }
  #app {
    display: flex;
    height: 100vh; height: 100dvh;
    padding: 14px;
    gap: 14px;
    position: relative;
    z-index: 2;
  }

  /* ---- 左侧波点玻璃舱导航栏 ---- */
  #nav {
    width: 60px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 24px 0;
    background: rgba(255, 238, 241, 0.6); /* 马卡龙蜜桃粉色底色 */
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px 0 rgba(184, 118, 138, 0.08);
  }
  /* 纯 CSS 垂直多色渐变遮罩波点 - 放大到 22px 并且调整色比 */
  #nav::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    /* 垂直黑-灰-白-灰-黑渐变 (比例 2:1:3:2:2) */
    background: linear-gradient(to bottom, #000000 0%, #000000 20%, #c0b8c0 30%, #ffffff 40%, #ffffff 60%, #c0b8c0 80%, #000000 100%);
    -webkit-mask-image: 
      radial-gradient(circle, #000 24%, transparent 24.5%),
      radial-gradient(circle, #000 24%, transparent 24.5%);
    -webkit-mask-size: 22px 22px; 
    -webkit-mask-position: 0 0, 11px 11px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.85;
  }
  
  /* ---- 导航图标 & 发送按钮：白水晶高亮白底+粉波点渗透材质 ---- */
  .nav-icon, #send-btn {
    position: relative;
    z-index: 1;
    width: 42px; height: 42px;
    border-radius: 50%; /* 圆形按钮 */
    display: flex; align-items: center; justify-content: center;
    border: none !important;
    
    /* 核心材质：白底半透 (0.95 浓度隔绝黑色) + 樱花粉波点(#ff8fa3)渗透 + 磨砂玻璃效果 */
    background: 
      radial-gradient(circle, rgba(255, 143, 163, 0.22) 15%, transparent 15.5%),
      radial-gradient(circle, rgba(255, 143, 163, 0.22) 15%, transparent 15.5%),
      rgba(255, 255, 255, 0.95) !important;
    background-size: 6px 6px, 6px 6px, 100% 100% !important;
    background-position: 0 0, 3px 3px, 0 0 !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    
    color: #ff8fa3 !important; /* 图案颜色：高保真樱花粉色 */
    text-decoration: none;
    transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    
    /* 核心阴影：去除霓虹，改回清透温润的实体物理投影 */
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08) !important;
    cursor: pointer;
    padding: 0;
  }
  .nav-icon svg {
    width: 20px; 
    height: 20px;
    stroke-width: 1.5px;
  }
  .nav-icon:hover, #send-btn:hover {
    transform: translateY(-2px) scale(1.05);
    background-color: rgba(255, 255, 255, 0.98) !important;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12) !important; /* 悬浮阴影加深 */
  }
  .nav-icon:active, #send-btn:active { 
    transform: translateY(0) scale(0.95); 
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05) !important;
  }
  #send-btn svg { width: 18px; height: 18px; stroke-width: 1.5px; transform: rotate(-10deg) translate(-1px, 1px); transition: transform 0.2s ease; }
  #send-btn:hover svg { transform: rotate(5deg) scale(1.1); }
  #send-btn:disabled { opacity: 0.5; filter: grayscale(50%); cursor: default; box-shadow: none !important; }

  /* ---- 中间玻璃舱对话区 ---- */
  #main {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border-radius: 28px; box-shadow: 0 12px 40px rgba(184, 118, 138, 0.10); overflow: hidden; position: relative;
  }
  #main::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%), radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%);
    background-size: 10px 10px; background-position: 0 0, 5px 5px; pointer-events: none; z-index: 0;
  }
  
  /* ---- 酷黑渐变 Header ---- */
  #header {
    padding: 20px 24px 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.2); flex-shrink: 0;
    display: flex; align-items: center; gap: 14px; position: relative;
    background: linear-gradient(to right, #000000 0%, #000000 52%, rgba(26, 18, 30, 0.9) 62%, #cf7d90 85%, #ffb3c1 100%);
  }
  #header::before {
    content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 65%;
    background-image: radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%), radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%);
    background-size: 11px 11px; background-position: 0 0, 5.5px 5.5px;
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%); pointer-events: none; z-index: 0;
  }
  
  .avatar-wrapper { position: relative; display: inline-block; width: 36px; height: 36px; flex-shrink: 0; }
  .avatar-wrapper.header-avatar-wrap { width: 44px; height: 44px; }
  .avatar-wrapper .msg-avatar, .avatar-wrapper #header-avatar {
    border: 1.5px solid #ffffff; box-shadow: 0 0 8px rgba(255, 255, 255, 0.6); 
  }
  .avatar-wrapper .star-accent { position: absolute; font-size: 15px; pointer-events: none; user-select: none; animation: star-pulse 2s infinite ease-in-out; }
  .avatar-wrapper.charon .star-accent { top: -6px; left: -6px; color: #000000; text-shadow: 0 0 4px #000000, 0 0 10px rgba(0, 0, 0, 0.95); }
  .avatar-wrapper.user .star-accent { top: -6px; right: -6px; color: #ffb3c1; text-shadow: 0 0 4px #ff5e84, 0 0 10px rgba(255, 94, 132, 0.95); }
  .avatar-wrapper .dust-star { position: absolute; pointer-events: none; user-select: none; color: #ffffff; text-shadow: 0 0 5px rgba(255, 255, 255, 0.8); }
  .avatar-wrapper.charon .dust-star.d-1 { bottom: -4px; right: -4px; font-size: 9px; opacity: 0.8; }
  .avatar-wrapper.charon .dust-star.d-2 { top: 14px; right: -7px; font-size: 8px; opacity: 0.6; }
  .avatar-wrapper.user .dust-star.d-1 { bottom: -4px; left: -4px; font-size: 9px; opacity: 0.8; }
  .avatar-wrapper.user .dust-star.d-2 { top: 14px; left: -7px; font-size: 8px; opacity: 0.6; }
  @keyframes star-pulse { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.15); opacity: 1; } }
  
  .avatar-tag {
    position: absolute; font-family: "Dancing Script", cursive; font-size: 11px; white-space: nowrap; pointer-events: none; user-select: none; z-index: 2;
  }
  .avatar-wrapper.charon .avatar-tag { top: -15px; left: 50%; transform: translateX(-50%); color: #5a4550; text-shadow: 0 0 4px rgba(255, 255, 255, 0.8); }
  .avatar-wrapper.user .avatar-tag { top: -15px; left: 50%; transform: translateX(-50%); color: #cf7d90; text-shadow: 0 0 4px rgba(255, 255, 255, 0.8); }

  #header-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  #header-text { position: relative; z-index: 1; min-width: 0; }
  #header .brand {
    font-family: "Georgia", "Songti SC", serif; font-size: 26px; font-style: italic; letter-spacing: 3px; color: #e599a9; font-weight: 500; line-height: 1.2; text-transform: uppercase;
    text-shadow: 0 0 10px rgba(229, 153, 169, 0.8), 0 0 20px rgba(229, 153, 169, 0.4);
  }
  #header .sub { font-size: 11px; color: rgba(255, 255, 255, 0.7); letter-spacing: 1px; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .status-badge { background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.25); padding: 1px 7px; border-radius: 5px; font-size: 10px; color: #ffffff; display: inline-flex; align-items: center; gap: 4px; }
  #model-select { margin-left: 6px; font-size: 10px; color: #fff; background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 5px; padding: 1px 4px; max-width: 150px; outline: none; }
  #model-select option { color: #000; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #84cc9a; display: inline-block; box-shadow: 0 0 6px #84cc9a; }
  .status-dot.low { background: #c3a1ad; box-shadow: 0 0 6px #c3a1ad; }
  
  .header-signature-wrap { position: relative; z-index: 1; margin-left: auto; display: inline-flex; align-items: center; }
  .sig-star { position: absolute; pointer-events: none; user-select: none; color: #ffffff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.9); }
  .sig-star.s-1 { top: -4px; left: -10px; font-size: 8px; animation: star-pulse 2.5s infinite ease-in-out; }
  .sig-star.s-2 { bottom: -4px; right: -10px; font-size: 10px; animation: star-pulse 1.8s infinite ease-in-out; }
  .header-signature { font-family: "Dancing Script", cursive; font-size: 22px; color: rgba(255, 255, 255, 0.92); text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); user-select: none; pointer-events: none; }

  /* ---- 聊天气泡区域 ---- */
  #messages {
    position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 22px 24px;
    display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch;
  }
  .msg-row { display: flex; align-items: flex-start; gap: 10px; max-width: 88%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.charon { align-self: flex-start; }
  .msg-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .msg-col { display: flex; flex-direction: column; min-width: 0; }
  .msg-row.user .msg-col { align-items: flex-end; }
  .msg-row.charon .msg-col { align-items: flex-start; }
  .msg-time { font-size: 10px; color: #b08d98; margin: 4px 4px 0; }
  .msg-time-row { display: flex; align-items: center; gap: 4px; }

  /* 完美的半调波普印刷微缩网点气泡 */
  .bubble {
    position: relative; padding: 12px 18px; line-height: 1.6; font-size: 15px; word-wrap: break-word; white-space: pre-wrap;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: pointer;
  }
  .bubble.user {
    background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 15%, transparent 15.5%), radial-gradient(circle, rgba(255, 255, 255, 0.16) 15%, transparent 15.5%), linear-gradient(135deg, #f3b0c3, #e593a4);
    background-size: 6px 6px, 6px 6px, 100% 100%; background-position: 0 0, 3px 3px, 0 0;
    color: #ffffff; border-radius: 18px 4px 18px 18px; box-shadow: 0 4px 15px rgba(184, 96, 118, 0.18);
  }
  .bubble.charon {
    background: radial-gradient(circle, rgba(229, 153, 171, 0.08) 15%, transparent 15.5%), radial-gradient(circle, rgba(229, 153, 171, 0.08) 15%, transparent 15.5%), rgba(255, 255, 255, 0.55);
    background-size: 6px 6px, 6px 6px, 100% 100%; background-position: 0 0, 3px 3px, 0 0;
    border: none; color: #6b5460; border-radius: 4px 18px 18px 18px; box-shadow: 0 4px 15px rgba(184, 118, 138, 0.05);
  }
  .bubble.pending { opacity: 0.5; }

  /* 行内编辑模式：气泡本身变可编辑，需要覆盖默认的user-select:none/cursor:pointer，
     否则光标无法进入、文字也选不中。虚线描边给出"正在编辑"的明确视觉信号。 */
  .bubble.editing-bubble {
    -webkit-user-select: text; user-select: text; cursor: text;
    outline: 2px dashed rgba(255, 255, 255, 0.65); outline-offset: 2px;
  }
  .edit-action-bar { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .edit-action-btn {
    border: none; border-radius: 12px; padding: 4px 12px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: opacity 0.15s;
  }
  .edit-action-btn:disabled { opacity: 0.5; cursor: default; }
  .edit-action-btn.cancel { background: rgba(107, 84, 96, 0.12); color: #6b5460; }
  .edit-action-btn.send { background: linear-gradient(135deg, #f3b0c3, #e593a4); color: #fff; }

  /* ---- 全局悬浮操作菜单 ---- */
  #bubble-menu {
    display: none; position: absolute; z-index: 1000; background: rgba(26, 18, 30, 0.95);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 8px; padding: 6px 4px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25); animation: menu-pop 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  @keyframes menu-pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .menu-btn {
    background: none; border: none; color: #e2cbd4; font-size: 12px; padding: 6px 12px; cursor: pointer; font-family: inherit; transition: color 0.15s;
  }
  .menu-btn:hover { color: #ffb3c1; }
  .menu-btn:not(:last-child) { border-right: 1px solid rgba(255, 255, 255, 0.15); }

  #input-bar {
    display: flex; gap: 10px; padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255, 255, 255, 0.2); flex-shrink: 0; position: relative; z-index: 1; overflow: hidden;
  }
  #input-bar::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to right, #ffffff 0%, #ffffff 11%, #c0b8c0 33%, #000000 45%, #000000 55%, #c0b8c0 67%, #ffffff 89%, #ffffff 100%);
    -webkit-mask-image: radial-gradient(circle, #000 24%, transparent 24.5%), radial-gradient(circle, #000 24%, transparent 24.5%);
    -webkit-mask-size: 22px 22px; -webkit-mask-position: 0 0, 11px 11px; pointer-events: none; z-index: 0; opacity: 0.85;
  }
  #input-bar textarea {
    position: relative; z-index: 1; flex: 1; resize: none; border-radius: 16px; border: 1.5px solid rgba(255, 255, 255, 0.6);
    background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #5a4550; padding: 11px 16px; font-size: 15px; font-family: inherit; max-height: 100px; outline: none;
    transition: background 0.2s ease, border-color 0.2s ease; box-shadow: 0 4px 12px rgba(184, 118, 138, 0.05);
  }
  #input-bar textarea:focus { background: rgba(255, 255, 255, 0.9); border-color: rgba(229, 153, 169, 0.8); }
  #input-bar textarea::placeholder { color: #b08d98; }

  /* ---- 右侧状态面板（DESK 手账区） ---- */
  #panel {
    width: 260px; flex-shrink: 0; display: none; flex-direction: column;
    padding: 22px 18px; background: rgba(255, 235, 240, 0.55); border-radius: 24px; position: relative; overflow: hidden;
    border: none; box-shadow: 0 8px 32px rgba(184, 118, 138, 0.08);
  }
  @media (min-width: 769px) { #panel { display: flex; } }
  #panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(to bottom, #ffeef1 0%, #ffeef1 20%, #ffffff 35%, #ffffff 65%, #ffeef1 80%, #ffeef1 100%);
    -webkit-mask-image: radial-gradient(circle, #000 15%, transparent 15.5%), radial-gradient(circle, #000 15%, transparent 15.5%);
    -webkit-mask-size: 14px 14px; -webkit-mask-position: 0 0, 7px 7px; pointer-events: none; z-index: 0; opacity: 0.85;
  }
  .panel-child { position: relative; z-index: 1; }
  .panel-title {
    font-family: "Georgia", "Songti SC", serif; font-size: 15px; letter-spacing: 3px; color: #a66275; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; text-shadow: 0 2px 4px rgba(255,255,255,0.8);
  }

  /* --- 仿真实物便利贴堆叠留言板 (FlowLayout 自然流式排版，完整不裁切，靠负边距压角) --- */
  .sticky-note-stack {
    position: relative; width: 100%; display: flex; flex-direction: column;
    margin-top: 15px; margin-bottom: 18px; z-index: 1;
    /* 不设置任何 max-height / overflow，让内容自然撑开容器高度，每张便签都完整可读 */
  }
  .sticky-note-card {
    position: relative;
    border: none; /* 零边框，只靠投影和底色区分层级 */
    border-radius: 3px 14px 14px 14px;
    padding: 12px 11px 12px 11px;
    width: 88%; /* 横宽收窄，不再撑满panel整个可用宽度，露出左右呼吸感 */
    aspect-ratio: 1 / 0.572; /* 字号收小、行高收紧后，5行文字精确铺满的比例，整体更矮 */
    box-shadow: 0 8px 20px rgba(120, 80, 95, 0.18), 0 2px 5px rgba(120, 80, 95, 0.1);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    -webkit-user-select: none; user-select: none; cursor: pointer;
    flex-shrink: 0;
    /* margin-top 由JS按便签id动态计算（含左右随机水平位移），这里不再写死，避免覆盖冲突 */
  }
  .sticky-note-card:first-child { margin-top: 0; }
  .sticky-note-card:nth-child(1) { z-index: 20; }
  .sticky-note-card:nth-child(2) { z-index: 19; }
  .sticky-note-card:nth-child(3) { z-index: 18; }
  .sticky-note-card:nth-child(4) { z-index: 17; }
  .sticky-note-card:nth-child(5) { z-index: 16; }
  .sticky-note-card:nth-child(n+6) { z-index: 15; }

  .sticky-note-card:hover {
    transform: rotate(0deg) translateY(-4px) scale(1.03) !important;
    z-index: 100 !important;
    box-shadow: 0 14px 30px rgba(120, 80, 95, 0.26), 0 3px 8px rgba(120, 80, 95, 0.15);
  }
  .sticky-note-text {
    font-size: 12.5px; line-height: 1.42; font-family: "Songti SC", serif; word-wrap: break-word;
    /* 不再垂直居中：文字从卡片顶部padding之后自然开始排列 */
  }
  /* 纯正精致的荧光樱花粉标星按钮 */
  .note-star-btn {
    position: absolute; bottom: 8px; right: 12px; background: none; border: none; font-size: 20px; cursor: pointer;
    opacity: 0.5; transition: transform 0.2s, opacity 0.2s, filter 0.2s; color: #e5a4b5; padding: 4px; line-height: 1;
  }
  .note-star-btn:hover { transform: scale(1.15); }
  .note-star-btn.active {
    opacity: 1; color: #ff8fa3 !important; /* 纯樱花粉 */
    filter: drop-shadow(0 2px 5px rgba(255, 143, 163, 0.45));
  }

  /* --- 秘密小抽屉收纳盒 (移动到底部，文字排版对齐) --- */
  .drawer-wrapper { 
    display: flex; flex-direction: column; gap: 12px; margin-top: auto; padding-top: 10px;
  }
  .drawer-btn {
    background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255,255,255,1); border-radius: 12px; 
    padding: 14px 10px; text-align: center; cursor: pointer; position: relative;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    color: #a66275; font-family: "Georgia", serif; 
    box-shadow: 0 4px 15px rgba(184, 118, 138, 0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .drawer-btn-title { font-weight: bold; font-size: 13px; letter-spacing: 1px; }
  .drawer-btn-count { font-size: 10px; opacity: 0.75; font-family: "Courier New", monospace; }
  
  .drawer-btn::before {
    content: ''; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px;
    background: 
      radial-gradient(circle, rgba(166,98,117,0.4) 2px, transparent 2.5px) top left / 10px 10px no-repeat,
      radial-gradient(circle, rgba(166,98,117,0.4) 2px, transparent 2.5px) top right / 10px 10px no-repeat,
      radial-gradient(circle, rgba(166,98,117,0.4) 2px, transparent 2.5px) bottom left / 10px 10px no-repeat,
      radial-gradient(circle, rgba(166,98,117,0.4) 2px, transparent 2.5px) bottom right / 10px 10px no-repeat;
    pointer-events: none; opacity: 0.7;
  }
  .drawer-btn:hover { background: #ffffff; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(184, 118, 138, 0.15); }
  .drawer-btn:active { transform: translateY(1px); }
  
  .drawer-btn.layer-full { background: #fff5f6; border-color: rgba(255,94,132,0.6); animation: drawer-warn-glow 1.5s infinite alternate; }
  @keyframes drawer-warn-glow {
    from { box-shadow: 0 0 8px rgba(255, 94, 132, 0.2); }

  .new-letter-sparkle {

  /* --- 手机自适应底部毛玻璃 Tab 导航栏 --- */

    #bottom-tabs {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(56px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255, 238, 241, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border-top: 1px solid rgba(255, 255, 255, 0.4); z-index: 1000; justify-content: space-around; align-items: center; box-shadow: 0 -4px 24px rgba(184, 118, 138, 0.08);

    .tab-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;

    /* SVG 在底部栏统一精细描边 */

    .tab-item .tab-label { font-size: 10px; margin-top: 2px; font-weight: bold; }

    .tab-item.active .tab-icon { filter: grayscale(0%); filter: drop-shadow(0 0 4px rgba(255, 94, 132, 0.4)); }

  /* --- 秘密小抽屉/档案箱/日历/人设编辑弹窗 --- */
  #letter-modal, #archive-modal, #drawer-notes-modal, #calendar-modal, #persona-modal {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(26, 18, 30, 0.65); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    z-index: 2000; align-items: center; justify-content: center; padding: 20px; animation: modal-fade 0.3s ease;
  }
  @keyframes modal-fade { from { opacity: 0; } to { opacity: 1; } }
  .letter-container {
    background: #fffdfd; border-radius: 12px; width: 100%; max-width: 420px; max-height: 80vh;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,94,132,0.1);
    display: flex; flex-direction: column; position: relative;
    background-image: repeating-linear-gradient(transparent, transparent 27px, rgba(229,153,169,0.15) 27px, rgba(229,153,169,0.15) 28px); background-position: 0 40px;
  }
  .letter-header {
    padding: 16px 20px; border-bottom: 1px dashed rgba(229,153,169,0.3); display: flex; justify-content: space-between; align-items: center; background: transparent;
  }

  .close-modal { background: none; border: none; font-size: 24px; color: #a66275; cursor: pointer; padding: 0; line-height: 1; }

  .single-letter { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(0,0,0,0.03); position: relative; }
  .letter-time-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .letter-time { font-family: "Courier New", monospace; font-size: 11px; color: #b08d98; }
  .letter-act-group { display: flex; gap: 8px; align-items: center; }
  .letter-del-btn { background: none; border: none; color: #a66275; font-size: 11px; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all 0.2s; }
  .letter-del-btn:hover { color: #ff5e84; background-color: rgba(255, 94, 132, 0.08); }
  /* 列表里的标星按钮也换成纯粉色星芒 */

  .note-act-btn.star-btn.active { color: #ff5e84; filter: drop-shadow(0 1px 3px rgba(255, 94, 132, 0.45)); }

  /* --- 仿真手账月经日历系统设计 --- */
  .calendar-box { background: #fffdfd; border-radius: 20px; width: 100%; max-width: 440px; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 2.5px solid #000; }

  .calendar-day:hover { background: rgba(229,153,169,0.15); }
  .calendar-day.empty { pointer-events: none; }

  .day-action-popup { display: none; position: absolute; background: rgba(26,18,30,0.95); border-radius: 8px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.25); z-index: 2100; flex-direction: column; gap: 8px; width: 130px; }

</head>

  <button class="day-action-btn cancel-action" onclick="hideDayActionPopup()">取消</button>

<script>
const CODE = {{ code_param | tojson }};
const AVATAR_CHARON = {{ avatar_charon | tojson }};
const AVATAR_USER = {{ avatar_user | tojson }};
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusLabel = document.getElementById('status-label');
const contextMenu = document.getElementById('bubble-menu');
const dayActionPopup = document.getElementById('day-action-popup');

// 日历排盘与月经数据缓存
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let periodRecords = [];
let selectedDateStr = "";

// 长按/右键/双击 触发状态记录
let currentActiveMsgId = null;
let currentActiveRowEl = null;

// 核心功能：原生兼容的双击事件绑定器 (用于全局无按键触发悬浮菜单)
function addDoubleTapListener(element, callback) {
  let lastTap = 0;
  element.addEventListener('click', function(e) {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    if (tapLength < 300 && tapLength > 0) {
      e.preventDefault();
      callback(e);
    }
    lastTap = currentTime;
  });
}

function apiUrl(path) {
  const sep = path.includes('?') ? '&' : '?';
  return CODE ? `${path}${sep}code=${encodeURIComponent(CODE)}` : path;
}

function formatTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return '';
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  return h + ':' + m;
}

function renderMsgRow(role, content, createdAt, pending, msgId) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'charon');
  if (msgId) row.dataset.msgId = msgId;
  if (createdAt) row.dataset.createdAt = createdAt;

  const avatarWrap = document.createElement('div');
  avatarWrap.className = 'avatar-wrapper ' + (role === 'user' ? 'user' : 'charon');

  const tag = document.createElement('span');
  tag.className = 'avatar-tag';
  tag.textContent = role === 'user' ? 'Seraphina' : 'Charon';
  avatarWrap.appendChild(tag);

  const avatar = document.createElement('img');
  avatar.className = 'msg-avatar';
  avatar.src = role === 'user' ? AVATAR_USER : AVATAR_CHARON;
  avatarWrap.appendChild(avatar);

  const star = document.createElement('span');
  star.className = 'star-accent';
  star.textContent = '✦';
  avatarWrap.appendChild(star);

  const d1 = document.createElement('span');
  d1.className = 'dust-star d-1';
  d1.textContent = '✦';
  avatarWrap.appendChild(d1);

  const d2 = document.createElement('span');
  d2.className = 'dust-star d-2';
  d2.textContent = '✦';
  avatarWrap.appendChild(d2);

  row.appendChild(avatarWrap);

  const col = document.createElement('div');
  col.className = 'msg-col';

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'charon') + (pending ? ' pending' : '');
  bubble.textContent = content;
  col.appendChild(bubble);

  const timeRow = document.createElement('div');
  timeRow.className = 'msg-time-row';

  const timeEl = document.createElement('span');
  timeEl.className = 'msg-time';
  timeEl.textContent = formatTime(createdAt);
  timeRow.appendChild(timeEl);

  col.appendChild(timeRow);
  row.appendChild(col);

  // 全新双击触发菜单逻辑（编辑状态下暂停响应，避免编辑时快速点字词被误判成双击唤出菜单）
  addDoubleTapListener(bubble, (e) => {
    if (row.classList.contains('editing')) return;
    currentActiveRowEl = row;
    showContextMenu(bubble, msgId, role, content);
  });

  return row;
}

// 行内编辑模式：气泡变成可编辑文本，旁边冒出"发送/取消"两个小按钮。
// 确认后调用/api/chat-edit-resend，真正做到"编辑这条→截断它之后的所有对话→重新生成回复"，
// 而不是旧版那种"把文字填回输入框，用户再手动发一遍，记录里留下重复消息"的做法。
function enterEditMode(row, bubble, msgId, originalContent) {
  if (row.classList.contains('editing')) return; // 防止双击等重复触发时进入两次编辑态
  row.classList.add('editing');

  bubble.contentEditable = 'true';
  bubble.classList.add('editing-bubble');
  bubble.focus();
  // 光标定位到文本末尾，而不是全选或停在开头，编辑体验更符合直觉
  const range = document.createRange();
  range.selectNodeContents(bubble);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  const actionBar = document.createElement('div');
  actionBar.className = 'edit-action-bar';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'edit-action-btn cancel';
  cancelBtn.textContent = '取消';

  const sendBtn = document.createElement('button');
  sendBtn.className = 'edit-action-btn send';
  sendBtn.textContent = '发送';

  actionBar.appendChild(cancelBtn);
  actionBar.appendChild(sendBtn);
  row.querySelector('.msg-col').appendChild(actionBar);

  function exitEditMode(restoreContent) {
    bubble.contentEditable = 'false';
    bubble.classList.remove('editing-bubble');
    if (restoreContent !== undefined) bubble.textContent = restoreContent;
    actionBar.remove();
    row.classList.remove('editing');
  }

  cancelBtn.onclick = () => exitEditMode(originalContent);

  sendBtn.onclick = async () => {
    // contenteditable换行后浏览器可能插入<div>/<br>而不是纯文本\n，textContent会把这些
    // 换行结构压没；先把<br>和块级换行统一转成\n，再取纯文本，避免多行内容被拼成一行。
    const rawHtml = bubble.innerHTML.replace(/<div>/gi, '\n').replace(/<\/div>/gi, '').replace(/<br\s*\/?>/gi, '\n');
    const tempEl = document.createElement('div');
    tempEl.innerHTML = rawHtml;
    const newContent = tempEl.textContent.trim();
    if (!newContent) { exitEditMode(originalContent); return; }
    if (newContent === originalContent) { exitEditMode(); return; }

    sendBtn.disabled = true;
    cancelBtn.disabled = true;
    bubble.contentEditable = 'false';
    bubble.classList.remove('editing-bubble');
    bubble.classList.add('pending');

    try {
      const res = await fetch(apiUrl('/api/chat-edit-resend'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: msgId, new_content: newContent })
      });
      const data = await res.json();
      if (!data.ok) {
        alert('编辑失败：' + (data.error || '未知错误'));
        exitEditMode(originalContent);
        return;
      }
      // 成功：这条消息文字定格为新内容；它之后的所有消息（不管是这一轮的旧回复，
      // 还是编辑点之后用户又追加发过的任何内容）从视图里一并移除，插入新的Charon回复，
      // 对话真正收束到编辑的这个点，不会留下任何重复或残留。
      bubble.textContent = newContent;
      bubble.classList.remove('pending');
      actionBar.remove();
      row.classList.remove('editing');

      let sibling = row.nextSibling;
      while (sibling) {
        const toRemove = sibling;
        sibling = sibling.nextSibling;
        toRemove.remove();
      }

      messagesEl.appendChild(renderMsgRow('charon', data.reply, new Date().toISOString(), false, data.charon_msg_id));
      scrollToBottom();
      loadStatus();
    } catch (e) {
      alert('网络错误，编辑重发失败');
      exitEditMode(originalContent);
    }
  };
}

// 全局上下文菜单管理 (双击唤出)
function showContextMenu(targetElement, id, typeOrRole, textContent = "") {
  const rect = targetElement.getBoundingClientRect();
  // 先在不可见状态下重建内容并测量尺寸，避免"旧位置菜单闪现→跳到新位置"这个中间态被误触，
  // 这正是"要点两次才生效"的卡顿感来源：第一次点击其实点在了闪现的旧位置上。
  contextMenu.style.visibility = 'hidden';
  contextMenu.style.display = 'flex';
  contextMenu.innerHTML = '';
  if (typeOrRole === 'user' || typeOrRole === 'charon') {
    // ---- 聊天气泡专属双击选项 ----
    const copyBtn = document.createElement('button');
    copyBtn.className = 'menu-btn';
    copyBtn.textContent = '📄 复制';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(textContent).then(() => hideWeChatMenu());
    };
    contextMenu.appendChild(copyBtn);

    if (id) {
      if (typeOrRole === 'user') {
        const editBtn = document.createElement('button');
        editBtn.className = 'menu-btn';
        editBtn.textContent = '✍️ 重新编辑';
        editBtn.onclick = () => {
          if (currentActiveRowEl) {
            const bubbleEl = currentActiveRowEl.querySelector('.bubble');
            if (bubbleEl) enterEditMode(currentActiveRowEl, bubbleEl, id, textContent);
          }
          hideWeChatMenu();
        };
        contextMenu.appendChild(editBtn);
      } else if (typeOrRole === 'charon') {
        const regenBtn = document.createElement('button');
        regenBtn.className = 'menu-btn';
        regenBtn.textContent = '🔄 重新生成';
        regenBtn.onclick = () => {
          if (currentActiveRowEl) regenerateMessage(id, currentActiveRowEl);
          hideWeChatMenu();
        };
        contextMenu.appendChild(regenBtn);
      }

      const recallBtn = document.createElement('button');
      recallBtn.className = 'menu-btn';
      recallBtn.textContent = '🗑️ 撤回';
      recallBtn.onclick = () => {
        if (currentActiveRowEl) deleteMessage(id, currentActiveRowEl);
        hideWeChatMenu();
      };
      contextMenu.appendChild(recallBtn);
    }
  } else if (typeOrRole === 'desk-note') {
    // ---- 桌面便签专属双击选项 ----
    const moveBtn = document.createElement('button');
    moveBtn.className = 'menu-btn';
    moveBtn.textContent = '📥 移入抽屉';
    moveBtn.onclick = () => { moveNote(id, 'drawer', 'desk'); hideWeChatMenu(); };
    contextMenu.appendChild(moveBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'menu-btn';
    delBtn.textContent = '🗑️ 撕掉丢弃';
    delBtn.onclick = () => {
      // 物理撕下并揉碎动画
      targetElement.style.transition = 'all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1)';
      targetElement.style.transform = 'translateY(60px) scale(0.7) rotate(20deg)';
      targetElement.style.opacity = '0';
      setTimeout(() => { deleteNote(id, 'desk'); }, 400);
      hideWeChatMenu();
    };
    contextMenu.appendChild(delBtn);
  }

  // 内容已重建完毕，用requestAnimationFrame等浏览器完成一次布局计算后再测量尺寸，
  // 这样offsetWidth/offsetHeight才是本次菜单内容真正的尺寸，不会拿到上一次残留的值。
  requestAnimationFrame(() => {
    const menuWidth = contextMenu.offsetWidth || 200;
    const menuHeight = contextMenu.offsetHeight || 34;
    contextMenu.style.left = (rect.left + rect.width / 2 - menuWidth / 2 + window.scrollX) + 'px';
    contextMenu.style.top = (rect.top - menuHeight - 8 + window.scrollY) + 'px';
    contextMenu.style.visibility = 'visible';
  });
}

function hideWeChatMenu() { contextMenu.style.display = 'none'; contextMenu.style.visibility = 'visible'; }

document.addEventListener('click', (e) => {
  if (!e.target.closest('.bubble') && !e.target.closest('.sticky-note-card') && !e.target.classList.contains('menu-btn')) {
    hideWeChatMenu();
  }
  if (!e.target.classList.contains('calendar-day') && !e.target.classList.contains('day-action-btn')) {
    hideDayActionPopup();
  }
});

async function deleteMessage(msgId, rowEl) {
  // 点击菜单里的"撤回"本身已经是一次明确的决定动作，原生confirm()是多余的二次确认，
  // 且原生弹窗的黑白系统样式跟整体视觉风格不搭，去掉后操作会干脆很多。
  try {
    const res = await fetch(apiUrl('/api/chat-delete'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: msgId })
    });
    const data = await res.json();
    if (data.ok) { rowEl.remove(); loadStatus(); } 
    else { alert('撤回失败：' + (data.error || '未知错误')); }
  } catch (e) { alert('网络错误，无法撤回'); }
}

async function regenerateMessage(msgId, rowEl) {
  const bubble = rowEl.querySelector('.bubble');
  const originalText = bubble ? bubble.textContent : '';
  const createdAt = rowEl.dataset.createdAt || new Date().toISOString();
  if (bubble) { bubble.textContent = '…'; bubble.classList.add('pending'); }
  try {
    const res = await fetch(apiUrl('/api/chat-regenerate'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: msgId })
    });
    const data = await res.json();
    if (data.ok) {
      rowEl.replaceWith(renderMsgRow('charon', data.reply, createdAt, false, msgId));
      loadStatus();
    } else {
      if (bubble) { bubble.textContent = originalText; bubble.classList.remove('pending'); }
      alert('重新生成失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    if (bubble) { bubble.textContent = originalText; bubble.classList.remove('pending'); }
    alert('网络错误，重新生成失败');
  }
}

function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

// 历史消息分页：oldestLoadedAt记录当前已加载的最早一条消息的created_at，
// 上滑到顶部时拿它作为before参数去要更早的一页；hasMoreHistory是后端给的提示，
// 到底了就不再触发请求，避免用户在顶端反复滚动时发送大量空查询。
let oldestLoadedAt = null;
let hasMoreHistory = true;
let isLoadingMoreHistory = false;

async function loadHistory() {
  try {
    const res = await fetch(apiUrl('/api/chat-messages'));
    const data = await res.json();
    messagesEl.innerHTML = '';
    if (!data.ok) { messagesEl.innerHTML = '<div id="empty-hint">加载失败</div>'; return; }
    if (!data.messages || data.messages.length === 0) { messagesEl.innerHTML = '<div id="empty-hint">还没有聊过，说点什么吧</div>'; return; }
    data.messages.forEach(m => messagesEl.appendChild(renderMsgRow(m.role, m.content, m.created_at, false, m.id)));
    oldestLoadedAt = data.messages[0].created_at;
    hasMoreHistory = !!data.has_more;
    scrollToBottom();
  } catch (e) { messagesEl.innerHTML = '<div id="empty-hint">网络错误</div>'; }
}

// 上滑到顶部时调用：取比oldestLoadedAt更早的一页，插到消息列表最前面。
// 插入前先记住当前滚动位置对应的"内容高度"，插入后把scrollTop往下补偿同样的增量，
// 这样视口里正看着的那几条消息不会因为顶部突然多出内容而跳来跳去。
async function loadMoreHistory() {
  if (isLoadingMoreHistory || !hasMoreHistory || !oldestLoadedAt) return;
  isLoadingMoreHistory = true;
  try {
    const res = await fetch(apiUrl(`/api/chat-messages?before=${encodeURIComponent(oldestLoadedAt)}`));
    const data = await res.json();
    if (!data.ok || !data.messages || data.messages.length === 0) {
      hasMoreHistory = false;
      return;
    }
    const prevScrollHeight = messagesEl.scrollHeight;
    const frag = document.createDocumentFragment();
    data.messages.forEach(m => frag.appendChild(renderMsgRow(m.role, m.content, m.created_at, false, m.id)));
    messagesEl.insertBefore(frag, messagesEl.firstChild);
    messagesEl.scrollTop += (messagesEl.scrollHeight - prevScrollHeight);
    oldestLoadedAt = data.messages[0].created_at;
    hasMoreHistory = !!data.has_more;
  } catch (e) {
    // 静默失败：下次滚动到顶部会自然重试，不用打断阅读体验弹提示
  } finally {
    isLoadingMoreHistory = false;
  }
}

// 滚动到接近顶部（40px阈值，留点余量避免刚好卡在0时抖动触发不了）就尝试加载更早的消息
messagesEl.addEventListener('scroll', () => {
  if (messagesEl.scrollTop < 40) loadMoreHistory();
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---- 便签相关的操作与数据同步函数 ----
async function deleteNote(id, sourceStr = "desk") {
  // 本地直接移除对应卡片，不再等后端返回后重新拉整个列表——这才是"丢弃便签"反应慢的
  // 主要原因：以前是"等写入完成→再整表重新查询→重新渲染"两轮网络往返，现在只有一次写入请求，
  // 界面即时响应。
  const card = document.getElementById(`drawer-note-card-${id}`) || document.getElementById(`archive-note-card-${id}`);
  if (card) card.remove();
  try {
    const res = await fetch(apiUrl('/api/sticky-notes/delete'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id })
    });
    const data = await res.json();
    if (!data.ok) alert('丢弃失败：' + (data.error || '未知错误'));
    if (sourceStr === "desk") loadStatus();
  } catch (e) { alert('网络错误，丢弃失败'); }
}

async function moveNote(id, targetStatus, sourceStr) {
  // 同样做本地即时移除：移动的本质是"从当前列表消失"，不需要为了这个去重新拉全量数据。
  const card = document.getElementById(`drawer-note-card-${id}`) || document.getElementById(`archive-note-card-${id}`);
  if (card) card.remove();
  try {
    const res = await fetch(apiUrl('/api/sticky-notes/move'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, target_status: targetStatus })
    });
    const data = await res.json();
    if (data.ok) {
      if (data.target_full) alert(`已成功移入！当前${targetStatus === 'drawer' ? '便签抽屉' : '档案箱'}容量已满，记得及时清理哦！`);
      if (sourceStr === "desk") loadStatus();
    } else {
      alert('移动失败：' + (data.error || '未知错误'));
    }
  } catch(e) { alert('网络错误，移动便签失败'); }
}

async function starNote(id, isStarredNow, sourceStr) {
  // 乐观更新：不等后端返回就先把当前按钮的图标/状态切换过去，
  // 网络请求在背后悄悄发；失败了再退回原状态。避免"点一下要等一轮网络往返+整表重绘"的迟钝感。
  const btn = document.querySelector(`.star-btn[onclick*="starNote(${id},"]`)
    || document.querySelector(`.star-btn[onclick*="starLetter(${id},"]`);
  const newStarred = !isStarredNow;
  if (btn) {
    btn.textContent = newStarred ? '★' : '☆';
    btn.classList.toggle('active', newStarred);
    btn.setAttribute('onclick', `starNote(${id}, ${newStarred}, '${sourceStr}')`);
  }
  try {
    const res = await fetch(apiUrl('/api/sticky-notes/star'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, is_starred: newStarred })
    });
    const data = await res.json();
    if (!data.ok && btn) {
      // 后端拒绝了，退回原状态
      btn.textContent = isStarredNow ? '★' : '☆';
      btn.classList.toggle('active', isStarredNow);
      btn.setAttribute('onclick', `starNote(${id}, ${isStarredNow}, '${sourceStr}')`);
    }
  } catch(e) {
    if (btn) {
      btn.textContent = isStarredNow ? '★' : '☆';
      btn.classList.toggle('active', isStarredNow);
      btn.setAttribute('onclick', `starNote(${id}, ${isStarredNow}, '${sourceStr}')`);
    }
    alert('网络错误，星标可能没有保存成功');
  }
}

// 仿真手账 5种纯色底色与5种纹理的随机碰撞算法
function getPersonalizedStyle(id, index) {
  const colors = [
    { bg: '#ffe3e7', grad: '#ffd1d7', text: '#7a5a65', name: 'sakura' },  // 樱花粉
    { bg: '#e8f5e9', grad: '#d4eed8', text: '#4e5a50', name: 'mint' },    // 薄荷绿
    { bg: '#fffde7', grad: '#fff9c4', text: '#6b6450', name: 'cream' },   // 奶油黄
    { bg: '#e3f2fd', grad: '#bbdefb', text: '#455160', name: 'sky' },     // 天蓝色
    { bg: '#efebe9', grad: '#d7ccc8', text: '#5c443f', name: 'coffee' }   // 奶咖色
  ];
  
  const color = colors[id % 5];
  let bgStyle = '';
  
  const textureType = index % 5;
  if (textureType === 0) {
    // 1. Polka-dots
    bgStyle = `background: radial-gradient(circle, rgba(255, 255, 255, 0.45) 15%, transparent 15.5%), radial-gradient(circle, rgba(255, 255, 255, 0.45) 15%, transparent 15.5%), ${color.bg}; background-size: 8px 8px, 8px 8px; background-position: 0 0, 4px 4px;`;
  } else if (textureType === 1) {
    // 2. Horizontal Lines
    bgStyle = `background: repeating-linear-gradient(transparent, transparent 15px, rgba(90, 69, 80, 0.05) 15px, rgba(90, 69, 80, 0.05) 16px), ${color.bg}; background-position: 0 0;`;
  } else if (textureType === 2) {
    // 3. Grid/Plaid
    bgStyle = `background: repeating-linear-gradient(transparent, transparent 15px, rgba(90, 69, 80, 0.04) 15px, rgba(90, 69, 80, 0.04) 16px), repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(90, 69, 80, 0.04) 15px, rgba(90, 69, 80, 0.04) 16px), ${color.bg};`;
  } else if (textureType === 3) {
    // 4. Solid Color
    bgStyle = `background: ${color.bg};`;
  } else {
    // 5. Gradient
    bgStyle = `background: linear-gradient(135deg, ${color.bg} 0%, ${color.grad} 100%);`;
  }
  
  return { bgStyle: bgStyle, textColor: color.text };
}

// ---- 加载状态 (Desk & 堆叠便签 & 警告判定) ----
async function loadStatus() {
  try {
    const res = await fetch(apiUrl('/api/chat-status'));
    const data = await res.json();
    if (!data.ok) return;

    statusLabel.textContent = data.status_label || '在线';
    document.getElementById('status-dot').className = 'status-dot' + (data.mood_score < 50 ? ' low' : '');

    // 渲染桌面仿真层叠流便签 (微小重叠，自然流式排版，不挡文字)
    const container = document.getElementById('sticky-container');
    container.innerHTML = '';
    
    if (data.sticky_notes && data.sticky_notes.length > 0) {
      const isDeskFull = data.desk_full;

      data.sticky_notes.forEach((note, index) => {
        const card = document.createElement('div');
        card.className = `sticky-note-card`;

        // 自然手写纸错落效果：用更强的位运算哈希打散便签id，避免连续id（1,2,3...）
        // 算出的随机值也是线性递增/顺拐的问题——之前用简单同余公式时，连续id的偏移量会平滑递增，
        // 视觉上所有便签都往同一边斜，现在换成位混合哈希，让角度和位移都能真正交替、忽左忽右。
        function hashNoteId(n, salt) {
          n = (n ^ salt) >>> 0;
          n = Math.imul(n ^ (n >>> 16), 0x45d9f3b) >>> 0;
          n = Math.imul(n ^ (n >>> 16), 0x45d9f3b) >>> 0;
          n = (n ^ (n >>> 16)) >>> 0;
          return n % 1000;
        }
        const h1 = hashNoteId(note.id, 0);
        const h2 = hashNoteId(note.id, 7919);
        const rotateDeg = ((h1 / 1000) * 10 - 5).toFixed(1);   // -5° ~ 5°，正负交替更明显
        const shiftX = ((h2 / 1000) * 32 - 16).toFixed(1);      // -16px ~ 16px，左右都会明显偏移
        card.style.transform = `rotate(${rotateDeg}deg) translateX(${shiftX}px)`;
        card.style.margin = index === 0 ? '0 auto' : '-27px auto 0'; // 横向居中收窄后，靠auto margin保持基准位置，再叠加transform做左右错落
        card.style.zIndex = 15 - index;
        
        // 动态注入 5x5 的个生化手账底纹色
        const styleObj = getPersonalizedStyle(note.id, index);
        card.style.cssText += styleObj.bgStyle;
        card.style.color = styleObj.textColor;

        // 桌面满警告
        if (isDeskFull) {
          card.style.boxShadow = '0 0 15px rgba(255, 94, 132, 0.4), inset 0 0 0 1px rgba(255,255,255,1)';
        }

        const starIcon = note.is_starred ? '★' : '☆';
        const starClass = note.is_starred ? 'active' : '';

        // 彻底清空杂乱图标，只在右下角保留一个荧光樱花粉标星按钮
        card.innerHTML = `
          <div class="sticky-note-text" style="color: ${styleObj.textColor};">${escapeHtml(note.message)}</div>
          <button class="note-star-btn ${starClass}" onclick="event.stopPropagation(); starNote(${note.id}, ${note.is_starred}, 'desk')" title="标星收藏">${starIcon}</button>
        `;

        // 绑定双击触发微信风格悬浮撕毁/整理菜单
        addDoubleTapListener(card, (e) => {
          showContextMenu(card, note.id, "desk-note");
        });

        container.appendChild(card);
      });
    } else {
      container.innerHTML = `
        <div class="sticky-note-card" style="transform: rotate(-1deg); position: relative; margin: 0 auto;">
          <div class="sticky-note-text" style="color:#b08d98; text-align:center;">桌面空空的，TA还没有新的留言。</div>
        </div>
      `;
    }

    // 抽屉容量与霓虹红框警报
    const notesBtn = document.getElementById('drawer-notes-btn');
    const lettersBtn = document.getElementById('drawer-letters-btn');
    
    fetch(apiUrl('/api/sticky-notes?status=drawer')).then(res=>res.json()).then(d => {

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = ''; inputEl.style.height = 'auto'; sendBtn.disabled = true;

  const nowIso = new Date().toISOString();
  const userRow = renderMsgRow('user', text, nowIso, false);
  messagesEl.appendChild(userRow);
  const pendingRow = renderMsgRow('charon', '…', nowIso, true);
  messagesEl.appendChild(pendingRow);
  scrollToBottom();

  const pendingBubble = pendingRow.querySelector('.bubble');

  try {
    const res = await fetch(apiUrl('/api/chat-send'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    if (data.ok) {
      pendingBubble.textContent = data.reply; pendingBubble.classList.remove('pending');
      userRow.replaceWith(renderMsgRow('user', text, nowIso, false, data.user_msg_id));
      pendingRow.replaceWith(renderMsgRow('charon', data.reply, nowIso, false, data.charon_msg_id));
    } else {
      pendingBubble.textContent = '（没能回复：' + (data.error || '未知错误') + '）';
      pendingBubble.classList.remove('pending');
    }
  } catch (e) {
    pendingBubble.textContent = '（网络错误，没发出去）'; pendingBubble.classList.remove('pending');
  }
  scrollToBottom(); sendBtn.disabled = false; loadStatus();
}

async function starLetter(id, isStarredNow, sourceStr) {
  const btn = document.querySelector(`.star-btn[onclick*="starLetter(${id},"]`);
  const newStarred = !isStarredNow;
  if (btn) {
    btn.textContent = newStarred ? '★' : '☆';
    btn.classList.toggle('active', newStarred);
    btn.setAttribute('onclick', `starLetter(${id}, ${newStarred}, '${sourceStr}')`);
  }
  try {
    const res = await fetch(apiUrl('/api/love-letters/star'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, is_starred: newStarred })
    });
    const data = await res.json();
    if (!data.ok && btn) {
      btn.textContent = isStarredNow ? '★' : '☆';
      btn.classList.toggle('active', isStarredNow);
      btn.setAttribute('onclick', `starLetter(${id}, ${isStarredNow}, '${sourceStr}')`);
    }
  } catch(e) {
    if (btn) {
      btn.textContent = isStarredNow ? '★' : '☆';
      btn.classList.toggle('active', isStarredNow);
      btn.setAttribute('onclick', `starLetter(${id}, ${isStarredNow}, '${sourceStr}')`);
    }
    alert('网络错误，星标可能没有保存成功');
  }
}

// ---- 日历逻辑略 (保持上一版本完美不变) ----
// ==========================================
async function openPeriodCalendar() {
  document.getElementById('calendar-modal').style.display = 'flex';
  await fetchPeriodData(currentYear);
}
function closePeriodCalendar() {
  document.getElementById('calendar-modal').style.display = 'none';

async function fetchPeriodData(year) {
  try {
    const res = await fetch(apiUrl(`/api/period/calendar?year=${year}`));
    const data = await res.json();
    if (data.ok) {
      periodRecords = data.records;
      renderCalendarGrid();
    }
  } catch(e) {}
}

function renderCalendarGrid() {
  const grid = document.getElementById('calendar-days-grid');
  const title = document.getElementById('calendar-month-year');
  grid.innerHTML = '';

  title.textContent = `${currentYear}年${currentMonth + 1}月`;

  const firstDay = new Date(currentYear, currentMonth, 1);
  let dayOfWeek = firstDay.getDay(); 
  dayOfWeek = (dayOfWeek === 0) ? 6 : dayOfWeek - 1; 

  const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

  for (let i = 0; i < dayOfWeek; i++) {
    const span = document.createElement('span');
    span.className = 'calendar-day empty';
    grid.appendChild(span);
  }

  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

  for (let day = 1; day <= totalDays; day++) {
    const dayBtn = document.createElement('span');
    dayBtn.className = 'calendar-day';
    dayBtn.textContent = day;

    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    
    if (dateStr === todayStr) dayBtn.classList.add('today-marker');

    periodRecords.forEach(record => {
      const start = record.start_date;
      const end = record.end_date;
      if (start) {
        if (end) {
          if (dateStr >= start && dateStr <= end) dayBtn.classList.add('period-active');
        } else {
          if (dateStr >= start && dateStr <= todayStr) dayBtn.classList.add('period-active');
          if (dateStr === start) dayBtn.classList.add('period-ongoing');
        }
      }
    });

    dayBtn.onclick = (e) => {
      e.stopPropagation();
      selectedDateStr = dateStr;
      showDayActionPopup(dayBtn);
    };
    grid.appendChild(dayBtn);
  }
}

function prevMonth() {
  if (currentMonth === 0) { currentMonth = 11; currentYear--; fetchPeriodData(currentYear); } 
  else { currentMonth--; renderCalendarGrid(); }
}
function nextMonth() {
  if (currentMonth === 11) { currentMonth = 0; currentYear++; fetchPeriodData(currentYear); } 
  else { currentMonth++; renderCalendarGrid(); }
}

function showDayActionPopup(dayBtn) {
  const rect = dayBtn.getBoundingClientRect();
  dayActionPopup.style.display = 'flex';
  dayActionPopup.style.left = (rect.left + rect.width/2 - 65 + window.scrollX) + 'px';
  dayActionPopup.style.top = (rect.top - 110 + window.scrollY) + 'px';
  document.getElementById('popup-start-btn').onclick = () => savePeriodDate('start');
  document.getElementById('popup-end-btn').onclick = () => savePeriodDate('end');
}

function hideDayActionPopup() { dayActionPopup.style.display = 'none'; }

// 部分模型id显示成更短的名字，下拉框空间有限，纯技术名太长会被截断；没在这里配置的模型会直接显示原始id
const MODEL_DISPLAY_NAME = {
  'gemai-gpt-4o-mini': 'gpt-4o-mini',
  'gemai-gpt-4.1-mini': 'gpt-4.1-mini',
  'gemai-gpt-5-mini': 'gpt-5-mini',
  'gemai-gemini-2.5-flash-a': 'gemini-2.5-flash(满血A)',
  'gemai-gemini-2.5-pro-a': 'gemini-2.5-pro(满血A)',
  'gemai-gemini-2.5-pro-d': 'gemini-2.5-pro(满血D)',
  'gemai-gemini-3.1-pro': 'gemini-3.1-pro-preview',
  'gemai-gemini-3.1-pro-thinking': 'gemini-3.1-pro-thinking-128(满血A)',
  'gemai-grok-4': 'grok-4'
};
async function loadModelSelector() {
  try {
    const res = await fetch(apiUrl('/api/chat-model'));
    const data = await res.json();
    if (!data.ok) return;
    modelSelect.innerHTML = '';
    // model_health: 每个模型最近的健康状态。healthy=false说明最近连续失败次数够多，
    // 大概率是这个渠道挂了。用emoji加在名字前面（原生select的option不支持自定义颜色/图标，
    // emoji是唯一能跨浏览器稳定显示的办法）：✅正常 ⚠️最近老失败，选它之前心里有数。
    const health = data.model_health || {};
    data.available_models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      const label = MODEL_DISPLAY_NAME[m] || m;
      const h = health[m];
      const dot = h && h.healthy === false ? '⚠️ ' : '✅ ';
      opt.textContent = dot + label;
      if (h && h.healthy === false && h.last_error) {
        // title属性：鼠标悬停能看到具体失败原因，不用跳去别的地方查
        opt.title = '最近失败：' + h.last_error;
      }
      if (m === data.current_model) opt.selected = true;
      modelSelect.appendChild(opt);
    });
  } catch (e) {}
}
modelSelect.addEventListener('change', async () => {
  const chosen = modelSelect.value;
  try {
    const res = await fetch(apiUrl('/api/chat-model'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: chosen })
    });
    const data = await res.json();
    if (!data.ok) { alert('切换失败：' + (data.error || '未知错误')); loadModelSelector(); }
  } catch (e) { alert('网络错误'); loadModelSelector(); }
});

// 手机端自适应 Tab 切换逻辑
function switchTab(tabName) {
  const appEl = document.getElementById('app');
  appEl.classList.remove('tab-chat', 'tab-desk');
  appEl.classList.add('tab-' + tabName);

  document.querySelectorAll('.tab-item').forEach(item => { item.classList.remove('active'); });
  if (window.event && window.event.currentTarget) {
    window.event.currentTarget.classList.add('active');
  } else {
    const indexMap = {'chat': 0, 'desk': 1};
    document.querySelectorAll('.tab-item')[indexMap[tabName]].classList.add('active');
  }
  if (tabName === 'chat') scrollToBottom();
}
if (window.innerWidth <= 768) { document.getElementById('app').classList.add('tab-chat'); }

loadHistory();
loadStatus();
loadModelSelector();
// 每2分钟刷新一次模型菜单，让健康状态（哪个模型最近失败了）保持新鲜，
// 不用你手动刷新页面才能看到最新的红绿点状态。
setInterval(loadModelSelector, 120000);

// ---- Web Push 订阅 ----
// urlBase64转Uint8Array：pushManager.subscribe()要求applicationServerKey是这个格式，
// 而后端给的VAPID公钥是urlsafe-base64字符串，这一步是标准转换写法。
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function setupPushNotifications() {
  // 必要条件都不满足就直接跳过，不报错打扰用户：
  // 1) 浏览器得支持service worker和push  2) 得是https或localhost  3) 得是"添加到主屏幕"后独立打开的PWA
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

  try {
    const registration = await navigator.serviceWorker.register('/service-worker.js');

    if (Notification.permission === 'denied') return; // 用户明确拒绝过，不再打扰

    let subscription = await registration.pushManager.getSubscription();
    if (subscription) return; // 已经订阅过，不用重复走一遍

    // 还没订阅、权限也还没明确granted：露出小铃铛按钮，等用户主动点击再触发权限请求
    // （iOS要求权限请求必须由用户手势触发，不能页面一加载就自动弹窗）
    const btn = document.getElementById('push-enable-btn');
    if (btn) btn.style.display = 'block';

    if (Notification.permission === 'granted') {
      await subscribeToPush(registration);
      if (btn) btn.style.display = 'none';
    }
  } catch (e) {
    console.warn('Service worker注册失败', e);
  }
}

async function subscribeToPush(registration) {
  try {
    const keyRes = await fetch(apiUrl('/api/push/vapid-public-key'));
    const keyData = await keyRes.json();
    if (!keyData.ok) return;

    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(keyData.public_key)
    });

    await fetch(apiUrl('/api/push/subscribe'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(subscription.toJSON())
    });
  } catch (e) {
    console.warn('订阅推送失败', e);
  }
}

// 手动触发入口：iOS要求权限请求必须由用户点击触发，不能页面一加载就自动弹窗。
// 挂在window上，方便你在页面上加一个"开启通知"按钮时直接调用 enablePushNotifications()。
window.enablePushNotifications = async function() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('当前浏览器不支持推送通知');
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      alert('未授权通知权限，无法开启推送');
      return;
    }
    const registration = await navigator.serviceWorker.ready;
    await subscribeToPush(registration);
    const btn = document.getElementById('push-enable-btn');
    if (btn) btn.style.display = 'none';
    alert('推送通知已开启');
  } catch (e) {
    alert('开启失败：' + e.message);
  }
};

setupPushNotifications();
</script>
