<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Charon</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/app_icon_192.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Charon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: radial-gradient(circle at 10% 20%, #fffcfd 0%, #fbf3f5 35%, #f3e2e6 70%, #ebd3d9 100%);
    background-attachment: fixed;
    font-family: "Songti SC", "STSong", Georgia, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    color: #5a4550;
    overflow: hidden;
  }

  /* ---- 基础布局系统（PC / Desktop 默认） ---- */
  #app {
    display: flex;
    height: 100vh; height: 100dvh;
    padding: 14px;
    gap: 14px;
    position: relative;
    z-index: 2;
  }

  /* ---- 左侧波点玻璃舱导航栏 (PC) ---- */
  #nav {
    width: 60px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px 0;
    background: rgba(255, 238, 241, 0.6);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px 0 rgba(184, 118, 138, 0.08);
  }
  #nav::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, #000000 0%, #000000 20%, #c0b8c0 30%, #ffffff 40%, #ffffff 60%, #c0b8c0 80%, #000000 100%);
    -webkit-mask-image: 
      radial-gradient(circle, #000 24%, transparent 24.5%),
      radial-gradient(circle, #000 24%, transparent 24.5%);
    -webkit-mask-size: 22px 22px; 
    -webkit-mask-position: 0 0, 11px 11px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.85;
  }
  
  /* ---- 导航与工具按钮统一视觉 ---- */
  .nav-icon, #send-btn, .tool-btn {
    position: relative;
    z-index: 1;
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: none !important;
    background: 
      radial-gradient(circle, rgba(255, 143, 163, 0.22) 15%, transparent 15.5%),
      radial-gradient(circle, rgba(255, 143, 163, 0.22) 15%, transparent 15.5%),
      rgba(255, 255, 255, 0.95) !important;
    background-size: 6px 6px, 6px 6px, 100% 100% !important;
    background-position: 0 0, 3px 3px, 0 0 !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #ff8fa3 !important;
    text-decoration: none;
    transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08) !important;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .nav-icon svg, .tool-btn svg { width: 20px; height: 20px; stroke-width: 1.5px; }
  .nav-icon:hover, #send-btn:hover, .tool-btn:hover {
    transform: translateY(-2px) scale(1.05);
    background-color: rgba(255, 255, 255, 0.98) !important;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12) !important; 
  }
  .nav-icon:active, #send-btn:active, .tool-btn:active { 
    transform: translateY(0) scale(0.95); 
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05) !important;
  }
  #send-btn svg { width: 17px; height: 17px; stroke-width: 1.6px; transform: rotate(-10deg) translate(-1px, 1px); }
  #send-btn:disabled { opacity: 0.5; filter: grayscale(50%); cursor: default; }

  /* ---- 中间玻璃舱对话区 ---- */
  #main {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border-radius: 28px; box-shadow: 0 12px 40px rgba(184, 118, 138, 0.10); overflow: hidden; position: relative;
  }
  #main::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%), radial-gradient(rgba(255, 255, 255, 0.4) 15%, transparent 15.5%);
    background-size: 10px 10px; background-position: 0 0, 5px 5px; pointer-events: none; z-index: 0;
  }
  
  /* ---- 渐变 Header ---- */
  #header {
    padding: 16px 22px; border-bottom: 1px solid rgba(255, 255, 255, 0.2); flex-shrink: 0;
    display: flex; align-items: center; gap: 14px; position: relative;
    background: linear-gradient(to right, #000000 0%, #000000 52%, rgba(26, 18, 30, 0.9) 62%, #cf7d90 85%, #ffb3c1 100%);
    z-index: 10;
  }
  #header::before {
    content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 65%;
    background-image: radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%), radial-gradient(rgba(255, 255, 255, 0.28) 15%, transparent 15.5%);
    background-size: 11px 11px; background-position: 0 0, 5.5px 5.5px;
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%); pointer-events: none; z-index: 0;
  }
  
  .avatar-wrapper { position: relative; display: inline-block; width: 36px; height: 36px; flex-shrink: 0; cursor: pointer; }
  .avatar-wrapper.header-avatar-wrap { width: 44px; height: 44px; }
  .avatar-wrapper .msg-avatar, .avatar-wrapper #header-avatar {
    border: 1.5px solid #ffffff; box-shadow: 0 0 8px rgba(255, 255, 255, 0.6); 
  }
  .avatar-wrapper .star-accent { position: absolute; font-size: 15px; pointer-events: none; user-select: none; animation: star-pulse 2s infinite ease-in-out; }
  .avatar-wrapper.charon .star-accent { top: -6px; left: -6px; color: #000000; text-shadow: 0 0 4px #000000, 0 0 10px rgba(0, 0, 0, 0.95); }
  .avatar-wrapper.user .star-accent { top: -6px; right: -6px; color: #ffb3c1; text-shadow: 0 0 4px #ff5e84, 0 0 10px rgba(255, 94, 132, 0.95); }
  .avatar-wrapper .dust-star { position: absolute; pointer-events: none; user-select: none; color: #ffffff; text-shadow: 0 0 5px rgba(255, 255, 255, 0.8); }
  .avatar-wrapper.charon .dust-star.d-1 { bottom: -4px; right: -4px; font-size: 9px; opacity: 0.8; }
  .avatar-wrapper.charon .dust-star.d-2 { top: 14px; right: -7px; font-size: 8px; opacity: 0.6; }
  .avatar-wrapper.user .dust-star.d-1 { bottom: -4px; left: -4px; font-size: 9px; opacity: 0.8; }
  .avatar-wrapper.user .dust-star.d-2 { top: 14px; left: -7px; font-size: 8px; opacity: 0.6; }
  @keyframes star-pulse { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.15); opacity: 1; } }
  
  .avatar-tag {
    position: absolute; font-family: "Dancing Script", cursive; font-size: 11px; white-space: nowrap; pointer-events: none; user-select: none; z-index: 2;
  }
  .avatar-wrapper.charon .avatar-tag { top: -15px; left: 50%; transform: translateX(-50%); color: #5a4550; text-shadow: 0 0 4px rgba(255, 255, 255, 0.8); }
  .avatar-wrapper.user .avatar-tag { top: -15px; left: 50%; transform: translateX(-50%); color: #cf7d90; text-shadow: 0 0 4px rgba(255, 255, 255, 0.8); }

  #header-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  #header-text { position: relative; z-index: 1; min-width: 0; }
  #header .brand {
    font-family: "Georgia", "Songti SC", serif; font-size: 24px; font-style: italic; letter-spacing: 3px; color: #e599a9; font-weight: 500; line-height: 1.2; text-transform: uppercase;
    text-shadow: 0 0 10px rgba(229, 153, 169, 0.8), 0 0 20px rgba(229, 153, 169, 0.4);
  }
  #header .sub { font-size: 11px; color: rgba(255, 255, 255, 0.7); letter-spacing: 1px; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .status-badge { background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.25); padding: 1px 7px; border-radius: 5px; font-size: 10px; color: #ffffff; display: inline-flex; align-items: center; gap: 4px; }
  #model-select { font-size: 10px; color: #fff; background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 5px; padding: 1px 4px; max-width: 140px; outline: none; }
  #model-select option { color: #000; }
  .model-select-wrap { display: inline-flex; align-items: center; gap: 4px; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #84cc9a; display: inline-block; box-shadow: 0 0 6px #84cc9a; }
  .status-dot.low { background: #c3a1ad; box-shadow: 0 0 6px #c3a1ad; }
  
  .header-signature-wrap { position: relative; z-index: 1; margin-left: auto; display: inline-flex; align-items: center; cursor: pointer; }
  .sig-star { position: absolute; pointer-events: none; user-select: none; color: #ffffff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.9); }
  .sig-star.s-1 { top: -4px; left: -10px; font-size: 8px; animation: star-pulse 2.5s infinite ease-in-out; }
  .sig-star.s-2 { bottom: -4px; right: -10px; font-size: 10px; animation: star-pulse 1.8s infinite ease-in-out; }
  .header-signature { font-family: "Dancing Script", cursive; font-size: 20px; color: rgba(255, 255, 255, 0.92); text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); user-select: none; }

  /* ---- 聊天气泡与消息区 ---- */
  #messages {
    position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 20px 22px;
    display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch;
    background-size: cover; background-position: center; transition: background 0.3s;
  }
  .msg-row { display: flex; align-items: flex-start; gap: 10px; max-width: 88%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.charon { align-self: flex-start; }
  .msg-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .msg-col { display: flex; flex-direction: column; min-width: 0; }
  .msg-row.user .msg-col { align-items: flex-end; }
  .msg-row.charon .msg-col { align-items: flex-start; }
  .msg-time { font-size: 10px; color: #b08d98; margin: 4px 4px 0; }
  .msg-time-row { display: flex; align-items: center; gap: 4px; }

  /* 波普网点气泡 */
  .bubble {
    position: relative; padding: 12px 18px; line-height: 1.6; font-size: 14.5px; word-wrap: break-word; white-space: pre-wrap;
    -webkit-user-select: none; user-select: none; cursor: pointer;
  }
  .bubble.user {
    background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 15%, transparent 15.5%), radial-gradient(circle, rgba(255, 255, 255, 0.16) 15%, transparent 15.5%), linear-gradient(135deg, #f3b0c3, #e593a4);
    background-size: 6px 6px, 6px 6px, 100% 100%; background-position: 0 0, 3px 3px, 0 0;
    color: #ffffff; border-radius: 18px 4px 18px 18px; box-shadow: 0 4px 15px rgba(184, 96, 118, 0.18);
  }
  .bubble.charon {
    background: radial-gradient(circle, rgba(229, 153, 171, 0.08) 15%, transparent 15.5%), radial-gradient(circle, rgba(229, 153, 171, 0.08) 15%, transparent 15.5%), rgba(255, 255, 255, 0.65);
    background-size: 6px 6px, 6px 6px, 100% 100%; background-position: 0 0, 3px 3px, 0 0;
    border: none; color: #6b5460; border-radius: 4px 18px 18px 18px; box-shadow: 0 4px 15px rgba(184, 118, 138, 0.05);
  }
  .bubble.pending { opacity: 0.6; }

  /* 消息类型特化样式：图片、表情包、转账 */
  .bubble-img-container {
    max-width: 220px; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    cursor: zoom-in; border: 2px solid rgba(255,255,255,0.8);
  }
  .bubble-img-container img { width: 100%; display: block; object-fit: cover; transition: transform 0.2s ease; }
  .bubble-img-container:hover img { transform: scale(1.02); }
  .bubble-img-caption { font-size: 12px; margin-top: 5px; color: inherit; }

  .bubble-sticker-wrap {
    background: none !important; box-shadow: none !important; padding: 2px !important;
  }
  .bubble-sticker-wrap img {
    max-width: 120px; max-height: 120px; object-fit: contain; display: block; border-radius: 10px;
    filter: drop-shadow(0 4px 10px rgba(184, 118, 138, 0.15));
  }

  /* 浪漫转账心意卡片 */
  .transfer-card {
    min-width: 210px; padding: 14px 18px; border-radius: 18px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #ff8fa3 0%, #f7a8b8 50%, #fbd5dc 100%);
    box-shadow: 0 6px 20px rgba(255, 143, 163, 0.35); color: #fff; cursor: pointer;
  }
  .transfer-card::after {
    content: '🪙'; position: absolute; right: 10px; bottom: 8px; font-size: 42px; opacity: 0.2; pointer-events: none;
  }
  .transfer-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .transfer-icon-badge {
    width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .transfer-amount { font-family: "Georgia", serif; font-size: 22px; font-weight: bold; letter-spacing: 1px; }
  .transfer-desc { font-size: 13px; opacity: 0.95; margin-top: 4px; line-height: 1.4; word-break: break-all; }
  .transfer-footer { margin-top: 10px; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.4); font-size: 10px; opacity: 0.85; }

  /* 打字指示器 */
  .typing-dots { display: inline-flex; align-items: center; gap: 4px; padding: 2px 0; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.4;
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 0.9; }
  }

  /* 输入栏区域 */
  #input-bar {
    display: flex; align-items: flex-end; gap: 8px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255, 255, 255, 0.2); flex-shrink: 0; position: relative; z-index: 10;
    background: rgba(255, 245, 247, 0.45); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  }
  .input-tools-cluster { display: flex; gap: 6px; align-items: center; margin-bottom: 2px; }
  .tool-btn { width: 34px; height: 34px; font-size: 16px; }
  #input-bar textarea {
    position: relative; z-index: 1; flex: 1; min-width: 0; resize: none; border-radius: 18px; border: 1.5px solid rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #5a4550; padding: 9px 14px; font-size: 14.5px; font-family: inherit; max-height: 96px; outline: none;
    transition: background 0.2s ease, border-color 0.2s ease; box-shadow: 0 2px 8px rgba(184, 118, 138, 0.05);
  }
  #input-bar textarea:focus { background: rgba(255, 255, 255, 0.95); border-color: rgba(229, 153, 169, 0.9); }
  #input-bar textarea::placeholder { color: #b08d98; }

  /* ---- 右侧状态面板（DESK 手账区 - PC） ---- */
  #panel {
    width: 260px; flex-shrink: 0; display: flex; flex-direction: column;
    padding: 22px 18px; background: rgba(255, 235, 240, 0.55); border-radius: 24px; position: relative; overflow: hidden;
    box-shadow: 0 8px 32px rgba(184, 118, 138, 0.08);
  }
  #panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(to bottom, #ffeef1 0%, #ffeef1 20%, #ffffff 35%, #ffffff 65%, #ffeef1 80%, #ffeef1 100%);
    -webkit-mask-image: radial-gradient(circle, #000 15%, transparent 15.5%), radial-gradient(circle, #000 15%, transparent 15.5%);
    -webkit-mask-size: 14px 14px; -webkit-mask-position: 0 0, 7px 7px; pointer-events: none; z-index: 0; opacity: 0.85;
  }
  .panel-child { position: relative; z-index: 1; }
  .panel-title {
    font-family: "Georgia", "Songti SC", serif; font-size: 15px; letter-spacing: 3px; color: #a66275; margin-bottom: 6px; text-transform: uppercase; font-weight: bold;
  }

  /* 便签堆叠与抽屉样式保持统一 */
  .sticky-note-stack {
    position: relative; width: 100%; display: flex; flex-direction: column;
    margin-top: 15px; margin-bottom: 18px; z-index: 1;
  }
  .sticky-note-card {
    position: relative; border-radius: 3px 14px 14px 14px; padding: 12px 11px; width: 88%;
    aspect-ratio: 1 / 0.572; box-shadow: 0 8px 20px rgba(120, 80, 95, 0.18);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); cursor: pointer; flex-shrink: 0;
  }
  .sticky-note-text { font-size: 12.5px; line-height: 1.42; word-wrap: break-word; }
  .note-star-btn {
    position: absolute; bottom: 8px; right: 12px; background: none; border: none; font-size: 18px; cursor: pointer;
    color: #e5a4b5; padding: 2px;
  }
  .note-star-btn.active { color: #ff8fa3 !important; }

  .drawer-wrapper { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 10px; }
  .drawer-btn {
    background: rgba(255, 255, 255, 0.85); border: 1px solid #fff; border-radius: 12px; 
    padding: 12px 10px; text-align: center; cursor: pointer; position: relative;
    color: #a66275; font-family: "Georgia", serif; box-shadow: 0 4px 15px rgba(184, 118, 138, 0.08);
  }
  .drawer-btn-title { font-weight: bold; font-size: 12.5px; letter-spacing: 1px; }
  .drawer-btn-count { font-size: 10px; opacity: 0.75; font-family: "Courier New", monospace; }

  /* --- 朋友圈视图 (Moments) --- */
  #moments-wrapper {
    flex: 1; min-width: 0; display: none; flex-direction: column;
    background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border-radius: 28px; box-shadow: 0 12px 40px rgba(184, 118, 138, 0.10); overflow: hidden; position: relative;
  }
  #moments-feed {
    flex: 1; overflow-y: auto; padding: 0 0 80px 0; display: flex; flex-direction: column; gap: 20px;
    -webkit-overflow-scrolling: touch; position: relative; z-index: 1;
  }
  .moments-cover-section {
    position: relative; width: 100%; height: 240px;
    background: linear-gradient(135deg, #1a121e 0%, #2c1a30 40%, #cf7d90 85%, #ffb3c1 100%);
    overflow: hidden; margin-bottom: 40px; flex-shrink: 0;
  }
  .cover-branding-text { position: absolute; left: 22px; bottom: 24px; color: #ffffff; z-index: 2; }
  .cover-branding-text h1 { font-family: "Georgia", serif; font-size: 28px; font-style: italic; margin: 0; font-weight: 500; }
  .moments-user-profile { position: absolute; right: 24px; bottom: -25px; display: flex; align-items: flex-end; gap: 10px; z-index: 5; }
  .moments-avatar-polaroid {
    width: 76px; height: 76px; background: #fff; padding: 5px 5px 12px; border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); transform: rotate(-3deg);
  }
  .moments-avatar-polaroid img { width: 100%; height: 100%; object-fit: cover; }
  .profile-name-label { font-weight: bold; font-size: 16px; color: #ffb3c1; margin-bottom: 20px; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }
  .fab-publish-btn {
    position: absolute; right: 24px; bottom: 24px; width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, #f3b0c3, #e593a4); color: #fff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 8px 20px rgba(229, 147, 164, 0.4);
  }
  .moment-card-container { padding: 0 20px; width: 100%; }
  .moment-card {
    background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(10px); border-radius: 18px; padding: 18px;
    box-shadow: 0 6px 20px rgba(184, 118, 138, 0.05); border: 1px solid rgba(255, 255, 255, 0.9);
  }
  .moment-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .moment-author { font-weight: bold; color: #a66275; font-size: 14px; }
  .moment-time { font-family: "Courier New", monospace; font-size: 11px; color: #b08d98; }
  .moment-content { font-size: 14px; line-height: 1.6; color: #4a3742; margin-bottom: 14px; white-space: pre-wrap; }
  .moment-actions { display: flex; gap: 14px; align-items: center; padding-top: 10px; border-top: 1px dashed rgba(229,153,169,0.2); }
  .action-btn { background: none; border: none; font-size: 12.5px; color: #b08d98; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .action-btn.liked { color: #ff5e84; }
  .moment-likes { background: rgba(255, 238, 241, 0.45); border-radius: 8px; padding: 6px 10px; margin-top: 10px; font-size: 11.5px; color: #a66275; }
  .moment-comments { margin-top: 8px; background: rgba(255, 255, 255, 0.45); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }

  /* ---- 底部移动端 TAB 栏 ---- */
  #bottom-tabs { display: none; }

  /* ----------------------------------------------------------------
     隔离响应式控制体系：彻底解决手机与网页版相互干扰
  ----------------------------------------------------------------- */
  @media (min-width: 769px) {
    /* 桌面端特化控制 */
    .view-chat #main { display: flex !important; }
    .view-chat #panel { display: flex !important; }
    .view-chat #moments-wrapper { display: none !important; }

    .view-moments #main { display: none !important; }
    .view-moments #panel { display: none !important; }
    .view-moments #moments-wrapper { display: flex !important; }
  }

  @media (max-width: 768px) {
    /* 移动端特化控制：取消三栏并排，绝对单屏显示并防抖动 */
    #app {
      padding: 6px 6px calc(60px + env(safe-area-inset-bottom)) 6px;
      display: block; position: relative; height: 100vh; height: 100dvh;
    }
    #nav { display: none !important; }
    #main, #panel, #moments-wrapper {
      display: none !important; width: 100% !important; height: 100% !important;
      margin: 0 !important; border-radius: 20px !important;
    }
    
    .view-chat #main { display: flex !important; }
    .view-moments #moments-wrapper { display: flex !important; }
    .view-desk #panel { display: flex !important; }
    
    #bottom-tabs {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(52px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255, 240, 243, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.6); z-index: 1000; justify-content: space-around; align-items: center;
    }
    .tab-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b08d98; cursor: pointer; opacity: 0.6; transition: all 0.2s; width: 60px;
    }
    .tab-item svg { width: 20px; height: 20px; stroke-width: 1.5px; }
    .tab-item .tab-label { font-size: 9.5px; margin-top: 2px; font-weight: bold; }
    .tab-item.active { color: #ff5e84; opacity: 1; transform: translateY(-2px); }
  }

  /* ---- 弹窗公用基底 ---- */
  .custom-modal {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(26, 18, 30, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    z-index: 2500; align-items: center; justify-content: center; padding: 16px; animation: modal-fade 0.25s ease;
  }
  @keyframes modal-fade { from { opacity: 0; } to { opacity: 1; } }
  .letter-container {
    background: #fffdfd; border-radius: 16px; width: 100%; max-width: 440px; max-height: 82vh;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3); display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .letter-header {
    padding: 14px 18px; border-bottom: 1px dashed rgba(229,153,169,0.3); display: flex; justify-content: space-between; align-items: center;
  }
  .letter-title { font-family: "Georgia", "Songti SC", serif; color: #ff5e84; font-size: 15px; font-weight: bold; letter-spacing: 1.5px; }
  .close-modal { background: none; border: none; font-size: 22px; color: #a66275; cursor: pointer; padding: 0; line-height: 1; }
  .letter-content-area { padding: 18px; overflow-y: auto; flex: 1; font-size: 14px; color: #4a3742; line-height: 1.6; }

  /* 表情包选择器弹窗网格 */
  .stickers-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 10px 0;
  }
  .sticker-item-box {
    position: relative; aspect-ratio: 1; border-radius: 10px; background: rgba(255, 238, 241, 0.4);
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s;
  }
  .sticker-item-box:hover { transform: scale(1.06); background: rgba(255, 220, 227, 0.7); }
  .sticker-item-box img { width: 80%; height: 80%; object-fit: contain; }
  .sticker-delete-tag {
    position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; background: #ff5e84; color: #fff;
    border-radius: 50%; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  /* 转账与心意钱包卡片 */
  .wallet-balance-row {
    display: flex; gap: 12px; margin-bottom: 16px;
  }
  .wallet-card {
    flex: 1; background: linear-gradient(135deg, #fff0f3, #ffe3e8); border-radius: 12px; padding: 12px;
    border: 1px solid rgba(255, 143, 163, 0.3); text-align: center;
  }
  .wallet-card-name { font-size: 12px; color: #a66275; }
  .wallet-card-val { font-size: 20px; font-weight: bold; color: #ff5e84; font-family: "Georgia", serif; margin-top: 4px; }
  .transfer-history-item {
    display: flex; justify-content: space-between; align-items: center; padding: 8px 0;
    border-bottom: 1px solid rgba(0,0,0,0.04); font-size: 12px;
  }

  /* 图片预览浮层 */
  #image-lightbox {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); z-index: 3000; align-items: center; justify-content: center; cursor: zoom-out;
  }
  #image-lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
  
  /* 表单按钮 */
  .modal-form-btn {
    background: linear-gradient(135deg, #f3b0c3, #e593a4); color: #fff; border: none; border-radius: 10px;
    padding: 9px 18px; font-size: 13px; font-weight: bold; cursor: pointer; transition: opacity 0.2s;
  }
  .modal-form-btn:disabled { opacity: 0.5; }
  
  /* 全局悬浮气泡上下文菜单 */
  #bubble-menu {
    display: none; flex-direction: column; position: absolute; z-index: 1000; background: rgba(26, 18, 30, 0.95);
    backdrop-filter: blur(10px); border-radius: 8px; padding: 4px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
  }
  .bubble-menu-buttons-row { display: flex; }
  .menu-btn { background: none; border: none; color: #e2cbd4; font-size: 12px; padding: 6px 10px; cursor: pointer; }
  .menu-btn:hover { color: #ffb3c1; }
</style>

const contextMenu = document.getElementById('bubble-menu');

function apiUrl(path) {
  const sep = path.includes('?') ? '&' : '?';
  return CODE ? `${path}${sep}code=${encodeURIComponent(CODE)}` : path;
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return '';
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function openModal(id) { document.getElementById(id).style.display = 'flex'; }

function previewImage(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('image-lightbox').style.display = 'flex';
}

/* ---- 核心渲染器：支持 text / image / sticker / transfer ---- */
function renderMsgRow(role, content, createdAt, pending, msgId, model, isFailed, msgType = 'text', extra = null) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'charon');
  if (msgId) row.dataset.msgId = msgId;
  if (createdAt) row.dataset.createdAt = createdAt;

  const avatarWrap = document.createElement('div');
  avatarWrap.className = 'avatar-wrapper ' + (role === 'user' ? 'user' : 'charon');

  const tag = document.createElement('span');
  tag.className = 'avatar-tag';
  tag.textContent = role === 'user' ? NICKNAME_USER : NICKNAME_CHARON;
  avatarWrap.appendChild(tag);

  const avatar = document.createElement('img');
  avatar.className = 'msg-avatar';
  avatar.src = role === 'user' ? AVATAR_USER : AVATAR_CHARON;
  avatarWrap.appendChild(avatar);

  const star = document.createElement('span');
  star.className = 'star-accent';
  star.textContent = '✦';
  avatarWrap.appendChild(star);
  row.appendChild(avatarWrap);

  const col = document.createElement('div');
  col.className = 'msg-col';

  let bubble = document.createElement('div');
  bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'charon') + (pending ? ' pending' : '');

  // 1. 转账卡片
  if (msgType === 'transfer' && extra) {
    bubble.className = 'transfer-card';
    bubble.innerHTML = `
      <div class="transfer-top">
        <div class="transfer-icon-badge">🪙</div>
        <div>
          <div style="font-size:11px; opacity:0.9;">心意转账</div>
          <div class="transfer-amount">¥ ${extra.amount || 0}</div>
        </div>
      </div>
      <div class="transfer-desc">"${escapeHtml(extra.message || '给你的一份小心意')}"</div>
      <div class="transfer-footer">已存入心意钱包 · 点击可查看流水</div>
    `;
    bubble.onclick = openWalletModal;
  }
  // 2. 表情包卡片
  else if (msgType === 'sticker' && extra && extra.image_url) {
    bubble.className = 'bubble-sticker-wrap';
    bubble.innerHTML = `<img src="${extra.image_url}" alt="sticker">`;
  }
  // 3. 图片卡片
  else if (msgType === 'image' && extra && extra.image_url) {
    bubble.innerHTML = `
      <div class="bubble-img-container" onclick="previewImage('${extra.image_url}')">
        <img src="${extra.image_url}" alt="photo">
      </div>
      ${content && content !== '[图片]' ? `<div class="bubble-img-caption">${escapeHtml(content)}</div>` : ''}
    `;
  }
  // 4. 标准文字气泡
  else {
    if (pending && !content) {
      bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
    } else {
      bubble.textContent = content;
    }
  }

  col.appendChild(bubble);

  const timeRow = document.createElement('div');
  timeRow.className = 'msg-time-row';
  const timeEl = document.createElement('span');
  timeEl.className = 'msg-time';
  timeEl.textContent = formatTime(createdAt);
  timeRow.appendChild(timeEl);
  col.appendChild(timeRow);

  row.appendChild(col);
  return row;
}

function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

/* ---- 历史聊天消息拉取 ---- */
async function loadHistory() {
  try {
    const res = await fetch(apiUrl('/api/chat-messages'));
    const data = await res.json();
    messagesEl.innerHTML = '';
    if (!data.ok || !data.messages || data.messages.length === 0) {
      messagesEl.innerHTML = '<div id="empty-hint">还没有聊过，说点什么吧</div>';
      return;
    }
    data.messages.forEach(m => {
      messagesEl.appendChild(renderMsgRow(m.role, m.content, m.created_at, false, m.id, m.model, false, m.msg_type || 'text', m.extra));
    });
    scrollToBottom();
  } catch (e) {
    messagesEl.innerHTML = '<div id="empty-hint">网络错误，消息加载失败</div>';
  }
}

/* ---- 统一流式发送器 ---- */
async function executeChatSend(payload, placeholderContent = "", msgType = 'text', extra = null) {
  const nowIso = new Date().toISOString();
  const userRow = renderMsgRow('user', placeholderContent, nowIso, false, null, null, false, msgType, extra);
  messagesEl.appendChild(userRow);

  const pendingRow = renderMsgRow('charon', '', nowIso, true);
  messagesEl.appendChild(pendingRow);
  scrollToBottom();
  const pendingBubble = pendingRow.querySelector('.bubble');

  try {
    const res = await fetch(apiUrl('/api/chat-send'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    if (!res.ok || !res.body) throw new Error();

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let sawDone = false;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data: ')) continue;
        const evt = JSON.parse(line.slice(6));
        if (evt.delta) {
          pendingBubble.textContent += evt.delta;
          scrollToBottom();
        } else if (evt.done) {
          sawDone = true;
          if (evt.reply) {
            pendingRow.replaceWith(renderMsgRow('charon', evt.reply, nowIso, false, evt.charon_msg_id, evt.model));
          }
        }
      }
    }
    if (!sawDone) {
      pendingRow.replaceWith(renderMsgRow('charon', pendingBubble.textContent || '（收到）', nowIso, false));
    }
  } catch (e) {
    pendingRow.replaceWith(renderMsgRow('charon', '（网络稍有波动，未发出去）', nowIso, false, null, null, true));
  }
  scrollToBottom();
  loadStatus();
}

/* ---- 发送文字消息 ---- */
async function sendTextMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = ''; inputEl.style.height = 'auto'; sendBtn.disabled = true;
  await executeChatSend({ message: text }, text, 'text');
  sendBtn.disabled = false;
}

/* ---- 发送图片流程 (chat-upload-image -> chat-send) ---- */
async function handleImageFileSelect(fileInput) {
  const file = fileInput.files[0];
  if (!file) return;
  fileInput.value = '';

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch(apiUrl('/api/chat-upload-image'), { method: 'POST', body: formData });
    const data = await res.json();
    if (data.ok && data.image_url) {
      await executeChatSend(
        { msg_type: 'image', image_url: data.image_url, message: '' },
        '[图片]', 'image', { image_url: data.image_url }
      );
    } else {
      alert('图片上传失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('网络错误，图片上传失败');
  }
}

/* ---- 发送转账流程 ---- */
function openTransferModal() { openModal('transfer-modal'); }
async function submitChatTransfer() {
  const amt = parseInt(document.getElementById('transfer-amount-input').value);
  const msg = document.getElementById('transfer-msg-input').value.trim() || '心意已寄达';
  if (!amt || amt <= 0) { alert('请输入正确的转账金额'); return; }

  closeModal('transfer-modal');
  await executeChatSend(
    { msg_type: 'transfer', amount: amt, message: msg },
    `[转账 ${amt} 心意币]`, 'transfer', { amount: amt, message: msg }
  );
  document.getElementById('transfer-amount-input').value = '';
  document.getElementById('transfer-msg-input').value = '';
}

/* ---- 表情包管理 ---- */
function openStickersModal() {
  openModal('stickers-modal');
  loadStickersList();
}

async function loadStickersList() {
  const box = document.getElementById('stickers-list-box');
  box.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#b08d98;">加载表情中…</div>';
  try {
    const res = await fetch(apiUrl('/api/stickers'));
    const data = await res.json();
    if (data.ok && data.stickers) {
      box.innerHTML = '';
      data.stickers.forEach(stk => {
        const item = document.createElement('div');
        item.className = 'sticker-item-box';
        item.innerHTML = `
          <img src="${stk.image_url}">
          <span class="sticker-delete-tag" onclick="event.stopPropagation(); deleteSticker('${stk.id}')">×</span>
        `;
        item.onclick = () => {
          closeModal('stickers-modal');
          executeChatSend(
            { msg_type: 'sticker', sticker_id: stk.id, image_url: stk.image_url },
            '[表情]', 'sticker', { sticker_id: stk.id, image_url: stk.image_url }
          );
        };
        box.appendChild(item);
      });
    }
  } catch (e) {
    box.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#b08d98;">无法加载表情包</div>';
  }
}

async function handleStickerUpload(fileInput) {
  const file = fileInput.files[0];
  if (!file) return;
  fileInput.value = '';

  const formData = new FormData();
  formData.append('file', file);
  formData.append('uploaded_by', 'user');

  try {
    const res = await fetch(apiUrl('/api/stickers/upload'), { method: 'POST', body: formData });
    const data = await res.json();
    if (data.ok) loadStickersList();
    else alert('表情上传失败：' + (data.error || '未知错误'));
  } catch(e) { alert('网络错误'); }
}

async function deleteSticker(id) {
  if (!confirm('确定删除该表情吗？')) return;
  try {
    const res = await fetch(apiUrl('/api/stickers/delete'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id })
    });
    const data = await res.json();
    if (data.ok) loadStickersList();
  } catch (e) {}
}

/* ---- 钱包余额与明细查看 ---- */
async function openWalletModal() {
  openModal('wallet-modal');
  try {
    const [bRes, tRes] = await Promise.all([
      fetch(apiUrl('/api/wallet/balance')),
      fetch(apiUrl('/api/wallet/transfers'))
    ]);
    const bData = await bRes.json();
    const tData = await tRes.json();

    if (bData.ok && bData.balance) {
      document.getElementById('wallet-user-val').textContent = bData.balance.user || 0;
      document.getElementById('wallet-charon-val').textContent = bData.balance.charon || 0;
    }
    const listEl = document.getElementById('wallet-transfers-list');
    listEl.innerHTML = '';
    if (tData.ok && tData.transfers && tData.transfers.length > 0) {
      tData.transfers.forEach(t => {
        const item = document.createElement('div');
        item.className = 'transfer-history-item';
        const sender = t.from_user === 'user' ? NICKNAME_USER : NICKNAME_CHARON;
        item.innerHTML = `
          <div>
            <div style="font-weight:bold; color:#5a4550;">${sender}：${escapeHtml(t.message || '转账')}</div>
            <div style="color:#b08d98; font-size:10px;">${formatTime(t.created_at)} · ${t.created_at ? t.created_at.substring(0,10) : ''}</div>
          </div>
          <div style="font-size:14px; font-weight:bold; color:#ff5e84;">+${t.amount}</div>
        `;
        listEl.appendChild(item);
      });
    } else {
      listEl.innerHTML = '<div style="text-align:center; color:#b08d98; padding:20px;">暂无转账流水</div>';
    }
  } catch (e) {}
}

/* ---- 个人主页与资料设置 ---- */
async function openProfileModal() {
  openModal('profile-modal');
  try {
    const res = await fetch(apiUrl('/api/profile'));

function triggerAvatarUpload(role) {
  uploadTargetUser = role;
  document.getElementById('avatar-file-input').click();
}

async function handleAvatarUpload(fileInput) {
  const file = fileInput.files[0];
  if (!file) return;
  fileInput.value = '';

  const formData = new FormData();
  formData.append('file', file);
  formData.append('user_id', uploadTargetUser);

  try {
    const res = await fetch(apiUrl('/api/profile/avatar'), { method: 'POST', body: formData });
    const data = await res.json();
    if (data.ok && data.profile) {
      if (uploadTargetUser === 'user') {
        AVATAR_USER = data.profile.avatar_url;
        document.getElementById('edit-avatar-user').src = AVATAR_USER;
      } else {
        AVATAR_CHARON = data.profile.avatar_url;
        document.getElementById('header-avatar').src = AVATAR_CHARON;
        document.getElementById('edit-avatar-charon').src = AVATAR_CHARON;
      }
      alert('头像更换成功');
    } else {
      alert('上传失败：' + (data.error || '未知错误'));
    }
  } catch (e) { alert('网络错误'); }
}

async function saveProfileChanges() {
  const uNick = document.getElementById('profile-nickname-user').value.trim();
  const cNick = document.getElementById('profile-nickname-charon').value.trim();
  const bg = document.getElementById('profile-chat-bg').value.trim();

  try {
    await Promise.all([
      fetch(apiUrl('/api/profile/update'), {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ user_id: 'user', nickname: uNick, chat_background: bg })
      }),
      fetch(apiUrl('/api/profile/update'), {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ user_id: 'charon', nickname: cNick })
      })
    ]);
    NICKNAME_USER = uNick || NICKNAME_USER;
    NICKNAME_CHARON = cNick || NICKNAME_CHARON;
    document.getElementById('user-header-sign').textContent = '@' + NICKNAME_USER;
    document.getElementById('charon-brand-title').textContent = NICKNAME_CHARON.toUpperCase();

    if (bg) {
      if (bg.startsWith('http') || bg.startsWith('/')) {
        messagesEl.style.backgroundImage = `url("${bg}")`;
      } else {
        messagesEl.style.background = bg;
      }
    }
    closeModal('profile-modal');
    loadHistory();
  } catch (e) { alert('保存失败'); }
}

/* ---- 朋友圈（已依后端新顺序：新 -> 旧） ---- */
async function fetchMoments() {
  const feed = document.getElementById('moments-feed');
  feed.innerHTML = '<div style="text-align:center; color:#b08d98; margin-top:60px;">加载朋友圈中…</div>';
  try {
    const res = await fetch(apiUrl('/api/moments'));
    const data = await res.json();
    if (data.ok) renderMoments(data.moments);
  } catch (e) { feed.innerHTML = '<div style="text-align:center; color:#b08d98; margin-top:60px;">加载朋友圈失败</div>'; }
}

function renderMoments(moments) {
  const feed = document.getElementById('moments-feed');
  feed.innerHTML = '';

  const cover = document.createElement('div');
  cover.className = 'moments-cover-section';
  cover.innerHTML = `
    <div class="cover-branding-text">
      <h1>MOMENTS</h1>
      <p style="font-size:11px; margin:4px 0 0; opacity:0.8;">双人专属朋友圈 · 记录生活与温柔</p>
    </div>
    <div class="moments-user-profile">
      <div class="profile-name-label">${NICKNAME_USER}</div>
      <div class="moments-avatar-polaroid"><img src="${AVATAR_USER}"></div>
    </div>
  `;
  feed.appendChild(cover);

  if (!moments || moments.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'text-align:center; color:#b08d98; padding:30px;';
    empty.textContent = '空间空空的，发一条记录此刻吧。';
    feed.appendChild(empty);
    return;
  }

  // 直接按新到旧自然顺序展示，不进行 reverse
  moments.forEach(m => {
    const isUser = m.author === 'user';
    const authorName = isUser ? NICKNAME_USER : NICKNAME_CHARON;
    const authorAvatar = isUser ? AVATAR_USER : AVATAR_CHARON;
    const isLiked = m.likes && m.likes.includes('user');

    const card = document.createElement('div');
    card.className = 'moment-card-container';
    card.innerHTML = `
      <div class="moment-card">
        <div class="moment-header">
          <img src="${authorAvatar}" style="width:34px; height:34px; border-radius:50%; object-fit:cover;">
          <div>
            <div class="moment-author">${authorName}</div>
            <div class="moment-time">${formatTime(m.created_at)}</div>
          </div>
        </div>
        <div class="moment-content">${escapeHtml(m.content)}</div>
        <div class="moment-actions">
          <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${m.id}')">♥ ${isLiked ? '已赞' : '点赞'}</button>
        </div>
      </div>
    `;
    feed.appendChild(card);
  });
}

function openPublishModal() { openModal('publish-modal'); }
async function submitMoment() {
  const content = document.getElementById('moment-input-textarea').value.trim();
  if (!content) return;
  const btn = document.getElementById('moment-save-btn');
  btn.disabled = true;
  try {
    const res = await fetch(apiUrl('/api/moments'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content })
    });
    const data = await res.json();
    if (data.ok) {
      closeModal('publish-modal');
      document.getElementById('moment-input-textarea').value = '';
      fetchMoments();
    }
  } catch (e) { alert('发布失败'); }
  btn.disabled = false;
}

async function toggleLike(id) {
  try {
    const res = await fetch(apiUrl('/api/moments/like'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id })
    });
    const data = await res.json();
    if (data.ok) fetchMoments();
  } catch (e) {}
}

/* ---- 统一视图切换（彻底解决冲突） ---- */
function switchTab(tabName) {
  const app = document.getElementById('app');
  app.className = 'view-' + tabName;

  document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
  const tabs = document.querySelectorAll('.tab-item');
  if (tabName === 'chat') {
    if (tabs[0]) tabs[0].classList.add('active');
    scrollToBottom();
  } else if (tabName === 'moments') {
    if (tabs[1]) tabs[1].classList.add('active');
    fetchMoments();
  } else if (tabName === 'desk') {
    if (tabs[2]) tabs[2].classList.add('active');
  }
}

/* ---- 初始化与状态拉取 ---- */
async function loadStatus() {
  try {
    const res = await fetch(apiUrl('/api/chat-status'));
    const data = await res.json();
    if (!data.ok) return;
    statusLabel.textContent = data.status_label || '在线';
    document.getElementById('status-dot').className = 'status-dot' + (data.mood_score < 50 ? ' low' : '');

    const container = document.getElementById('sticky-container');
    container.innerHTML = '';
    if (data.sticky_notes && data.sticky_notes.length > 0) {
      data.sticky_notes.forEach((note, idx) => {
        const card = document.createElement('div');
        card.className = 'sticky-note-card';
        card.style.background = '#ffe3e7';
        card.style.margin = idx === 0 ? '0 auto' : '-24px auto 0';
        card.style.zIndex = 15 - idx;
        card.innerHTML = `<div class="sticky-note-text">${escapeHtml(note.message)}</div>`;
        container.appendChild(card);
      });
    }
  } catch (e) {}
}
